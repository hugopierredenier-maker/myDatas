<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transports IDF — Prochains passages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f4f0; --surface: #ffffff; --border: rgba(0,0,0,0.09);
      --text: #1a1a1a; --muted: #6b6b6b; --accent: #1a56db; --accent-bg: #eef3ff;
      --danger-bg: #fef2f2; --danger-border: #dc2626; --danger-text: #7f1d1d;
      --warn-bg: #fffbeb; --warn-border: #d97706; --warn-text: #92400e;
      --info-bg: #eff6ff; --info-border: #3b82f6; --info-text: #1e40af;
      --success: #15803d; --radius: 14px; --radius-sm: 9px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111110; --surface: #1c1c1b; --border: rgba(255,255,255,0.09);
        --text: #f0ede8; --muted: #888885; --accent: #5b8af5; --accent-bg: #1a2540;
        --danger-bg: #2a1010; --danger-border: #dc2626; --danger-text: #fca5a5;
        --warn-bg: #2a1a00; --warn-border: #d97706; --warn-text: #fbbf24;
        --info-bg: #0f1f40; --info-border: #3b82f6; --info-text: #93c5fd;
      }
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .app { max-width: 600px; margin: 0 auto; padding: 2rem 1rem 4rem; }
    header { margin-bottom: 2rem; }
    header h1 { font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    header p { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .search-bar { display: flex; gap: 8px; margin-bottom: 1rem; }
    .search-wrapper { position: relative; flex: 1; }
    .search-wrapper input { width: 100%; }
    .search-bar input {
      height: 42px; padding: 0 14px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text);
      font-family: inherit; font-size: 14px; outline: none; transition: border-color 0.15s;
    }
    .search-bar input:focus { border-color: var(--accent); }
    .search-bar button {
      height: 42px; padding: 0 18px; border-radius: var(--radius-sm);
      font-family: inherit; font-size: 14px; font-weight: 500;
      cursor: pointer; border: none; background: var(--accent); color: #fff;
    }
    .search-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
    .autocomplete-list {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      z-index: 100; overflow: hidden; max-height: 320px; overflow-y: auto;
    }
    .autocomplete-list:empty { display: none; }
    .ac-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; cursor: pointer;
      border-bottom: 1px solid var(--border); transition: background 0.1s;
    }
    .ac-item:last-child { border-bottom: none; }
    .ac-item:hover, .ac-item.active { background: var(--accent-bg); }
    .ac-item-name { font-size: 14px; font-weight: 500; }
    .ac-item-sub  { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .hints { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.5rem; }
    .hint-chip {
      font-size: 12px; padding: 4px 10px; border-radius: 99px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--muted); cursor: pointer; transition: all 0.12s;
    }
    .hint-chip:hover { border-color: var(--accent); color: var(--accent); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 8px; }
    .list-item {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 16px; cursor: pointer;
      border-bottom: 1px solid var(--border); transition: background 0.12s;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item:hover { background: var(--bg); }
    .item-info { flex: 1; min-width: 0; }
    .item-name { font-size: 14px; font-weight: 500; }
    .item-sub  { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .dep-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 16px; border-bottom: 1px solid var(--border); gap: 12px;
    }
    .dep-item:last-child { border-bottom: none; }
    .dep-left  { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .dep-dest  { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dep-mode  { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .dep-right { text-align: right; flex-shrink: 0; }
    .dep-time  { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .dep-wait  { font-size: 12px; color: var(--muted); margin-top: 2px; font-weight: 400; }
    .dep-wait.soon { color: var(--success); font-weight: 600; }
    .dep-wait.quai { color: var(--accent); font-weight: 600; }
    .section-label {
      font-size: 12px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em; padding: 0 0 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .breadcrumb { font-size: 12px; color: var(--muted); margin-bottom: 1rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .breadcrumb span { cursor: pointer; }
    .breadcrumb span:hover { color: var(--accent); text-decoration: underline; }
    .breadcrumb .sep { opacity: 0.4; }
    .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 14px; }
    .empty .icon { font-size: 36px; margin-bottom: 12px; }
    .error-box {
      background: var(--danger-bg); border: 1px solid var(--danger-border);
      border-radius: var(--radius-sm); padding: 12px 16px;
      font-size: 13px; color: var(--danger-text);
    }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid var(--border); border-top-color: var(--muted);
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: -3px; margin-right: 6px;
    }
    .fresh {
      display: inline-block; font-size: 10px; font-weight: 500; padding: 1px 6px;
      border-radius: 99px; margin-left: 6px; vertical-align: middle;
    }
    .fresh-rt { background: #dcfce7; color: #166534; }
    .fresh-th { background: #fef9c3; color: #713f12; }
    @media (prefers-color-scheme: dark) {
      .fresh-rt { background: #14532d; color: #86efac; }
      .fresh-th { background: #422006; color: #fde68a; }
    }
    .refresh-btn {
      width: 100%; height: 38px; border-radius: var(--radius-sm);
      font-family: inherit; font-size: 13px; font-weight: 500;
      cursor: pointer; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted); margin-top: 8px;
    }
    .refresh-btn:hover { background: var(--bg); }

    /* ── Perturbations ── */
    .disruption {
      border-radius: var(--radius-sm); padding: 12px 14px;
      margin-bottom: 8px; border-left: 4px solid;
    }
    .disruption.blocking   { background: var(--danger-bg); border-color: var(--danger-border); }
    .disruption.warning    { background: var(--warn-bg);   border-color: var(--warn-border);   }
    .disruption.info       { background: var(--info-bg);   border-color: var(--info-border);   }
    .disruption-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .disruption-icon   { font-size: 16px; flex-shrink: 0; }
    .disruption-cause  { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .disruption.blocking .disruption-cause { color: var(--danger-text); }
    .disruption.warning  .disruption-cause { color: var(--warn-text);   }
    .disruption.info     .disruption-cause { color: var(--info-text);   }
    .disruption-msg  { font-size: 13px; line-height: 1.5; }
    .disruption.blocking .disruption-msg { color: var(--danger-text); }
    .disruption.warning  .disruption-msg { color: var(--warn-text);   }
    .disruption.info     .disruption-msg { color: var(--info-text);   }
    .disruption-period { font-size: 11px; opacity: .75; margin-top: 5px; }
    .disruption-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600; padding: 2px 7px;
      border-radius: 99px; margin-left: 6px; vertical-align: middle;
      cursor: default;
    }
    .disruption-badge.blocking { background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); }
    .disruption-badge.warning  { background: var(--warn-bg);   color: var(--warn-text);   border: 1px solid var(--warn-border);   }
    .disruption-badge.info     { background: var(--info-bg);   color: var(--info-text);   border: 1px solid var(--info-border);   }

    /* Collapsible disruptions */
    .disruptions-toggle {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: none; border: none; cursor: pointer;
      font-family: inherit; font-size: 13px; font-weight: 500; color: var(--text);
      border-top: 1px solid var(--border);
    }
    .disruptions-toggle:hover { background: var(--bg); }
    .disruptions-toggle .arrow { transition: transform .2s; font-size: 11px; color: var(--muted); }
    .disruptions-toggle.open .arrow { transform: rotate(180deg); }
    .disruptions-body { padding: 0 14px 14px; display: none; }
    .disruptions-body.open { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>🚇 Transports IDF</h1>
    <p>Horaires temps réel — Bus, Métro, RER, Tram</p>
  </header>

  <div class="search-bar">
    <div class="search-wrapper">
      <input type="text" id="search-input" placeholder="Ex: Les Moulineaux, Châtelet, Nation…" autocomplete="off" />
      <div class="autocomplete-list" id="ac-list"></div>
    </div>
    <button id="search-btn" onclick="searchStops()">Rechercher</button>
  </div>

  <div class="hints">
    <span class="hint-chip" onclick="fillAndSearch('Les Moulineaux')">Les Moulineaux</span>
    <span class="hint-chip" onclick="fillAndSearch('Châtelet')">Châtelet</span>
    <span class="hint-chip" onclick="fillAndSearch('Nation')">Nation</span>
    <span class="hint-chip" onclick="fillAndSearch('Gare du Nord')">Gare du Nord</span>
    <span class="hint-chip" onclick="fillAndSearch('La Défense')">La Défense</span>
  </div>

  <div class="breadcrumb" id="breadcrumb" style="display:none;"></div>

  <div id="view-search">
    <div class="empty" id="search-empty"><div class="icon">🔍</div>Tape le nom d'un arrêt pour commencer.</div>
    <div id="search-results"></div>
  </div>
  <div id="view-lines"      style="display:none;"><div id="lines-content"></div></div>
  <div id="view-directions" style="display:none;"><div id="directions-content"></div></div>
  <div id="view-departures" style="display:none;"><div id="departures-content"></div></div>
</div>

<script>
  let state = {
    stopAreaId:'', stopAreaName:'',
    lineId:'', lineInfo:null, lineRef:'',
    currentTerminus:'', currentStopPointIds:[],
    currentStopAreaId:'', currentStopAreaName:'', currentLineName:''
  };

  async function callProxy(endpoint, params={}) {
    const qs = new URLSearchParams({ endpoint, ...params }).toString();
    const r = await fetch('/api/prim?' + qs);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  function showView(name) {
    ['search','lines','directions','departures'].forEach(v =>
      document.getElementById('view-'+v).style.display = v===name ? 'block' : 'none'
    );
  }

  function updateBreadcrumb(items) {
    const bc = document.getElementById('breadcrumb');
    if (!items.length) { bc.style.display='none'; return; }
    bc.style.display='flex';
    bc.innerHTML = items.map((it,i) =>
      i < items.length-1
        ? `<span onclick="${it.fn}">${it.label}</span><span class="sep">›</span>`
        : `<strong>${it.label}</strong>`
    ).join('');
  }

  function formatTime(d) {
    return d ? d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : '—';
  }

  function textColor(hex) {
    hex=(hex||'').replace('#',''); if(hex.length!==6) return '#fff';
    const r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
    return (r*299+g*587+b*114)/1000>128 ? '#000' : '#fff';
  }

  function lineIcon(info, size=30) {
    const code = String(info.code||info.label||'?');
    const mode = (info.commercial_mode||'').toLowerCase();
    const bg   = info.color ? '#'+info.color.replace('#','') : '#888';
    const fg   = textColor(info.color||'888888');
    const cx=size/2, cy=size/2;
    const fs = code.length<=2?Math.round(size*.46):code.length===3?Math.round(size*.34):Math.round(size*.27);
    let shape, w=size;
    if (mode.includes('métro')||mode.includes('metro')) {
      shape=`<circle cx="${cx}" cy="${cy}" r="${cx-.5}" fill="${bg}"/>`;
    } else if (mode.includes('rer')||mode.includes('transilien')||mode.includes('train')) {
      const rx=Math.round(size*.22);
      shape=`<rect x=".5" y=".5" width="${size-1}" height="${size-1}" rx="${rx}" fill="${bg}"/>`;
    } else if (mode.includes('tram')) {
      shape=`<polygon points="${cx},.5 ${size-.5},${cy} ${cx},${size-.5} .5,${cy}" fill="${bg}"/>`;
    } else {
      const charW=fs*.65; w=Math.max(size,Math.round(charW*code.length+size*.5));
      const rx=Math.round(size*.22);
      shape=`<rect x=".5" y=".5" width="${w-1}" height="${size-1}" rx="${rx}" fill="${bg}"/>`;
      return `<svg width="${w}" height="${size}" viewBox="0 0 ${w} ${size}" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;flex-shrink:0;"><title>Ligne ${code}</title>${shape}<text x="${w/2}" y="${cy}" dominant-baseline="central" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="${fs}" font-weight="700" fill="${fg}">${code}</text></svg>`;
    }
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;flex-shrink:0;"><title>Ligne ${code}</title>${shape}<text x="${cx}" y="${cy}" dominant-baseline="central" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="${fs}" font-weight="700" fill="${fg}">${code}</text></svg>`;
  }

  function getModeIcon(name) {
    const m=(name||'').toLowerCase();
    if (m.includes('métro')||m.includes('metro')) return '🚇';
    if (m.includes('rer')||m.includes('transilien')||m.includes('train')) return '🚆';
    if (m.includes('tram')) return '🚊';
    if (m.includes('bus')||m.includes('noctilien')) return '🚌';
    return '🚉';
  }

  function toLineRef(lineId, lineCodes) {
    if (lineCodes && Array.isArray(lineCodes)) {
      const src = lineCodes.find(c => c.type==='source');
      if (src) { const m=src.value.match(/Line:(C[\w-]+)/); if (m) return `STIF:Line::${m[1]}:`; }
    }
    const m = lineId.match(/IDFM:(C[\w-]+)/);
    return m ? `STIF:Line::${m[1]}:` : null;
  }

  function extractNumericId(id) {
    if (!id) return null;
    const m = id.match(/:(\d+)$/);
    return m ? m[1] : null;
  }

  function toMonitoringRef(spId) {
    const m = spId.match(/:(\d+)$/);
    return m ? `STIF:StopPoint:Q:${m[1]}:` : null;
  }

  function normalize(s) { return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
  function loosMatch(a,b) {
    const na=normalize(a), nb=normalize(b);
    if (na===nb||na.includes(nb)||nb.includes(na)) return true;
    const wa=na.split(/\s+/).find(w=>w.length>=4);
    const wb=nb.split(/\s+/).find(w=>w.length>=4);
    return wa&&wb&&wa===wb;
  }

  function navitiaToISO(str) {
    if (!str) return null;
    return `${str.slice(0,4)}-${str.slice(4,6)}-${str.slice(6,8)}T${str.slice(9,11)}:${str.slice(11,13)}:${str.slice(13,15)}`;
  }

  function fillAndSearch(name) {
    document.getElementById('search-input').value = name;
    closeAC(); searchStops();
  }

  // ── Perturbations ────────────────────────────────────────────────────────────
  function disruptionLevel(cause, effect) {
    const c=(cause||'').toLowerCase(), e=(effect||'').toLowerCase();
    if (e.includes('no_service')||e.includes('significant')||c.includes('accident')||c.includes('travaux')) return 'blocking';
    if (e.includes('reduced')||e.includes('detour')||c.includes('perturbation')||c.includes('incident')) return 'warning';
    return 'info';
  }

  function disruptionIcon(level) {
    if (level==='blocking') return '🚫';
    if (level==='warning')  return '⚠️';
    return 'ℹ️';
  }

  function formatPeriod(periods) {
    if (!periods||!periods.length) return '';
    const p = periods[0];
    const from = p.begin ? new Date(p.begin).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
    const to   = p.end   ? new Date(p.end).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
    if (from && to) return `Du ${from} au ${to}`;
    if (from) return `Depuis le ${from}`;
    return '';
  }

  async function fetchDisruptions(lineId) {
    try {
      const data = await callProxy('v2/navitia/lines/'+lineId+'/disruptions', {count:20});
      return data.disruptions || [];
    } catch(e) {
      return [];
    }
  }

  function renderDisruptionBadge(disruptions) {
    if (!disruptions.length) return '';
    const blocking = disruptions.filter(d=>disruptionLevel(d.cause,d.disruption_effect||d.effect)==='blocking').length;
    const warning  = disruptions.filter(d=>disruptionLevel(d.cause,d.disruption_effect||d.effect)==='warning').length;
    const info     = disruptions.filter(d=>disruptionLevel(d.cause,d.disruption_effect||d.effect)==='info').length;
    if (blocking) return `<span class="disruption-badge blocking">🚫 ${blocking} perturbation${blocking>1?'s':''}</span>`;
    if (warning)  return `<span class="disruption-badge warning">⚠️ ${warning} avertissement${warning>1?'s':''}</span>`;
    if (info)     return `<span class="disruption-badge info">ℹ️ ${info} info${info>1?'s':''}</span>`;
    return '';
  }

  function renderDisruptionsBlock(disruptions, container) {
    if (!disruptions.length) return;

    const blocking = disruptions.filter(d=>disruptionLevel(d.cause,d.disruption_effect||d.effect)==='blocking').length;
    const warning  = disruptions.filter(d=>disruptionLevel(d.cause,d.disruption_effect||d.effect)==='warning').length;
    const count = disruptions.length;
    const topLevel = blocking ? 'blocking' : warning ? 'warning' : 'info';
    const icons = blocking ? '🚫' : warning ? '⚠️' : 'ℹ️';
    const label = `${icons} ${count} message${count>1?'s':(topLevel==='blocking'?' de perturbation':topLevel==='warning'?" d'avertissement":"d'information")}`;

    const wrapper = document.createElement('div');
    wrapper.style.cssText='background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:8px;';

    const toggle = document.createElement('button');
    toggle.className='disruptions-toggle';
    toggle.innerHTML=`<span>${label}</span><span class="arrow">▼</span>`;
    toggle.onclick=()=>{
      toggle.classList.toggle('open');
      body.classList.toggle('open');
    };

    const body = document.createElement('div');
    body.className='disruptions-body';

    disruptions.forEach(d => {
      const level = disruptionLevel(d.cause, d.disruption_effect||d.effect);
      const icon  = disruptionIcon(level);
      const cause = d.cause || d.category || 'Information';
      const msgs  = (d.messages||[]).map(m=>m.text).filter(Boolean);
      const msg   = msgs.join(' ') || d.title || d.header || '';
      const period= formatPeriod(d.application_periods||d.periods);

      const div = document.createElement('div');
      div.className='disruption '+level;
      div.innerHTML=`
        <div class="disruption-header">
          <span class="disruption-icon">${icon}</span>
          <span class="disruption-cause">${cause}</span>
        </div>
        ${msg ? `<div class="disruption-msg">${msg}</div>` : ''}
        ${period ? `<div class="disruption-period">🕐 ${period}</div>` : ''}
      `;
      body.appendChild(div);
    });

    wrapper.appendChild(toggle);
    wrapper.appendChild(body);
    container.appendChild(wrapper);
  }

  // ── Autocomplete ────────────────────────────────────────────────────────────
  let acTimer=null, acIndex=-1, acResults=[];
  const inputEl = document.getElementById('search-input');
  const acList  = document.getElementById('ac-list');

  inputEl.addEventListener('input', () => {
    clearTimeout(acTimer);
    const q = inputEl.value.trim();
    if (q.length < 2) { closeAC(); return; }
    acTimer = setTimeout(() => fetchAC(q), 250);
  });
  inputEl.addEventListener('keydown', e => {
    if (e.key==='Enter')     { if (acIndex>=0&&acResults[acIndex]) { selectAC(acResults[acIndex]); return; } closeAC(); searchStops(); return; }
    if (e.key==='ArrowDown') { e.preventDefault(); moveAC(1); return; }
    if (e.key==='ArrowUp')   { e.preventDefault(); moveAC(-1); return; }
    if (e.key==='Escape')    { closeAC(); return; }
  });
  document.addEventListener('click', e => { if (!e.target.closest('.search-wrapper')) closeAC(); });

  async function fetchAC(q) {
    acList.innerHTML='<div style="padding:14px;text-align:center;font-size:13px;color:var(--muted);"><span class="spinner"></span></div>';
    try {
      const data=await callProxy('v2/navitia/places',{q,count:8});
      acResults=(data.places||[]).filter(p=>p.embedded_type==='stop_area'||p.embedded_type==='stop_point');
      renderAC();
    } catch { closeAC(); }
  }
  function renderAC() {
    acIndex=-1;
    if (!acResults.length) { acList.innerHTML=''; return; }
    acList.innerHTML=acResults.map((p,i)=>{
      const s=p.stop_area||p.stop_point;
      const modes=(s.physical_modes||[]).map(m=>m.name).join(', ');
      return `<div class="ac-item" data-i="${i}"><div style="font-size:18px;flex-shrink:0;">📍</div><div><div class="ac-item-name">${s.name}</div>${modes?`<div class="ac-item-sub">${modes}</div>`:''}</div></div>`;
    }).join('');
    acList.querySelectorAll('.ac-item').forEach(el=>{
      const i=+el.dataset.i;
      el.addEventListener('mousedown',e=>{e.preventDefault();selectAC(acResults[i]);});
    });
  }
  function moveAC(dir) {
    const items=acList.querySelectorAll('.ac-item'); if (!items.length) return;
    items[acIndex]?.classList.remove('active');
    acIndex=Math.max(0,Math.min(acResults.length-1,acIndex+dir));
    items[acIndex]?.classList.add('active');
    items[acIndex]?.scrollIntoView({block:'nearest'});
  }
  function selectAC(place) {
    const s=place.stop_area||place.stop_point;
    inputEl.value=s.name; closeAC();
    loadLines(s.id,s.name);
  }
  function closeAC() { acList.innerHTML=''; acIndex=-1; acResults=[]; }

  // ── Vue 1 : Recherche ───────────────────────────────────────────────────────
  async function searchStops() {
    const q=document.getElementById('search-input').value.trim(); if (!q) return;
    const btn=document.getElementById('search-btn');
    btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';
    showView('search'); updateBreadcrumb([]);
    const empty=document.getElementById('search-empty');
    const results=document.getElementById('search-results');
    empty.innerHTML='<span class="spinner"></span> Recherche…'; empty.style.display='block'; results.innerHTML='';
    try {
      const data=await callProxy('v2/navitia/places',{q,count:10});
      const places=(data.places||[]).filter(p=>p.embedded_type==='stop_area'||p.embedded_type==='stop_point');
      empty.style.display='none';
      if (!places.length) { empty.innerHTML=`<div class="icon">😕</div>Aucun arrêt trouvé pour « ${q} ».`; empty.style.display='block'; btn.disabled=false; btn.textContent='Rechercher'; return; }
      const card=document.createElement('div'); card.className='card';
      places.forEach(p=>{
        const s=p.stop_area||p.stop_point; if (!s) return;
        const modes=(s.physical_modes||[]).map(m=>m.name).join(', ');
        const item=document.createElement('div'); item.className='list-item';
        item.innerHTML=`<div style="font-size:22px;">📍</div><div class="item-info"><div class="item-name">${s.name}</div>${modes?`<div class="item-sub">${modes}</div>`:''}</div><span style="color:var(--muted);font-size:20px;">›</span>`;
        item.onclick=()=>loadLines(s.id,s.name);
        card.appendChild(item);
      });
      results.appendChild(card);
    } catch(e) { empty.innerHTML=`<div class="error-box">Erreur : ${e.message}</div>`; empty.style.display='block'; }
    btn.disabled=false; btn.textContent='Rechercher';
  }

  // ── Vue 2 : Lignes + perturbations ─────────────────────────────────────────
  async function loadLines(stopAreaId, stopAreaName) {
    state.stopAreaId=stopAreaId; state.stopAreaName=stopAreaName;
    showView('lines');
    updateBreadcrumb([
      {label:document.getElementById('search-input').value, fn:'backToSearch()'},
      {label:stopAreaName}
    ]);
    const el=document.getElementById('lines-content');
    el.innerHTML='<div class="empty"><span class="spinner"></span> Chargement des lignes…</div>';
    try {
      // Charge les lignes ET les perturbations de l'arrêt en parallèle
      const [linesData, disruptionsData] = await Promise.all([
        callProxy('v2/navitia/stop_areas/'+stopAreaId+'/lines', {count:40}),
        callProxy('v2/navitia/stop_areas/'+stopAreaId+'/disruptions', {count:30}).catch(()=>({disruptions:[]}))
      ]);
      const lines = linesData.lines || [];
      const allDisruptions = disruptionsData.disruptions || [];

      // Indexe les perturbations par ligne
      const disruptionsByLine = {};
      allDisruptions.forEach(d => {
        (d.impacted_objects||[]).forEach(obj => {
          const lid = obj.pt_object?.line?.id || obj.id;
          if (lid) {
            if (!disruptionsByLine[lid]) disruptionsByLine[lid]=[];
            disruptionsByLine[lid].push(d);
          }
        });
      });

      el.innerHTML='';
      if (!lines.length) { el.innerHTML='<div class="empty"><div class="icon">😕</div>Aucune ligne trouvée.</div>'; return; }

      const label=document.createElement('div'); label.className='section-label';
      label.textContent='Lignes disponibles — '+stopAreaName;
      el.appendChild(label);

const modeOrder = { 'rer':0, 'transilien':0, 'train':0, 'métro':1, 'metro':1, 'tramway':2, 'tram':2, 'bus':3, 'noctilien':3 };

function getModeRank(l) {
  const mode = (l.commercial_modes?.[0]?.name || l.physical_modes?.[0]?.name || 'Autre').toLowerCase();
  const rank = Object.entries(modeOrder).find(([k]) => mode.includes(k));
  return rank ? rank[1] : 4;
}

// Trie les lignes par mode puis par code
lines.sort((a, b) => {
  const ra = getModeRank(a), rb = getModeRank(b);
  if (ra !== rb) return ra - rb;
  return (a.code||'').localeCompare(b.code||'', undefined, { numeric: true });
});

const byMode = new Map();
lines.forEach(l => {
  const mode = l.commercial_modes?.[0]?.name || l.physical_modes?.[0]?.name || 'Autre';
  if (!byMode.has(mode)) byMode.set(mode, []);
  byMode.get(mode).push(l);
});

      byMode.forEach((linesInMode,modeName)=>{
        const modeLabel=document.createElement('div');
        modeLabel.style.cssText='font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:12px 16px 4px;';
        modeLabel.textContent=getModeIcon(modeName)+' '+modeName;
        el.appendChild(modeLabel);
        const card=document.createElement('div'); card.className='card';
        linesInMode.forEach(l=>{
          const info={code:l.code||l.name, color:l.color, commercial_mode:l.commercial_modes?.[0]?.name||'', codes:l.codes||[]};
          const termini=[...new Set((l.routes||[]).map(r=>r.direction?.stop_area?.name||'').filter(Boolean))].slice(0,3).join(' · ');
          const lineDisruptions = disruptionsByLine[l.id] || [];
          const badge = renderDisruptionBadge(lineDisruptions);
          const item=document.createElement('div'); item.className='list-item';
          item.style.flexWrap='wrap';
          item.innerHTML=`
            <div style="flex-shrink:0;">${lineIcon(info,34)}</div>
            <div class="item-info">
              <div class="item-name" style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;">
                ${l.name||l.code}${badge}
              </div>
              ${termini?`<div class="item-sub">${termini}</div>`:''}
            </div>
            <span style="color:var(--muted);font-size:20px;">›</span>`;
          item.onclick=()=>loadDirections(stopAreaId,stopAreaName,l.id,info,l.name||l.code);
          card.appendChild(item);
        });
        el.appendChild(card);
      });
    } catch(e) { el.innerHTML=`<div class="error-box">Erreur : ${e.message}</div>`; }
  }

  // ── Vue 3 : Directions + perturbations de la ligne ─────────────────────────
  let _dirCache = null;

  async function loadDirections(stopAreaId, stopAreaName, lineId, lineInfo, lineName, activeFilter) {
    state.lineId=lineId; state.lineInfo=lineInfo;
    state.lineRef=toLineRef(lineId, lineInfo.codes);
    showView('directions');
    updateBreadcrumb([
      {label:document.getElementById('search-input').value, fn:'backToSearch()'},
      {label:stopAreaName, fn:`loadLines('${stopAreaId}','${stopAreaName.replace(/'/g,"\\'")}')` },
      {label:lineName}
    ]);
    const el=document.getElementById('directions-content');

    const cacheKey=stopAreaId+'|'+lineId;
    if (!_dirCache||_dirCache.key!==cacheKey) {
      el.innerHTML='<div class="empty"><span class="spinner"></span> Chargement…</div>';
      try {
        const [routesData, spData, disruptions] = await Promise.all([
          callProxy('v2/navitia/lines/'+lineId+'/routes',{count:10}),
          callProxy('v2/navitia/stop_areas/'+stopAreaId+'/lines/'+lineId+'/stop_points',{count:30}).catch(()=>({stop_points:[]})),
          fetchDisruptions(lineId)
        ]);
        // Fallback stop_points
        let stopPoints = spData.stop_points||[];
        if (!stopPoints.length) {
          const fb = await callProxy('v2/navitia/stop_areas/'+stopAreaId+'/stop_points',{count:30}).catch(()=>({stop_points:[]}));
          stopPoints = fb.stop_points||[];
        }
        _dirCache={key:cacheKey, routes:routesData.routes||[], stopPoints, disruptions};
      } catch(e) { el.innerHTML=`<div class="error-box">Erreur : ${e.message}</div>`; return; }
    }

    const {routes, stopPoints, disruptions} = _dirCache;
    const allSpIds = stopPoints.map(sp=>sp.id);
    if (!routes.length) { el.innerHTML='<div class="error-box">Aucune direction trouvée.</div>'; return; }

    const outbound=routes.filter(r=>r.direction_type==='outbound');
    const inbound =routes.filter(r=>r.direction_type==='inbound');
    const hasFilter=outbound.length>0&&inbound.length>0;
    const filter=activeFilter||(hasFilter?'outbound':null);

    el.innerHTML='';

    // ── Perturbations de la ligne (collapsible) ──
    if (disruptions.length) {
      renderDisruptionsBlock(disruptions, el);
    }

    const label=document.createElement('div'); label.className='section-label';
    label.innerHTML=`${lineIcon(lineInfo,22)}<span>${lineName} — Choisir une direction</span>`;
    el.appendChild(label);

    if (hasFilter) {
      const tabs=document.createElement('div');
      tabs.style.cssText='display:flex;gap:8px;margin-bottom:12px;';
      [{dir:'outbound',lbl:'→ Aller'},{dir:'inbound',lbl:'← Retour'}].forEach(({dir,lbl})=>{
        const active=filter===dir;
        const btn=document.createElement('button');
        btn.textContent=lbl;
        btn.style.cssText=[
          'flex:1;height:40px;border-radius:9px;',
          'font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;',
          active
            ? 'border:2px solid var(--accent);background:var(--accent-bg);color:var(--accent);'
            : 'border:1.5px solid var(--border);background:var(--surface);color:var(--muted);'
        ].join('');
        btn.onclick=()=>loadDirections(stopAreaId,stopAreaName,lineId,lineInfo,lineName,dir);
        tabs.appendChild(btn);
      });
      el.appendChild(tabs);
    }

    const visibleRoutes=hasFilter?routes.filter(r=>r.direction_type===filter):routes;
    if (!visibleRoutes.length) { el.innerHTML+='<div class="empty"><div class="icon">😕</div>Aucune destination dans ce sens.</div>'; return; }

    const card=document.createElement('div'); card.className='card';
    visibleRoutes.forEach(route=>{
      const terminus=route.direction?.stop_area?.name||route.name||'?';
      const routeSpIds=stopPoints
        .filter(sp=>!sp.routes?.length||sp.routes.some(r=>r.id===route.id))
        .map(sp=>sp.id);
      const spIds=routeSpIds.length?routeSpIds:allSpIds;
      const arrow=filter==='inbound'?'←':'→';
      const item=document.createElement('div'); item.className='list-item';
      item.innerHTML=`
        <div style="flex-shrink:0;">${lineIcon(lineInfo,36)}</div>
        <div class="item-info"><div class="item-name">${arrow} ${terminus}</div></div>
        <span style="color:var(--muted);font-size:20px;">›</span>`;
      item.onclick=()=>loadDepartures(terminus,spIds,stopAreaId,stopAreaName,lineName);
      card.appendChild(item);
    });
    el.appendChild(card);
  }

  // ── Vue 4 : Horaires ────────────────────────────────────────────────────────
  async function loadDepartures(terminus, spIds, stopAreaId, stopAreaName, lineName) {
    showView('departures');
    updateBreadcrumb([
      {label:document.getElementById('search-input').value, fn:'backToSearch()'},
      {label:stopAreaName, fn:`loadLines('${stopAreaId}','${stopAreaName.replace(/'/g,"\\'")}')` },
      {label:lineName, fn:`loadDirections('${stopAreaId}','${stopAreaName.replace(/'/g,"\\'")}','${state.lineId}',${JSON.stringify(state.lineInfo)},'${lineName.replace(/'/g,"\\'")}')` },
      {label:'→ '+terminus}
    ]);
    Object.assign(state,{currentTerminus:terminus,currentStopPointIds:spIds,currentStopAreaId:stopAreaId,currentStopAreaName:stopAreaName,currentLineName:lineName});
    await refreshDepartures();
  }

  function getSiriStrategy(lineInfo) {
    const mode=(lineInfo.commercial_mode||'').toLowerCase();
    if (mode.includes('métro')||mode.includes('metro')||mode.includes('rer')||mode.includes('transilien')||mode.includes('train')) return 'stop-monitoring';
    return 'estimated-timetable';
  }

  async function refreshDepartures() {
    const el=document.getElementById('departures-content');
    el.innerHTML='<div class="empty"><span class="spinner"></span> Chargement des horaires temps réel…</div>';
    const {currentTerminus:terminus,currentStopPointIds:spIds,lineInfo,lineRef} = state;

    try {
      let departures=[], isRealtime=false;
      const strategy=getSiriStrategy(lineInfo);

      if (strategy==='stop-monitoring') {
        for (const spId of spIds) {
          const monRef=toMonitoringRef(spId);
          if (!monRef) continue;
          try {
            const data=await callProxy('stop-monitoring',{MonitoringRef:monRef,MaximumStopVisits:20});
            const parsed=parseStopMonitoring(data,terminus);
            if (parsed.length) { departures=parsed; isRealtime=true; break; }
          } catch(e) { /* ignore */ }
        }
      } else {
        if (lineRef) {
          try {
            const data=await callProxy('estimated-timetable',{LineRef:lineRef});
            departures=parseSiri(data,spIds,terminus);
            isRealtime=true;
          } catch(e) { /* ignore */ }
        }
      }

      if (!departures.length && spIds.length) {
        try {
          const navData=await callProxy('v2/navitia/stop_points/'+spIds[0]+'/departures',{count:20});
          departures=parseNavitia(navData.departures||[],terminus);
          isRealtime=false;
        } catch(e) { /* ignore */ }
      }

      // Charge les perturbations en parallèle du rendu
      const disruptions = _dirCache?.disruptions || [];

      renderDepartures(el,departures,terminus,isRealtime,disruptions);
    } catch(e) {
      el.innerHTML=`<div class="error-box">Erreur : ${e.message}</div>`;
      renderRefreshBtn(el);
    }
  }

  function parseSiri(data,spIds,terminus) {
    const frame=data?.Siri?.ServiceDelivery?.EstimatedTimetableDelivery?.[0]?.EstimatedJourneyVersionFrame?.[0];
    const journeys=frame?.EstimatedVehicleJourney||[];
    const now=Date.now();
    const numericIds=new Set(spIds.map(extractNumericId).filter(Boolean));
    const result=[];
    journeys.forEach(vj=>{
      const calls=vj.EstimatedCalls?.EstimatedCall||[];
      calls.forEach(call=>{
        const spRef=call.StopPointRef?.value||'';
        const refNum=spRef.match(/:Q:(\d+):/)?.[1]||spRef.match(/:(\d+):?$/)?.[1];
        if (!refNum||!numericIds.has(refNum)) return;
        const dest=call.DestinationDisplay?.[0]?.value||vj.DestinationName?.[0]?.value||'';
        if (terminus&&dest&&!loosMatch(terminus,dest)) return;
        const expectedTime=call.ExpectedDepartureTime||call.ExpectedArrivalTime||call.AimedDepartureTime||call.AimedArrivalTime;
        const aimedTime=call.AimedDepartureTime||call.AimedArrivalTime;
        if (!expectedTime) return;
        if (new Date(expectedTime).getTime()<now-60000) return;
        result.push({expectedTime,aimedTime,destination:dest||terminus,vehicleAtStop:call.VehicleAtStop===true,cancelled:call.DepartureStatus==='cancelled'||call.ArrivalStatus==='cancelled',realtime:true});
      });
    });
    result.sort((a,b)=>new Date(a.expectedTime)-new Date(b.expectedTime));
    return result;
  }

  function parseStopMonitoring(data,terminus) {
    const visits=data?.Siri?.ServiceDelivery?.StopMonitoringDelivery?.[0]?.MonitoredStopVisit||[];
    const now=Date.now();
    const result=[];
    visits.forEach(v=>{
      const vj=v.MonitoredVehicleJourney||{}, call=vj.MonitoredCall||{};
      const dest=call.DestinationDisplay?.[0]?.value||vj.DestinationName?.[0]?.value||vj.DirectionName?.[0]?.value||'';
      if (terminus&&dest&&!loosMatch(terminus,dest)) return;
      const expectedTime=call.ExpectedDepartureTime||call.AimedDepartureTime||call.ExpectedArrivalTime||call.AimedArrivalTime;
      const aimedTime=call.AimedDepartureTime||call.AimedArrivalTime;
      if (!expectedTime) return;
      if (new Date(expectedTime).getTime()<now-60000) return;
      result.push({expectedTime,aimedTime,destination:dest||terminus,vehicleAtStop:call.VehicleAtStop===true,cancelled:call.DepartureStatus==='cancelled'||call.ArrivalStatus==='cancelled',realtime:true});
    });
    result.sort((a,b)=>new Date(a.expectedTime)-new Date(b.expectedTime));
    return result;
  }

  function parseNavitia(deps,terminus) {
    return deps.map(dep=>{
      const sdt=dep.stop_date_time||{}, info=dep.display_informations||{};
      const dest=info.direction||info.headsign||terminus;
      const expectedTime=navitiaToISO(sdt.departure_date_time||sdt.arrival_date_time);
      return {expectedTime,aimedTime:null,destination:dest,vehicleAtStop:false,cancelled:false,realtime:false};
    }).filter(d=>d.expectedTime);
  }

  function renderDepartures(el,departures,terminus,isRealtime,disruptions=[]) {
    el.innerHTML='';

    // ── Perturbations de la ligne (collapsible) ──
    if (disruptions.length) {
      renderDisruptionsBlock(disruptions, el);
    }

    const header=document.createElement('div');
    header.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;';
    header.innerHTML=`${lineIcon(state.lineInfo,30)}<span style="font-size:15px;font-weight:500;">→ ${terminus}</span><span class="fresh ${isRealtime?'fresh-rt':'fresh-th'}">${isRealtime?'⚡ Temps réel':'📅 Théorique'}</span>`;
    el.appendChild(header);

    if (!departures.length) {
      el.innerHTML+='<div class="empty"><div class="icon">🕐</div>Aucun passage imminent trouvé.</div>';
      renderRefreshBtn(el); return;
    }

    const card=document.createElement('div'); card.className='card';
    departures.forEach(dep=>{
      const expected=new Date(dep.expectedTime);
      const aimed=dep.aimedTime?new Date(dep.aimedTime):null;
      const timeStr=formatTime(expected);
      const waitMin=Math.round((expected-Date.now())/60000);
      let waitLabel='', waitClass='';
      if (dep.vehicleAtStop||waitMin<=0) { waitLabel='À quai'; waitClass='quai'; }
      else if (waitMin<=1) { waitLabel='1 min'; waitClass='soon'; }
      else { waitLabel=waitMin+' min'; waitClass=waitMin<=4?'soon':''; }

      let delayBadge='';
      if (aimed&&dep.realtime) {
        const d=Math.round((expected-aimed)/60000);
        if (d>0) delayBadge=`<span style="font-size:11px;color:#dc2626;font-weight:600;margin-left:4px;">+${d} min</span>`;
        else if (d<0) delayBadge=`<span style="font-size:11px;color:#15803d;font-weight:600;margin-left:4px;">${d} min</span>`;
      }
      const cancelBadge=dep.cancelled?'<span style="font-size:11px;color:#dc2626;font-weight:600;margin-left:4px;">Supprimé</span>':'';

      const item=document.createElement('div'); item.className='dep-item';
      item.innerHTML=`
        <div class="dep-left">
          ${lineIcon(state.lineInfo,32)}
          <div style="min-width:0;">
            <div class="dep-dest">${dep.destination}</div>
            <div class="dep-mode">${state.lineInfo.commercial_mode||''}</div>
          </div>
        </div>
        <div class="dep-right">
          <div class="dep-time">${waitLabel}${delayBadge}${cancelBadge}</div>
          <div class="dep-wait ${waitClass}">${timeStr}</div>
        </div>`;
      card.appendChild(item);
    });
    el.appendChild(card);
    renderRefreshBtn(el);
  }

  function renderRefreshBtn(el) {
    const btn=document.createElement('button'); btn.className='refresh-btn';
    btn.textContent='↻ Actualiser'; btn.onclick=refreshDepartures;
    el.appendChild(btn);
  }

  function backToSearch() { showView('search'); updateBreadcrumb([]); }
</script>
