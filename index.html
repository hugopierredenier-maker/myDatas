<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Transports IDF — 3 Arrêts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f2f2f7; --surface: #fff; --surface2: #f2f2f7;
      --border: rgba(60,60,67,.12); --sep: rgba(60,60,67,.1);
      --text: #000; --text2: #3c3c43; --muted: rgba(60,60,67,.55);
      --accent: #007aff; --accent-bg: rgba(0,122,255,.08);
      --success: #34c759; --success-bg: rgba(52,199,89,.1);
      --warning: #ff9500; --warning-bg: rgba(255,149,0,.1);
      --danger: #ff3b30; --danger-bg: rgba(255,59,48,.1);
      --r: 18px; --r-sm: 12px; --r-xs: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000; --surface: #1c1c1e; --surface2: #2c2c2e;
        --border: rgba(255,255,255,.1); --sep: rgba(255,255,255,.08);
        --text: #fff; --text2: #ebebf5; --muted: rgba(235,235,245,.55);
        --accent: #0a84ff; --accent-bg: rgba(10,132,255,.12);
        --success: #30d158; --success-bg: rgba(48,209,88,.12);
        --warning: #ff9f0a; --warning-bg: rgba(255,159,10,.12);
        --danger: #ff453a; --danger-bg: rgba(255,69,58,.12);
      }
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px;
      background: rgba(255,255,255,.8);
      backdrop-filter: blur(20px);
      border-bottom: 0.5px solid var(--border);
      position: sticky; top: 0; z-index: 50;
    }
    @media (prefers-color-scheme: dark) {
      .header { background: rgba(28,28,30,.9); }
    }
    .header-title { font-size: 17px; font-weight: 600; }
    .header-clock { font-size: 14px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 14px;
      min-height: calc(100vh - 53px);
    }
    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
    }

    /* ── Panel ── */
    .panel {
      background: rgba(255,255,255,.75);
      backdrop-filter: blur(20px);
      border: 0.5px solid rgba(255,255,255,.6);
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
      min-height: 500px;
    }
    @media (prefers-color-scheme: dark) {
      .panel { background: rgba(28,28,30,.85); border-color: rgba(255,255,255,.08); }
    }

    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px 10px;
      border-bottom: 0.5px solid var(--sep);
      flex-shrink: 0;
    }
    .panel-num {
      font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em;
    }
    .panel-actions { display: flex; align-items: center; gap: 6px; }
    .panel-line-badge { display: flex; align-items: center; }
    .panel-reset {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 15px; padding: 2px 5px;
      border-radius: 6px; line-height: 1; transition: color .15s, background .15s;
    }
    .panel-reset:hover { color: var(--danger); background: var(--danger-bg); }

    .panel-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Search step ── */
    .step-search {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 20px 14px; gap: 12px;
    }
    .step-search-icon { font-size: 32px; opacity: .25; }
    .step-search-label { font-size: 13px; color: var(--muted); }
    .search-field { position: relative; width: 100%; }
    .search-field input {
      width: 100%; height: 38px; padding: 0 36px 0 12px;
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: 10px; color: var(--text);
      font-family: inherit; font-size: 13px; outline: none;
      transition: border-color .15s;
    }
    .search-field input:focus { border-color: var(--accent); }
    .search-field i { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 15px; pointer-events: none; }
    .ac-drop {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: 10px; z-index: 100; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      max-height: 200px; overflow-y: auto;
    }
    .ac-drop-item {
      padding: 9px 12px; cursor: pointer; font-size: 13px;
      border-bottom: 0.5px solid var(--sep); transition: background .1s;
    }
    .ac-drop-item:last-child { border-bottom: none; }
    .ac-drop-item:hover, .ac-drop-item.active { background: var(--accent-bg); }
    .ac-drop-name { font-weight: 500; }
    .ac-drop-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* ── Back button ── */
    .step-back {
      display: flex; align-items: center; gap: 6px;
      padding: 9px 14px; font-size: 12px; font-weight: 500;
      color: var(--accent); cursor: pointer; flex-shrink: 0;
      border-bottom: 0.5px solid var(--sep);
      transition: background .1s;
    }
    .step-back:hover { background: var(--accent-bg); }

    /* ── Lines / Directions list ── */
    .item-list { flex: 1; overflow-y: auto; padding: 6px; }
    .item-btn {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 9px 10px; margin-bottom: 3px;
      background: none; border: 0.5px solid var(--border);
      border-radius: 10px; cursor: pointer; color: var(--text);
      font-family: inherit; font-size: 12px; font-weight: 500;
      text-align: left; transition: background .1s, border-color .1s;
    }
    .item-btn:hover { background: var(--surface2); border-color: var(--border); }
    .item-btn:last-child { margin-bottom: 0; }
    .item-btn-sub { color: var(--muted); font-size: 11px; font-weight: 400; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-btn-arrow { color: var(--muted); font-size: 12px; margin-left: auto; flex-shrink: 0; }

    /* ── Departures ── */
    .dep-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .dep-subheader {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-bottom: 0.5px solid var(--sep);
      flex-shrink: 0;
    }
    .dep-direction { font-size: 12px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fresh { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 99px; flex-shrink: 0; }
    .fresh.rt { background: var(--success-bg); color: var(--success); }
    .fresh.th { background: var(--warning-bg); color: var(--warning); }

    .dep-list { flex: 1; overflow-y: auto; }
    .dep-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 14px; border-bottom: 0.5px solid var(--sep); gap: 8px;
    }
    .dep-row:last-child { border-bottom: none; }
    .dep-dest { font-size: 12px; color: var(--muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dep-right { text-align: right; flex-shrink: 0; }
    .dep-wait { font-size: 20px; font-weight: 700; letter-spacing: -.3px; font-variant-numeric: tabular-nums; }
    .dep-wait.quai { color: var(--accent); }
    .dep-wait.soon { color: var(--success); }
    .dep-time { font-size: 11px; color: var(--muted); margin-top: 1px; font-variant-numeric: tabular-nums; }
    .dep-delay { font-size: 10px; font-weight: 600; }
    .dep-delay.late { color: var(--danger); }
    .dep-delay.early { color: var(--success); }

    /* ── Footer refresh ── */
    .dep-footer {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-top: 0.5px solid var(--sep);
      flex-shrink: 0;
    }
    .dep-footer-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; animation: pulse 2s infinite; }
    .dep-footer-dot.rt { background: var(--success); }
    .dep-footer-dot.th { background: var(--warning); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .dep-footer-progress { flex: 1; height: 2px; background: var(--sep); border-radius: 99px; overflow: hidden; }
    .dep-footer-bar { height: 100%; background: var(--accent); border-radius: 99px; transition: width 1s linear; }
    .dep-footer-cd { font-size: 11px; color: var(--muted); min-width: 22px; text-align: right; font-variant-numeric: tabular-nums; }
    .dep-footer-btn {
      background: none; border: none; cursor: pointer;
      color: var(--accent); font-size: 13px; padding: 2px 4px;
      border-radius: 5px; transition: background .1s;
    }
    .dep-footer-btn:hover { background: var(--accent-bg); }

    /* ── Loading / empty ── */
    .panel-loader { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .spinner { width: 16px; height: 16px; border: 2px solid var(--sep); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .panel-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--muted); font-size: 12px; padding: 20px; text-align: center; }
    .panel-empty i { font-size: 28px; opacity: .4; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-title">🚇 Transports IDF</div>
  <div class="header-clock" id="clock">--:--:--</div>
</div>

<div class="grid" id="grid"></div>

<script>
// ── Clock ─────────────────────────────────────────────────────────────────────
setInterval(() => {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}, 1000);
document.getElementById('clock').textContent =
  new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});

// ── Config ────────────────────────────────────────────────────────────────────
const PROXY       = '/api/prim';
const REFRESH_SEC = 20;

// ── API ───────────────────────────────────────────────────────────────────────
async function api(endpoint, params = {}) {
  const qs = new URLSearchParams({endpoint, ...params}).toString();
  const r  = await fetch(PROXY + '?' + qs);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function textColor(hex) {
  hex = (hex||'').replace('#','');
  if (hex.length !== 6) return '#fff';
  const r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  return (r*299+g*587+b*114)/1000 > 128 ? '#000' : '#fff';
}

function lineIcon(info, size=24) {
  const code = String(info.code||info.label||'?');
  const mode = (info.commercial_mode||'').toLowerCase();
  const bg   = info.color ? '#'+info.color.replace('#','') : '#888';
  const fg   = textColor(bg);
  const cx=size/2, cy=size/2;
  const fs = code.length<=2 ? Math.round(size*.44) : code.length===3 ? Math.round(size*.32) : Math.round(size*.26);
  const rv = Math.round(size*.2);
  let shape, w=size;
  if (mode.includes('métro')||mode.includes('metro')) {
    shape = `<circle cx="${cx}" cy="${cy}" r="${cx-1}" fill="${bg}"/>`;
  } else if (mode.includes('rer')||mode.includes('transilien')||mode.includes('train')) {
    shape = `<rect x="1" y="1" width="${size-2}" height="${size-2}" rx="${rv}" fill="${bg}"/>`;
  } else if (mode.includes('tram')) {
    shape = `<polygon points="${cx},1 ${size-1},${cy} ${cx},${size-1} 1,${cy}" fill="${bg}"/>`;
  } else {
    const cw=fs*.65; w=Math.max(size, Math.round(cw*code.length+size*.5));
    shape = `<rect x="1" y="1" width="${w-2}" height="${size-2}" rx="${rv}" fill="${bg}"/>`;
    return `<svg width="${w}" height="${size}" viewBox="0 0 ${w} ${size}" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;flex-shrink:0;"><title>${code}</title>${shape}<text x="${w/2}" y="${cy}" dominant-baseline="central" text-anchor="middle" font-family="Inter,sans-serif" font-size="${fs}" font-weight="600" fill="${fg}">${code}</text></svg>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;flex-shrink:0;"><title>${code}</title>${shape}<text x="${cx}" y="${cy}" dominant-baseline="central" text-anchor="middle" font-family="Inter,sans-serif" font-size="${fs}" font-weight="600" fill="${fg}">${code}</text></svg>`;
}

function formatTime(d) { return d ? d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : '--:--'; }
function toLineRef(lineId, codes) {
  if (codes) { const s=codes.find(c=>c.type==='source'); if(s){const m=s.value.match(/Line:(C[\w-]+)/);if(m)return`STIF:Line::${m[1]}:`;} }
  const m=lineId.match(/IDFM:(C[\w-]+)/); return m?`STIF:Line::${m[1]}:`:null;
}
function extractNumId(id) { const m=(id||'').match(/:(\d+)$/); return m?m[1]:null; }
function toMonRef(spId)   { const m=(spId||'').match(/:(\d+)$/); return m?`STIF:StopPoint:Q:${m[1]}:`:null; }
function norm(s) { return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function lMatch(a,b) {
  const na=norm(a), nb=norm(b);
  if (na===nb||na.includes(nb)||nb.includes(na)) return true;
  const wa=na.split(/\s+/).find(w=>w.length>=4), wb=nb.split(/\s+/).find(w=>w.length>=4);
  return !!(wa&&wb&&wa===wb);
}
function n2iso(s) { if(!s)return null; return`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T${s.slice(9,11)}:${s.slice(11,13)}:${s.slice(13,15)}`; }
function getStrategy(mode) {
  const m=(mode||'').toLowerCase();
  return (m.includes('métro')||m.includes('metro')||m.includes('rer')||m.includes('transilien')||m.includes('train')) ? 'stop-monitoring' : 'requete-ligne';
}

// ── Parsers ───────────────────────────────────────────────────────────────────
function parseSM(data, terminus) {
  const visits = data?.Siri?.ServiceDelivery?.StopMonitoringDelivery?.[0]?.MonitoredStopVisit||[];
  const now = Date.now(), res = [];
  visits.forEach(v => {
    const vj=v.MonitoredVehicleJourney||{}, c=vj.MonitoredCall||{};
    const dest = c.DestinationDisplay?.[0]?.value||vj.DestinationName?.[0]?.value||vj.DirectionName?.[0]?.value||'';
    if (terminus&&dest&&!lMatch(terminus,dest)) return;
    const et = c.ExpectedDepartureTime||c.AimedDepartureTime||c.ExpectedArrivalTime||c.AimedArrivalTime;
    const at = c.AimedDepartureTime||c.AimedArrivalTime;
    if (!et||new Date(et).getTime()<now-60000) return;
    res.push({et,at,dest:dest||terminus,atStop:c.VehicleAtStop===true,cancelled:c.DepartureStatus==='cancelled',rt:true});
  });
  return res.sort((a,b)=>new Date(a.et)-new Date(b.et));
}

function parseRL(data, spIds, terminus) {
  const delivery = data?.Siri?.ServiceDelivery??data?.ServiceDelivery;
  const frame = delivery?.EstimatedTimetableDelivery?.[0]?.EstimatedJourneyVersionFrame?.[0];
  const journeys = frame?.EstimatedVehicleJourney||[];
  const now = Date.now(), nums = new Set(spIds.map(extractNumId).filter(Boolean)), res = [];
  journeys.forEach(vj => {
    (vj.EstimatedCalls?.EstimatedCall||[]).forEach(c => {
      const sr=c.StopPointRef?.value||'';
      const rn=sr.match(/:Q:(\d+):/)?.[1]||sr.match(/:(\d+):?$/)?.[1];
      if (!rn||!nums.has(rn)) return;
      const dest = c.DestinationDisplay?.[0]?.value||vj.DestinationName?.[0]?.value||'';
      if (terminus&&dest&&!lMatch(terminus,dest)) return;
      const et=c.ExpectedDepartureTime||c.ExpectedArrivalTime||c.AimedDepartureTime||c.AimedArrivalTime;
      const at=c.AimedDepartureTime||c.AimedArrivalTime;
      if (!et||new Date(et).getTime()<now-60000) return;
      res.push({et,at,dest:dest||terminus,atStop:c.VehicleAtStop===true,cancelled:c.DepartureStatus==='cancelled',rt:true});
    });
  });
  return res.sort((a,b)=>new Date(a.et)-new Date(b.et));
}

function parseNAV(deps, terminus) {
  return deps.map(dep => {
    const sdt=dep.stop_date_time||{}, info=dep.display_informations||{};
    const et=n2iso(sdt.departure_date_time||sdt.arrival_date_time);
    return {et,at:null,dest:info.direction||info.headsign||terminus,atStop:false,cancelled:false,rt:false};
  }).filter(d=>d.et&&new Date(d.et).getTime()>=Date.now()-60000);
}

// ── Panel class ───────────────────────────────────────────────────────────────
class Panel {
  constructor(id) {
    this.id        = id;
    this.el        = null;
    // state
    this.step      = 'search'; // search | lines | directions | departures
    this.stopId    = null;
    this.stopName  = null;
    this.lineId    = null;
    this.lineInfo  = null;
    this.lineRef   = null;
    this.spIds     = [];
    this.terminus  = null;
    // data cache
    this._lines    = null;
    this._routes   = null;
    this._spCache  = null;
    // refresh
    this.countdown = REFRESH_SEC;
    this.timer     = null;
    this.acTimer   = null;
    this.acRes     = [];
    this.acIdx     = -1;
    this.isRT      = false;
  }

  mount(el) { this.el = el; this.render(); }

  // ── Full render ──────────────────────────────────────────────────────────────
  render() {
    if (!this.el) return;
    const badge = this.lineInfo ? lineIcon(this.lineInfo, 20) : '';
    const resetBtn = this.step !== 'search'
      ? `<button class="panel-reset" title="Réinitialiser">✕</button>` : '';

    this.el.innerHTML = `
      <div class="panel-header">
        <span class="panel-num">Arrêt ${this.id + 1}</span>
        <div class="panel-actions">
          <div class="panel-line-badge">${badge}</div>
          ${resetBtn}
        </div>
      </div>
      <div class="panel-body" id="pb-${this.id}"></div>
    `;

    this.el.querySelector('.panel-reset')?.addEventListener('click', () => this.reset());
    this.renderBody();
  }

  renderBody() {
    const body = document.getElementById(`pb-${this.id}`);
    if (!body) return;
    body.innerHTML = '';
    if      (this.step === 'search')     this.renderSearch(body);
    else if (this.step === 'lines')      this.renderLines(body);
    else if (this.step === 'directions') this.renderDirections(body);
    else if (this.step === 'departures') this.renderDepartures(body);
  }

  // ── Step 1 : Search ──────────────────────────────────────────────────────────
  renderSearch(body) {
    body.innerHTML = `
      <div class="step-search">
        <div class="step-search-icon">📍</div>
        <div class="step-search-label">Chercher un arrêt</div>
        <div class="search-field">
          <input type="text" placeholder="Ex: Châtelet, Nation…" autocomplete="off" id="si-${this.id}"/>
          <i class="ti ti-search"></i>
          <div class="ac-drop" id="ac-${this.id}" style="display:none;"></div>
        </div>
      </div>
    `;
    const input = document.getElementById(`si-${this.id}`);
    const drop  = document.getElementById(`ac-${this.id}`);

    input.addEventListener('input', () => {
      clearTimeout(this.acTimer);
      const q = input.value.trim();
      if (q.length < 2) { drop.style.display='none'; return; }
      drop.style.display = 'block';
      drop.innerHTML = '<div class="ac-drop-item"><span class="spinner" style="display:inline-block;"></span></div>';
      this.acTimer = setTimeout(async () => {
        try {
          const data = await api('v2/navitia/places', {q, count:8});
          this.acRes = (data.places||[]).filter(p=>p.embedded_type==='stop_area'||p.embedded_type==='stop_point');
          this.acIdx = -1;
          if (!this.acRes.length) { drop.style.display='none'; return; }
          drop.innerHTML = this.acRes.map((p,i) => {
            const s = p.stop_area||p.stop_point;
            const modes = (s.physical_modes||[]).map(m=>m.name).join(' · ');
            return `<div class="ac-drop-item" data-i="${i}">
              <div class="ac-drop-name">${s.name}</div>
              ${modes?`<div class="ac-drop-sub">${modes}</div>`:''}
            </div>`;
          }).join('');
          drop.querySelectorAll('.ac-drop-item').forEach(item => {
            item.addEventListener('mousedown', e => { e.preventDefault(); this.selectStop(this.acRes[+item.dataset.i]); });
          });
        } catch { drop.style.display='none'; }
      }, 260);
    });

    input.addEventListener('keydown', e => {
      const items = drop.querySelectorAll('.ac-drop-item');
      if (e.key==='ArrowDown') { e.preventDefault(); this.acIdx=Math.min(this.acIdx+1,items.length-1); items.forEach((el,i)=>el.classList.toggle('active',i===this.acIdx)); }
      if (e.key==='ArrowUp')   { e.preventDefault(); this.acIdx=Math.max(this.acIdx-1,0); items.forEach((el,i)=>el.classList.toggle('active',i===this.acIdx)); }
      if (e.key==='Enter'&&this.acIdx>=0&&this.acRes[this.acIdx]) this.selectStop(this.acRes[this.acIdx]);
      if (e.key==='Escape') drop.style.display='none';
    });

    document.addEventListener('click', e => {
      if (!e.target.closest(`#si-${this.id}`)&&!e.target.closest(`#ac-${this.id}`)) drop.style.display='none';
    });
  }

  async selectStop(place) {
    const s = place.stop_area||place.stop_point;
    this.stopId = s.id; this.stopName = s.name;
    this._lines = null;
    this.step = 'lines';
    this.render();
    await this.fetchLines();
  }

  // ── Step 2 : Lines ───────────────────────────────────────────────────────────
  async fetchLines() {
    const body = document.getElementById(`pb-${this.id}`);
    if (!body) return;
    // show loader inside list
    const list = body.querySelector('.item-list');
    if (list) list.innerHTML = '<div class="panel-loader"><div class="spinner"></div></div>';
    try {
      const data = await api('v2/navitia/stop_areas/'+this.stopId+'/lines', {count:40});
      const lines = data.lines||[];
      const modeOrder = {'rer':0,'transilien':0,'train':0,'métro':1,'metro':1,'tramway':2,'tram':2,'bus':3,'noctilien':3};
      const rank = l => { const m=(l.commercial_modes?.[0]?.name||'').toLowerCase(); const e=Object.entries(modeOrder).find(([k])=>m.includes(k)); return e?e[1]:4; };
      lines.sort((a,b)=>{ const d=rank(a)-rank(b); return d||(a.code||'').localeCompare(b.code||'',undefined,{numeric:true}); });
      this._lines = lines;
    } catch { this._lines = []; }
    const body2 = document.getElementById(`pb-${this.id}`);
    if (body2) { body2.innerHTML=''; this.renderLines(body2); }
  }

  renderLines(body) {
    const back = document.createElement('div');
    back.className = 'step-back';
    back.innerHTML = `<i class="ti ti-chevron-left"></i>${this.stopName}`;
    back.onclick = () => this.goStep('search');
    body.appendChild(back);

    if (!this._lines) {
      body.innerHTML += '<div class="panel-loader"><div class="spinner"></div> Chargement…</div>';
      return;
    }
    if (!this._lines.length) {
      const e=document.createElement('div');e.className='panel-empty';e.innerHTML='<i class="ti ti-mood-sad"></i>Aucune ligne trouvée';body.appendChild(e);return;
    }
    const list = document.createElement('div'); list.className = 'item-list';
    this._lines.forEach(l => {
      const info = {code:l.code||l.name, color:l.color, commercial_mode:l.commercial_modes?.[0]?.name||'', codes:l.codes||[]};
      const termini = [...new Set((l.routes||[]).map(r=>r.direction?.stop_area?.name||'').filter(Boolean))].slice(0,2).join(' · ');
      const btn = document.createElement('button'); btn.className = 'item-btn';
      btn.innerHTML = `${lineIcon(info,22)}<span>${l.name||l.code}</span><span class="item-btn-sub">${termini}</span><i class="ti ti-chevron-right item-btn-arrow"></i>`;
      btn.onclick = () => {
        this.lineId   = l.id;
        this.lineInfo = info;
        this.lineRef  = toLineRef(l.id, l.codes||[]);
        this._routes  = null; this._spCache = null;
        this.step     = 'directions';
        this.render();
        this.fetchDirections();
      };
      list.appendChild(btn);
    });
    body.appendChild(list);
  }

  // ── Step 3 : Directions ──────────────────────────────────────────────────────
  async fetchDirections() {
    const body = document.getElementById(`pb-${this.id}`);
    if (!body) return;
    const list = body.querySelector('.item-list');
    if (list) list.innerHTML = '<div class="panel-loader"><div class="spinner"></div></div>';
    try {
      const [rd, spd] = await Promise.all([
        api('v2/navitia/lines/'+this.lineId+'/routes', {count:10}),
        api('v2/navitia/stop_areas/'+this.stopId+'/lines/'+this.lineId+'/stop_points', {count:30}).catch(()=>({stop_points:[]}))
      ]);
      let sp = spd.stop_points||[];
      if (!sp.length) {
        const fb = await api('v2/navitia/stop_areas/'+this.stopId+'/stop_points', {count:30}).catch(()=>({stop_points:[]}));
        sp = fb.stop_points||[];
      }
     const routes = rd.routes || [];

const inbound = routes.find(
  r => r.direction_type === "inbound"
);

const outbound = routes.find(
  r => r.direction_type === "outbound"
);

this._routes = [inbound, outbound].filter(Boolean);

this._spCache = sp;
    } catch { this._routes=[]; this._spCache=[]; }
    const body2 = document.getElementById(`pb-${this.id}`);
    if (body2) { body2.innerHTML=''; this.renderDirections(body2); }
  }

  renderDirections(body) {
    const back = document.createElement('div');
    back.className = 'step-back';
    back.innerHTML = `<i class="ti ti-chevron-left"></i>Lignes`;
    back.onclick = () => { this.step='lines'; this.render(); };
    body.appendChild(back);

    if (!this._routes) {
      body.innerHTML += '<div class="panel-loader"><div class="spinner"></div> Chargement…</div>';
      return;
    }
    if (!this._routes.length) {
      const e=document.createElement('div');e.className='panel-empty';e.innerHTML='<i class="ti ti-mood-sad"></i>Aucune direction';body.appendChild(e);return;
    }
    const list = document.createElement('div'); list.className = 'item-list';
this._routes.forEach(route => {

  const terminus =
    route.direction?.stop_area?.name ||
    route.name ||
    '?';

  const spIds = (this._spCache || [])
    .filter(sp =>
      (sp.routes || []).some(r => r.id === route.id)
    )
    .map(sp => sp.id);

  const isInbound =
    route.direction_type === 'inbound';

  const arrow = isInbound ? '⬅' : '➡';

  const label = isInbound
    ? `Retour`
    : `Aller`;

  const btn = document.createElement('button');
  btn.className = 'item-btn';

  btn.innerHTML = `
    <span style="font-size:16px">${arrow}</span>
    <span>${label}</span>
    <span class="item-btn-sub">${terminus}</span>
    <i class="ti ti-chevron-right item-btn-arrow"></i>
  `;

  btn.onclick = () => {
    this.terminus = terminus;
    this.spIds = spIds;
    this.step = 'departures';
    this.render();
    this.refresh();
    this.startTimer();
  };

  list.appendChild(btn);
});

  }

  // ── Step 4 : Departures ──────────────────────────────────────────────────────
  renderDepartures(body) {
    body.innerHTML = `
      <div class="dep-view">
        <div class="dep-subheader">
          <div style="flex-shrink:0;">${lineIcon(this.lineInfo, 22)}</div>
          <div class="dep-direction">→ ${this.terminus}</div>
          <span class="fresh ${this.isRT?'rt':'th'}" id="fresh-${this.id}">${this.isRT?'Temps réel':'📅 Théorique'}</span>
        </div>
        <div class="dep-list" id="dep-list-${this.id}">
          <div class="panel-loader"><div class="spinner"></div></div>
        </div>
        <div class="dep-footer">
          <div class="dep-footer-dot ${this.isRT?'rt':'th'}" id="dot-${this.id}"></div>
          <div class="dep-footer-progress">
            <div class="dep-footer-bar" id="bar-${this.id}" style="width:100%"></div>
          </div>
          <span class="dep-footer-cd" id="cd-${this.id}">${this.countdown}s</span>
          <button class="dep-footer-btn" title="Actualiser maintenant" onclick="panels[${this.id}].manualRefresh()">↻</button>
        </div>
      </div>
    `;
  }

  updateDepList(deps) {
    const list = document.getElementById(`dep-list-${this.id}`);
    if (!list) return;
    if (!deps.length) {
      list.innerHTML = '<div class="panel-empty"><i class="ti ti-clock-off"></i>Aucun passage imminent</div>';
      return;
    }
    list.innerHTML = '';
    const now = Date.now();
    deps.slice(0,8).forEach(dep => {
      const expected = new Date(dep.et);
      const aimed    = dep.at ? new Date(dep.at) : null;
      const waitMin  = Math.round((expected - now) / 60000);
      const timeStr  = formatTime(expected);
      let waitLabel = waitMin+' min', cls = '';
      if (dep.atStop||waitMin<=0) { waitLabel='À quai'; cls='quai'; }
      else if (waitMin===1)       { waitLabel='1 min'; cls='soon'; }
      else if (waitMin<=4)        { cls='soon'; }
      let delay = '';
      if (aimed&&dep.rt) { const d=Math.round((expected-aimed)/60000); if(d>0)delay=`<span class="dep-delay late">+${d}'</span>`; else if(d<0)delay=`<span class="dep-delay early">${d}'</span>`; }
      const cancel = dep.cancelled ? '<span style="font-size:10px;color:var(--danger);font-weight:600;margin-left:3px;">Supprimé</span>' : '';
      const row = document.createElement('div'); row.className = 'dep-row';
      row.innerHTML = `
        <div class="dep-dest">${dep.dest||this.terminus}</div>
        <div class="dep-right">
          <div class="dep-wait ${cls}">${waitLabel}${delay}${cancel}</div>
          <div class="dep-time">${timeStr}</div>
        </div>`;
      list.appendChild(row);
    });
  }

  async refresh() {
    try {
      let deps = [], isRT = false;
      const strategy = getStrategy(this.lineInfo?.commercial_mode);

      if (strategy === 'stop-monitoring') {
        for (const spId of this.spIds) {
          const mr = toMonRef(spId); if (!mr) continue;
          try { const d=await api('stop-monitoring',{MonitoringRef:mr,MaximumStopVisits:20}); const p=parseSM(d,this.terminus); if(p.length){deps=p;isRT=true;break;} } catch {}
        }
      } else if (this.lineRef) {
        try { const d=await api('requete-ligne',{LineRef:this.lineRef}); deps=parseRL(d,this.spIds,this.terminus); isRT=true; } catch {}
      }

      if (!deps.length && this.spIds.length) {
        try { const d=await api('v2/navitia/stop_points/'+this.spIds[0]+'/departures',{count:15}); deps=parseNAV(d.departures||[],this.terminus); } catch {}
      }

      this.isRT = isRT;
      // update fresh badge
      const freshEl = document.getElementById(`fresh-${this.id}`);
      const dotEl   = document.getElementById(`dot-${this.id}`);
      if (freshEl) { freshEl.className=`fresh ${isRT?'rt':'th'}`; freshEl.textContent=isRT?'⚡ Temps réel':'📅 Théorique'; }
      if (dotEl)   { dotEl.className=`dep-footer-dot ${isRT?'rt':'th'}`; }
      this.updateDepList(deps);
    } catch {}
  }

  async manualRefresh() { this.countdown=REFRESH_SEC; this.updateTimerUI(); await this.refresh(); }

  // ── Timer ─────────────────────────────────────────────────────────────────────
  startTimer() {
    this.stopTimer();
    this.countdown = REFRESH_SEC;
    this.timer = setInterval(() => {
      this.countdown--;
      this.updateTimerUI();
      if (this.countdown <= 0) { this.countdown = REFRESH_SEC; this.refresh(); }
    }, 1000);
  }

  stopTimer() { clearInterval(this.timer); this.timer = null; }

  updateTimerUI() {
    const cd  = document.getElementById(`cd-${this.id}`);
    const bar = document.getElementById(`bar-${this.id}`);
    if (cd)  cd.textContent  = this.countdown + 's';
    if (bar) bar.style.width = (this.countdown / REFRESH_SEC * 100) + '%';
  }

  // ── Nav helpers ───────────────────────────────────────────────────────────────
  goStep(step) {
    this.stopTimer();
    this.step = step;
    this.render();
  }

  reset() {
    this.stopTimer();
    Object.assign(this, {
      step:'search', stopId:null, stopName:null,
      lineId:null, lineInfo:null, lineRef:null,
      spIds:[], terminus:null, _lines:null, _routes:null, _spCache:null,
      countdown:REFRESH_SEC, isRT:false
    });
    this.render();
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
const panels = [];
const grid   = document.getElementById('grid');

for (let i = 0; i < 3; i++) {
  const el = document.createElement('div');
  el.className = 'panel';
  grid.appendChild(el);
  const p = new Panel(i);
  p.mount(el);
  panels.push(p);
}
</script>
</body>
</html>
