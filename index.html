<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transports IDF — Prochains passages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f4f0; --surface: #ffffff; --border: rgba(0,0,0,0.09);
      --text: #1a1a1a; --muted: #6b6b6b; --accent: #1a56db; --accent-bg: #eef3ff;
      --danger-bg: #fef2f2; --danger-border: #dc2626; --danger-text: #7f1d1d;
      --success: #15803d; --radius: 14px; --radius-sm: 9px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111110; --surface: #1c1c1b; --border: rgba(255,255,255,0.09);
        --text: #f0ede8; --muted: #888885; --accent: #5b8af5; --accent-bg: #1a2540;
        --danger-bg: #2a1010; --danger-border: #dc2626; --danger-text: #fca5a5;
      }
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .app { max-width: 600px; margin: 0 auto; padding: 2rem 1rem 4rem; }
    header { margin-bottom: 2rem; }
    header h1 { font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    header p { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .search-bar { display: flex; gap: 8px; margin-bottom: 1rem; }
    .search-bar input {
      flex: 1; height: 42px; padding: 0 14px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text);
      font-family: inherit; font-size: 14px; outline: none; transition: border-color 0.15s;
    }
    .search-bar input:focus { border-color: var(--accent); }
    .search-bar button {
      height: 42px; padding: 0 18px; border-radius: var(--radius-sm);
      font-family: inherit; font-size: 14px; font-weight: 500;
      cursor: pointer; border: none; background: var(--accent); color: #fff; transition: opacity 0.15s;
    }
    .search-bar button:hover { opacity: 0.9; }
    .search-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hints { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.5rem; }
    .hint-chip {
      font-size: 12px; padding: 4px 10px; border-radius: 99px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--muted); cursor: pointer; transition: all 0.12s;
    }
    .hint-chip:hover { border-color: var(--accent); color: var(--accent); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 8px; }
    .list-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; cursor: pointer;
      border-bottom: 1px solid var(--border); transition: background 0.12s;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item:hover { background: var(--bg); }
    .item-icon {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      background: var(--accent-bg); color: var(--accent);
      display: flex; align-items: center; justify-content: center; font-size: 16px;
    }
    .item-name { font-size: 14px; font-weight: 500; }
    .item-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .item-lines { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .badge {
      font-size: 11px; font-weight: 600; padding: 2px 8px;
      border-radius: 4px; border: 1px solid var(--border);
      background: var(--bg); color: var(--muted);
    }
    .badge-line {
      font-size: 11px; font-weight: 700; padding: 2px 9px;
      border-radius: 4px; display: inline-block;
    }
    /* Direction picker */
    .direction-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; cursor: pointer;
      border-bottom: 1px solid var(--border); transition: background 0.12s;
    }
    .direction-item:last-child { border-bottom: none; }
    .direction-item:hover { background: var(--bg); }
    .direction-icon {
      width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; letter-spacing: -0.3px;
    }
    .direction-info { flex: 1; min-width: 0; }
    .direction-terminus { font-size: 14px; font-weight: 600; }
    .direction-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .direction-count {
      font-size: 12px; font-weight: 600; color: var(--accent);
      background: var(--accent-bg); padding: 3px 10px; border-radius: 99px;
      flex-shrink: 0;
    }
    /* Filtre direction actif dans la vue départs */
    .filter-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; background: var(--accent-bg);
      border-bottom: 1px solid var(--border);
    }
    .filter-bar-label { font-size: 12px; color: var(--accent); font-weight: 500; }
    .filter-bar-clear {
      font-size: 12px; color: var(--accent); cursor: pointer;
      background: none; border: none; font-family: inherit; font-weight: 600;
      padding: 0; text-decoration: underline;
    }
    /* Departures */
    .departure-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .departure-item:last-child { border-bottom: none; }
    .departure-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .departure-dest { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .departure-mode { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .departure-right { text-align: right; flex-shrink: 0; }
    .departure-time { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .departure-wait { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .departure-wait.soon { color: var(--success); font-weight: 600; }
    .departure-wait.quai { color: var(--accent); font-weight: 600; }
    .section-label {
      font-size: 12px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em; padding: 0 0 10px;
    }
    .breadcrumb { font-size: 12px; color: var(--muted); margin-bottom: 1rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .breadcrumb span { cursor: pointer; }
    .breadcrumb span:hover { color: var(--accent); text-decoration: underline; }
    .breadcrumb .sep { opacity: 0.4; }
    .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 14px; }
    .empty .icon { font-size: 36px; margin-bottom: 12px; }
    .error-box {
      background: var(--danger-bg); border: 1px solid var(--danger-border);
      border-radius: var(--radius-sm); padding: 12px 16px;
      font-size: 13px; color: var(--danger-text);
    }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid var(--border); border-top-color: var(--muted);
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: -3px; margin-right: 6px;
    }
    .freshness-badge {
      display: inline-block; font-size: 10px; font-weight: 500; padding: 1px 6px;
      border-radius: 99px; margin-left: 6px; vertical-align: middle;
    }
    .freshness-realtime { background: #dcfce7; color: #166534; }
    .freshness-theorique { background: #fef9c3; color: #713f12; }
    @media (prefers-color-scheme: dark) {
      .freshness-realtime { background: #14532d; color: #86efac; }
      .freshness-theorique { background: #422006; color: #fde68a; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>🚇 Transports IDF</h1>
    <p>Recherche un arrêt pour voir les prochains passages</p>
  </header>

  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Ex: Châtelet, Nation, Montparnasse…" />
    <button id="search-btn" onclick="searchStops()">Rechercher</button>
  </div>

  <div class="hints">
    <span class="hint-chip" onclick="fillAndSearch('Châtelet')">Châtelet</span>
    <span class="hint-chip" onclick="fillAndSearch('Nation')">Nation</span>
    <span class="hint-chip" onclick="fillAndSearch('Montparnasse')">Montparnasse</span>
    <span class="hint-chip" onclick="fillAndSearch('La Défense')">La Défense</span>
    <span class="hint-chip" onclick="fillAndSearch('Gare du Nord')">Gare du Nord</span>
    <span class="hint-chip" onclick="fillAndSearch('Saint-Lazare')">Saint-Lazare</span>
  </div>

  <div class="breadcrumb" id="breadcrumb" style="display:none;"></div>

  <!-- Vue 1 : résultats de recherche -->
  <div id="view-search">
    <div class="empty" id="search-empty">
      <div class="icon">🔍</div>
      Tape le nom d'un arrêt et clique sur Rechercher.
    </div>
    <div id="search-results"></div>
  </div>

  
  <!-- Vue 2 : lignes -->
  <div id="view-lines" style="display:none;">
    <div id="lines-content"></div>
  </div>

  <!-- Vue 2 : quais / stop_points -->

  <div id="view-stoppoints" style="display:none;">
    <div id="stoppoints-content"></div>
  </div>

  <!-- Vue 2.5 : choix de la direction -->
  <div id="view-directions" style="display:none;">
    <div id="directions-content"></div>
  </div>

  <!-- Vue 3 : passages filtrés -->
  <div id="view-departures" style="display:none;">
    <div id="departures-content"></div>
  </div>
</div>

<script>
  let currentStopAreaId   = '';
  let currentStopAreaName = '';
  let currentStopPointId  = '';
  let currentStopPointName = '';
  // Tous les départs chargés (pour le filtre côté client)
  let allDepartures = [];

  async function callProxy(endpoint, params = {}) {
    const qs = new URLSearchParams({ endpoint, ...params }).toString();
    const resp = await fetch('/api/prim?' + qs);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    return resp.json();
  }

  function fillAndSearch(name) {
    document.getElementById('search-input').value = name;
    searchStops();
  }

  document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') searchStops();
  });

  function showView(name) {
    ['search', 'lines', 'stoppoints', 'directions', 'departures'].forEach(v => {
      document.getElementById('view-' + v).style.display = v === name ? 'block' : 'none';
    });
  }

  function updateBreadcrumb(items) {
    const bc = document.getElementById('breadcrumb');
    if (!items.length) { bc.style.display = 'none'; return; }
    bc.style.display = 'flex';
    bc.innerHTML = items.map((item, i) =>
      i < items.length - 1
        ? `<span onclick="${item.action}">${item.label}</span><span class="sep">›</span>`
        : `<strong>${item.label}</strong>`
    ).join('');
  }

  function parseNavitiaDate(str) {
    if (!str) return null;
    const y = str.slice(0,4), mo = str.slice(4,6), d = str.slice(6,8);
    const h = str.slice(9,11), mi = str.slice(11,13), s = str.slice(13,15);
    return new Date(`${y}-${mo}-${d}T${h}:${mi}:${s}`);
  }

  function formatTime(date) {
    if (!date) return '—';
    return date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  function textColor(hex) {
    const r = parseInt(hex.slice(0,2),16);
    const g = parseInt(hex.slice(2,4),16);
    const b = parseInt(hex.slice(4,6),16);
    return (r*299 + g*587 + b*114) / 1000 > 128 ? '#000000' : '#ffffff';
  }

  // Génère une icône SVG fidèle aux pictogrammes officiels IDFM
  // Métro → cercle | RER/Transilien → carré arrondi | Tram → losange | Bus/autre → rectangle arrondi
  function makeLineIcon(info, size = 28) {
    const code  = info.code || info.label || '?';
    const mode  = (info.commercial_mode || '').toLowerCase();
    const bg    = info.color ? '#' + info.color.replace('#','') : '#888888';
    const fg    = textColor(info.color ? info.color.replace('#','') : '888888');
    const fs    = code.length <= 2 ? Math.round(size * 0.46) : code.length === 3 ? Math.round(size * 0.36) : Math.round(size * 0.28);
    const cx    = size / 2, cy = size / 2, r = size / 2 - 0.5;

    let shape;
    if (mode.includes('métro') || mode.includes('metro')) {
      // Cercle plein
      shape = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${bg}"/>`;
    } else if (mode.includes('rer') || mode.includes('transilien') || mode.includes('train')) {
      // Carré très arrondi (rx = 6/28 * size)
      const rx = Math.round(size * 0.22);
      shape = `<rect x="0.5" y="0.5" width="${size-1}" height="${size-1}" rx="${rx}" fill="${bg}"/>`;
    } else if (mode.includes('tram')) {
      // Losange
      const h = size / 2;
      shape = `<polygon points="${cx},0.5 ${size-0.5},${cy} ${cx},${size-0.5} 0.5,${cy}" fill="${bg}"/>`;
    } else {
      // Rectangle arrondi (bus, noctilien, navette…)
      const rx = Math.round(size * 0.18);
      const w  = code.length <= 2 ? size : size + Math.round((code.length - 2) * fs * 0.62);
      shape = `<rect x="0.5" y="0.5" width="${w-1}" height="${size-1}" rx="${rx}" fill="${bg}"/>`;
      return `<svg width="${w}" height="${size}" viewBox="0 0 ${w} ${size}" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;flex-shrink:0;">${shape}<text x="${w/2}" y="${cy}" dominant-baseline="central" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="${fs}" font-weight="700" fill="${fg}">${code}</text></svg>`;
    }
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;flex-shrink:0;">${shape}<text x="${cx}" y="${cy}" dominant-baseline="central" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="${fs}" font-weight="700" fill="${fg}">${code}</text></svg>`;
  }

  // Badge simple (inline dans du texte, taille réduite)
  function makeBadge(info, size = 26) {
    return makeLineIcon(info, size);
  }

  // ─── Vue 1 : recherche ───────────────────────────────────────────────────────
  async function searchStops() {
    const q = document.getElementById('search-input').value.trim();
    if (!q) return;

    const btn = document.getElementById('search-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';

    showView('search');
    updateBreadcrumb([]);

    const empty = document.getElementById('search-empty');
    const results = document.getElementById('search-results');
    empty.innerHTML = '<span class="spinner"></span> Recherche en cours…';
    empty.style.display = 'block';
    results.innerHTML = '';

    try {
      const data = await callProxy('v2/navitia/places', { q, count: 10 });
      const places = (data.places || []).filter(p =>
        p.embedded_type === 'stop_area' || p.embedded_type === 'stop_point'
      );

      empty.style.display = 'none';

      if (!places.length) {
        empty.innerHTML = `<div class="icon">😕</div>Aucun arrêt trouvé pour « ${q} ».`;
        empty.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Rechercher';
        return;
      }

      const card = document.createElement('div');
      card.className = 'card';

      places.forEach(p => {
        const s = p.stop_area || p.stop_point;
        if (!s) return;
        const modes = (s.physical_modes || []).map(m => m.name).join(', ') || '';
        const lines = (s.lines || []).slice(0, 6)
          .map(l => `<span class="badge">${l.code || l.name || '?'}</span>`).join('');

        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <div class="item-icon">📍</div>
          <div style="flex:1; min-width:0;">
            <div class="item-name">${s.name}</div>
            ${modes ? `<div class="item-meta">${modes}</div>` : ''}
            ${lines ? `<div class="item-lines">${lines}</div>` : ''}
          </div>
          <span style="color:var(--muted); font-size:20px;">›</span>
        `;
        item.onclick = () => loadStopPoints(s.id, s.name);
        card.appendChild(item);
      });

      results.appendChild(card);
    } catch (e) {
      empty.innerHTML = `<div class="error-box">Erreur : ${e.message}</div>`;
      empty.style.display = 'block';
    }

    btn.disabled = false;
    btn.textContent = 'Rechercher';
  }

  // ─── Vue 2 : quais ───────────────────────────────────────────────────────────
  async function loadStopPoints(stopAreaId, stopAreaName) {
    currentStopAreaId   = stopAreaId;
    currentStopAreaName = stopAreaName;
    showView('stoppoints');
    updateBreadcrumb([
      { label: document.getElementById('search-input').value, action: 'backToSearch()' },
      { label: stopAreaName }
    ]);

    const el = document.getElementById('stoppoints-content');
    el.innerHTML = '<div class="empty"><span class="spinner"></span> Chargement des quais…</div>';

    try {
      const data = await callProxy('v2/navitia/stop_areas/' + stopAreaId + '/stop_points', { count: 40 });
      const points = data.stop_points || [];

      el.innerHTML = `<div class="section-label">Choisir un quai — ${stopAreaName}</div>`;

      if (!points.length) {
        el.innerHTML += '<div class="empty"><div class="icon">😕</div>Aucun quai trouvé.</div>';
        return;
      }

      // Regrouper les stop_points par signature (lignes desservies)
      // Un même quai physique peut avoir plusieurs stop_points pour des modes différents
      // On regroupe pour éviter les doublons sans info utile
      const groups = new Map();
      points.forEach(sp => {
        const lines = sp.lines || [];
        // Clé = ensemble trié des IDs de lignes
        const sigKey = lines.map(l => l.id).sort().join('|') || sp.id;
        if (!groups.has(sigKey)) {
          groups.set(sigKey, { sp, lines });
        } else {
          // Garder celui qui a le plus de lignes
          if (lines.length > groups.get(sigKey).lines.length) {
            groups.set(sigKey, { sp, lines });
          }
        }
      });

      const card = document.createElement('div');
      card.className = 'card';

      groups.forEach(({ sp, lines }) => {
        // Construire un label de direction depuis les routes/destinations des lignes
        // On extrait les directions disponibles sur ce quai via les routes
        const routes = sp.routes || [];
        const directions = [...new Set(
          routes.map(r => r.direction?.stop_area?.name || r.name || '').filter(Boolean)
        )].slice(0, 3);

        const modeIcon = getModeIcon(lines[0]?.commercial_modes?.[0]?.name || sp.commercial_modes?.[0]?.name || '');

        const lineBadges = lines.slice(0, 6).map(l => makeLineIcon({
          code: l.code || l.name || '?',
          color: l.color,
          commercial_mode: l.commercial_modes?.[0]?.name || l.physical_modes?.[0]?.name || ''
        }, 26)).join(' ');

        const dirText = directions.length
          ? `<div class="item-meta" style="margin-top:4px;">→ ${directions.join(', ')}</div>`
          : '';

        const modeName = lines[0]?.commercial_modes?.[0]?.name || sp.commercial_modes?.[0]?.name || '';

        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <div class="item-icon" style="font-size:18px;">${modeIcon}</div>
          <div style="flex:1; min-width:0;">
            <div class="item-name">${sp.name}${modeName ? `<span style="font-size:12px;font-weight:400;color:var(--muted);margin-left:6px;">${modeName}</span>` : ''}</div>
            ${lineBadges ? `<div class="item-lines" style="margin-top:5px;">${lineBadges}</div>` : ''}
            ${dirText}
          </div>
          <span style="color:var(--muted); font-size:20px;">›</span>
        `;
        item.onclick = () => loadDirections(sp.id, sp.name, stopAreaId, stopAreaName);
        card.appendChild(item);
      });

      el.appendChild(card);
    } catch (e) {
      el.innerHTML = `<div class="error-box">Erreur : ${e.message}</div>`;
    }
  }

  function getModeIcon(modeName) {
    const m = (modeName || '').toLowerCase();
    if (m.includes('métro') || m.includes('metro')) return '🚇';
    if (m.includes('rer') || m.includes('train') || m.includes('transilien')) return '🚆';
    if (m.includes('tram')) return '🚊';
    if (m.includes('bus') || m.includes('noctilien')) return '🚌';
    if (m.includes('câble') || m.includes('cable') || m.includes('funiculaire')) return '🚡';
    return '🚉';
  }

  // ─── Vue 2.5 : choix de la direction ─────────────────────────────────────────
  async function loadDirections(stopPointId, stopPointName, stopAreaId, stopAreaName) {
    currentStopPointId   = stopPointId;
    currentStopPointName = stopPointName;
    showView('directions');
    updateBreadcrumb([
      { label: document.getElementById('search-input').value, action: 'backToSearch()' },
      { label: stopAreaName, action: `loadStopPoints('${stopAreaId}', '${stopAreaName.replace(/'/g,"\\'")}')` },
      { label: stopPointName }
    ]);

    const el = document.getElementById('directions-content');
    el.innerHTML = '<div class="empty"><span class="spinner"></span> Chargement des directions…</div>';

    try {
      const data = await callProxy(
        'v2/navitia/stop_points/' + stopPointId + '/departures',
        { count: 50 }
      );

      allDepartures = data.departures || [];
      el.innerHTML = `<div class="section-label">Choisir une direction — ${stopPointName}</div>`;

      if (!allDepartures.length) {
        el.innerHTML += '<div class="empty"><div class="icon">🕐</div>Aucun départ trouvé.</div>';
        return;
      }

      // Regrouper par (lineCode + direction) pour lister les terminus uniques
      const dirMap = new Map();
      allDepartures.forEach(dep => {
        const info = dep.display_informations || {};
        const key  = (info.code || '?') + '||' + (info.direction || info.headsign || '?');
        if (!dirMap.has(key)) {
          dirMap.set(key, { info, count: 0, next: null });
        }
        const entry = dirMap.get(key);
        entry.count++;
        if (!entry.next) {
          const sdt = dep.stop_date_time || {};
          entry.next = parseNavitiaDate(sdt.departure_date_time || sdt.arrival_date_time);
        }
      });

      // Option "Toutes les directions"
      const card = document.createElement('div');
      card.className = 'card';

      const allItem = document.createElement('div');
      allItem.className = 'direction-item';
      allItem.innerHTML = `
        <div class="direction-icon" style="background:var(--accent-bg);color:var(--accent);">✦</div>
        <div class="direction-info">
          <div class="direction-terminus">Toutes les directions</div>
          <div class="direction-sub">${allDepartures.length} prochain${allDepartures.length > 1 ? 's' : ''} passage${allDepartures.length > 1 ? 's' : ''}</div>
        </div>
        <span style="color:var(--muted); font-size:20px;">›</span>
      `;
      allItem.onclick = () => showDepartures(null, stopAreaId, stopAreaName);
      card.appendChild(allItem);

      // Une ligne par terminus distinct
      dirMap.forEach((entry, key) => {
        const { info, count, next } = entry;
        const direction = info.direction || info.headsign || '?';
        const nextStr   = next ? formatTime(next) : '—';
        const waitMin   = next ? Math.round((next - Date.now()) / 60000) : null;
        const waitStr   = waitMin === null ? '' : waitMin <= 0 ? ' · À quai' : ` · dans ${waitMin} min`;
        const icon      = makeLineIcon(info, 36);

        const item = document.createElement('div');
        item.className = 'direction-item';
        item.innerHTML = `
          <div style="flex-shrink:0;">${icon}</div>
          <div class="direction-info">
            <div class="direction-terminus">${direction}</div>
            <div class="direction-sub">Prochain : ${nextStr}${waitStr}</div>
          </div>
          <span class="direction-count">${count}</span>
        `;
        item.onclick = () => showDepartures(key, stopAreaId, stopAreaName);
        card.appendChild(item);
      });

      el.appendChild(card);
    } catch (e) {
      el.innerHTML = `<div class="error-box">Erreur : ${e.message}</div>`;
    }
  }

  // ─── Vue 3 : passages filtrés ────────────────────────────────────────────────
  function showDepartures(directionKey, stopAreaId, stopAreaName) {
    showView('departures');

    const filtered = directionKey
      ? allDepartures.filter(dep => {
          const info = dep.display_informations || {};
          const key  = (info.code || '?') + '||' + (info.direction || info.headsign || '?');
          return key === directionKey;
        })
      : allDepartures;

    const dirLabel = directionKey ? directionKey.split('||')[1] : 'Toutes les directions';

    updateBreadcrumb([
      { label: document.getElementById('search-input').value, action: 'backToSearch()' },
      { label: stopAreaName, action: `loadStopPoints('${stopAreaId}', '${stopAreaName.replace(/'/g,"\\'")}')` },
      { label: currentStopPointName, action: `loadDirections('${currentStopPointId}', '${currentStopPointName.replace(/'/g,"\\'")}', '${stopAreaId}', '${stopAreaName.replace(/'/g,"\\'")}')` },
      { label: dirLabel }
    ]);

    const el = document.getElementById('departures-content');
    el.innerHTML = '';

    // Bandeau de filtre actif
    if (directionKey) {
      const info = allDepartures.find(d => {
        const i = d.display_informations || {};
        return ((i.code || '?') + '||' + (i.direction || i.headsign || '?')) === directionKey;
      })?.display_informations || {};

      const filterBar = document.createElement('div');
      filterBar.className = 'card';
      filterBar.style.marginBottom = '8px';
      filterBar.innerHTML = `
        <div class="filter-bar">
          <span class="filter-bar-label">🎯 ${makeBadge(info)} &nbsp;Direction : <strong>${dirLabel}</strong></span>
          <button class="filter-bar-clear" onclick="showDepartures(null, '${stopAreaId}', '${stopAreaName.replace(/'/g,"\\'")}')">Voir tout</button>
        </div>
      `;
      el.appendChild(filterBar);
    }

    el.innerHTML += `<div class="section-label">📍 ${currentStopPointName}</div>`;

    if (!filtered.length) {
      el.innerHTML += '<div class="empty"><div class="icon">🕐</div>Aucun passage trouvé.</div>';
      return;
    }

    const card = document.createElement('div');
    card.className = 'card';

    filtered.forEach(dep => {
      const info = dep.display_informations || {};
      const sdt  = dep.stop_date_time || {};
      const dateStr = sdt.departure_date_time || sdt.arrival_date_time;
      const date    = parseNavitiaDate(dateStr);
      const timeStr = formatTime(date);

      const waitMin = date ? Math.round((date - Date.now()) / 60000) : null;
      let waitLabel = '', waitClass = '';
      if (waitMin !== null) {
        if (waitMin <= 0)      { waitLabel = 'À quai';          waitClass = 'quai'; }
        else if (waitMin <= 1) { waitLabel = '1 min';           waitClass = 'soon'; }
        else                   { waitLabel = waitMin + ' min';  waitClass = waitMin <= 4 ? 'soon' : ''; }
      }

      const isRealtime = sdt.data_freshness === 'realtime';
      const freshBadge = `<span class="freshness-badge ${isRealtime ? 'freshness-realtime' : 'freshness-theorique'}">${isRealtime ? '⚡ Temps réel' : '📅 Théorique'}</span>`;

      const item = document.createElement('div');
      item.className = 'departure-item';
      item.innerHTML = `
        <div class="departure-left">
          ${makeLineIcon(info, 32)}
          <div style="min-width:0;">
            <div class="departure-dest">${info.direction || info.headsign || '?'}</div>
            <div class="departure-mode">${info.commercial_mode || ''}</div>
          </div>
        </div>
        <div class="departure-right">
          <div class="departure-time">${timeStr}${freshBadge}</div>
          <div class="departure-wait ${waitClass}">${waitLabel}</div>
        </div>
      `;
      card.appendChild(item);
    });

    el.appendChild(card);
  }

  function backToSearch() {
    showView('search');
    updateBreadcrumb([]);
  }

// ===== MODE ARRÊT -> LIGNE -> DESTINATION -> HORAIRES =====

let availableLines = [];

async function loadStopPoints(stopAreaId, stopAreaName) {
  currentStopAreaId = stopAreaId;
  currentStopAreaName = stopAreaName;

  showView('lines');

  updateBreadcrumb([
    { label: document.getElementById('search-input').value, action: 'backToSearch()' },
    { label: stopAreaName }
  ]);

  const el = document.getElementById('lines-content');
  el.innerHTML = '<div class="empty"><span class="spinner"></span> Chargement des lignes…</div>';

  try {
    const data = await callProxy(
      'v2/navitia/stop_areas/' + stopAreaId + '/stop_points',
      { count: 100 }
    );

    const points = data.stop_points || [];
    const linesMap = new Map();

    points.forEach(sp => {
      (sp.lines || []).forEach(line => {
        if (!linesMap.has(line.id)) {
          linesMap.set(line.id, {
            ...line,
            stopPointIds: [sp.id]
          });
        } else {
          linesMap.get(line.id).stopPointIds.push(sp.id);
        }
      });
    });

    availableLines = [...linesMap.values()];

    el.innerHTML = `<div class="section-label">Choisir une ligne — ${stopAreaName}</div>`;

    const card = document.createElement('div');
    card.className = 'card';

    availableLines.forEach(line => {
      const item = document.createElement('div');
      item.className = 'list-item';

      item.innerHTML = `
        <div>${makeLineIcon({
          code: line.code || line.name || '?',
          color: line.color,
          commercial_mode: line.commercial_modes?.[0]?.name || ''
        },32)}</div>
        <div style="flex:1;">
          <div class="item-name">${line.name || line.code}</div>
        </div>
        <span style="color:var(--muted); font-size:20px;">›</span>
      `;

      item.onclick = () => loadDirections(line.id);
      card.appendChild(item);
    });

    el.appendChild(card);

  } catch(e) {
    el.innerHTML = `<div class="error-box">Erreur : ${e.message}</div>`;
  }
}

async function loadDirections(lineId) {

  const line = availableLines.find(l => l.id === lineId);
  if (!line) return;

  showView('directions');

  updateBreadcrumb([
    { label: document.getElementById('search-input').value, action: 'backToSearch()' },
    { label: currentStopAreaName, action: `loadStopPoints('${currentStopAreaId}','${currentStopAreaName.replace(/'/g,"\\\\'")}')` },
    { label: line.code || line.name }
  ]);

  const el = document.getElementById('directions-content');
  el.innerHTML = '<div class="empty"><span class="spinner"></span> Chargement des destinations…</div>';

  try {

    let departures = [];

    for (const spId of line.stopPointIds) {
      try {
        const data = await callProxy(
          'v2/navitia/stop_points/' + spId + '/departures',
          { count: 50 }
        );
        departures.push(...(data.departures || []));
      } catch(_) {}
    }

    departures = departures.filter(dep =>
      (dep.display_informations?.code || '') === (line.code || '')
    );

    allDepartures = departures;

    const dirMap = new Map();

    departures.forEach(dep => {
      const info = dep.display_informations || {};
      const direction = info.direction || info.headsign || 'Destination inconnue';

      if (!dirMap.has(direction)) {
        dirMap.set(direction, []);
      }

      dirMap.get(direction).push(dep);
    });

    el.innerHTML = `<div class="section-label">Choisir une destination — ${line.code || line.name}</div>`;

    const card = document.createElement('div');
    card.className = 'card';

    dirMap.forEach((deps, direction) => {

      const first = deps[0];
      const info = first.display_informations || {};

      const item = document.createElement('div');
      item.className = 'direction-item';

      item.innerHTML = `
        <div>${makeLineIcon(info,36)}</div>
        <div class="direction-info">
          <div class="direction-terminus">${direction}</div>
          <div class="direction-sub">${deps.length} passage(s)</div>
        </div>
      `;

      item.onclick = () => {
        allDepartures = deps;
        showDepartures(null, currentStopAreaId, currentStopAreaName);
      };

      card.appendChild(item);
    });

    el.innerHTML = '';
    el.appendChild(card);

  } catch(e) {
    el.innerHTML = `<div class="error-box">Erreur : ${e.message}</div>`;
  }
}

</script>
