<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IDF Horaires</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#f2f2f7;
      --surface:rgba(255,255,255,.82);
      --surface-solid:#ffffff;
      --surface2:rgba(242,242,247,.9);
      --border:rgba(60,60,67,.12);
      --sep:rgba(60,60,67,.08);
      --text:#000000;
      --text2:rgba(60,60,67,.9);
      --muted:rgba(60,60,67,.55);
      --muted2:rgba(60,60,67,.18);
      --accent:#007aff;
      --accent-bg:rgba(0,122,255,.1);
      --green:#34c759;
      --green-bg:rgba(52,199,89,.1);
      --orange:#ff9500;
      --orange-bg:rgba(255,149,0,.1);
      --red:#ff3b30;
      --red-bg:rgba(255,59,48,.08);
      --r:16px;
      --r-sm:10px;
      --sans:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
    }
    @media(prefers-color-scheme:dark){
      :root{
        --bg:#000000;
        --surface:rgba(28,28,30,.88);
        --surface-solid:#1c1c1e;
        --surface2:rgba(44,44,46,.9);
        --border:rgba(255,255,255,.12);
        --sep:rgba(255,255,255,.08);
        --text:#ffffff;
        --text2:rgba(235,235,245,.9);
        --muted:rgba(235,235,245,.55);
        --muted2:rgba(235,235,245,.16);
        --accent:#0a84ff;
        --accent-bg:rgba(10,132,255,.15);
        --green:#30d158;
        --green-bg:rgba(48,209,88,.12);
        --orange:#ff9f0a;
        --orange-bg:rgba(255,159,10,.12);
        --red:#ff453a;
        --red-bg:rgba(255,69,58,.1);
      }
    }

    html,body{width:100%;height:100%;overflow:hidden;}
    body{font-family:var(--sans);background:var(--bg);color:var(--text);position:relative;-webkit-font-smoothing:antialiased;}

    /* ── Topbar ── */
    .topbar{
      position:fixed;top:0;left:0;right:0;height:52px;z-index:200;
      display:flex;align-items:center;justify-content:space-between;
      padding:0 20px;
      background:rgba(242,242,247,.85);
      backdrop-filter:saturate(180%) blur(20px);
      -webkit-backdrop-filter:saturate(180%) blur(20px);
      border-bottom:.5px solid var(--border);
    }
    @media(prefers-color-scheme:dark){.topbar{background:rgba(0,0,0,.75);}}

    .topbar-left{display:flex;align-items:center;gap:8px;}
    .topbar-title{font-size:17px;font-weight:600;letter-spacing:-.02em;color:var(--text);}
    .topbar-sub{font-size:12px;color:var(--muted);font-weight:400;margin-left:2px;}
    .topbar-right{display:flex;align-items:center;gap:10px;}
    .topbar-clock{font-size:14px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:-.01em;}

    .btn-add{
      display:flex;align-items:center;gap:5px;
      height:32px;padding:0 14px;border-radius:980px;
      font-family:var(--sans);font-size:14px;font-weight:500;
      cursor:pointer;border:none;
      background:var(--accent);color:#fff;
      transition:filter .15s,transform .1s;
      -webkit-tap-highlight-color:transparent;
    }
    .btn-add:hover{filter:brightness(1.08);}
    .btn-add:active{transform:scale(.96);filter:brightness(.95);}

    /* ── Canvas ── */
    #canvas{position:fixed;top:52px;left:0;right:0;bottom:0;z-index:1;overflow:hidden;}

    /* ── Widget ── */
    .widget{
      position:absolute;
      width:310px;min-width:240px;min-height:220px;
      background:var(--surface);
      border-radius:var(--r);
      border:.5px solid var(--border);
      display:flex;flex-direction:column;
      overflow:hidden;
      box-shadow:0 2px 20px rgba(0,0,0,.08),0 1px 4px rgba(0,0,0,.06);
      backdrop-filter:saturate(180%) blur(20px);
      -webkit-backdrop-filter:saturate(180%) blur(20px);
      transition:box-shadow .2s,transform .15s;
      user-select:none;
    }
    .widget.dragging{
      box-shadow:0 16px 56px rgba(0,0,0,.18),0 4px 16px rgba(0,0,0,.1);
      transform:scale(1.01);
      z-index:100;
    }

    /* ── Header ── */
    .w-header{
      display:flex;align-items:center;
      padding:10px 12px 9px;
      background:var(--surface2);
      border-bottom:.5px solid var(--sep);
      flex-shrink:0;cursor:grab;gap:8px;
    }
    .w-header:active{cursor:grabbing;}

    /* Traffic lights */
    .w-lights{display:flex;gap:5px;flex-shrink:0;}
    .w-light{width:11px;height:11px;border-radius:50%;cursor:pointer;transition:filter .1s;border:none;padding:0;flex-shrink:0;}
    .w-light:hover{filter:brightness(.8);}
    .w-light.close{background:#ff5f57;}
    .w-light.min{background:#febc2e;}
    .w-light.reset{background:#28c840;}

    /* Editable title */
    .w-title-wrap{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;}
    .w-title{
      font-size:12px;font-weight:600;color:var(--text2);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      max-width:100%;text-align:center;cursor:text;
      border-radius:4px;padding:1px 4px;
      transition:background .12s;
    }
    .w-title:hover{background:var(--muted2);}
    .w-title-input{
      font-family:var(--sans);font-size:12px;font-weight:600;
      color:var(--text2);background:var(--muted2);
      border:none;outline:none;border-radius:4px;
      padding:1px 6px;text-align:center;
      width:100%;max-width:160px;
    }

    .w-badge{flex-shrink:0;display:flex;align-items:center;}

    .w-body{flex:1;display:flex;flex-direction:column;overflow:hidden;}

    /* ── Resize ── */
    .w-resize{
      position:absolute;bottom:0;right:0;
      width:20px;height:20px;cursor:se-resize;
      display:flex;align-items:flex-end;justify-content:flex-end;
      padding:4px;color:var(--muted2);opacity:.6;
      transition:opacity .15s;
    }
    .w-resize:hover{opacity:1;}

    /* ── Search ── */
    .step-search{
      flex:1;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      padding:20px 16px;gap:14px;
    }
    .step-icon{
      width:50px;height:50px;border-radius:14px;
      background:var(--accent-bg);
      display:flex;align-items:center;justify-content:center;
      font-size:24px;
    }
    .step-label{font-size:15px;font-weight:500;color:var(--text);}
    .step-sub{font-size:13px;color:var(--muted);text-align:center;line-height:1.4;}

    .search-wrap{position:relative;width:100%;}
    .search-input-wrap{
      display:flex;align-items:center;gap:8px;
      background:var(--surface2);border:.5px solid var(--border);
      border-radius:10px;padding:0 12px;height:38px;
      transition:border-color .15s,box-shadow .15s;
    }
    .search-input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,122,255,.12);}
    .search-icon{color:var(--muted);font-size:14px;flex-shrink:0;}
    .search-input-wrap input{
      flex:1;border:none;outline:none;background:transparent;
      font-family:var(--sans);font-size:14px;color:var(--text);
    }
    .search-input-wrap input::placeholder{color:var(--muted);}

    .ac-drop{
      position:absolute;top:calc(100%+6px);left:0;right:0;
      background:var(--surface-solid);
      border:.5px solid var(--border);border-radius:12px;z-index:400;
      overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.12);
      max-height:220px;overflow-y:auto;
    }
    .ac-item{padding:10px 14px;cursor:pointer;border-bottom:.5px solid var(--sep);transition:background .1s;}
    .ac-item:last-child{border-bottom:none;}
    .ac-item:hover,.ac-item.active{background:var(--accent-bg);}
    .ac-name{font-size:14px;font-weight:500;color:var(--text);}
    .ac-sub{font-size:12px;color:var(--muted);margin-top:2px;}

    /* ── Step back ── */
    .step-back{
      display:flex;align-items:center;gap:4px;
      padding:9px 16px;font-size:14px;font-weight:500;
      color:var(--accent);cursor:pointer;flex-shrink:0;
      border-bottom:.5px solid var(--sep);transition:background .1s;
    }
    .step-back:hover{background:var(--accent-bg);}
    .step-back-arrow{font-size:18px;line-height:1;margin-top:-1px;}

    /* ── Dir tabs ── */
    .dir-tabs{
      display:flex;gap:0;padding:10px 12px 6px;flex-shrink:0;
      background:var(--surface2);border-bottom:.5px solid var(--sep);
    }
    .dir-seg{
      flex:1;height:28px;
      font-family:var(--sans);font-size:12px;font-weight:500;cursor:pointer;
      border:none;background:var(--muted2);color:var(--muted);
      transition:background .15s,color .15s;
    }
    .dir-seg:first-child{border-radius:7px 0 0 7px;}
    .dir-seg:last-child{border-radius:0 7px 7px 0;}
    .dir-seg.active{background:var(--accent);color:#fff;}
    .dir-seg:not(.active):hover{background:var(--border);}

    /* ── List ── */
    .item-list{flex:1;overflow-y:auto;padding:4px 0;}
    .item-list::-webkit-scrollbar{width:0;}
    .item-row{
      display:flex;align-items:center;gap:10px;
      padding:10px 16px;cursor:pointer;
      border-bottom:.5px solid var(--sep);
      transition:background .1s;
    }
    .item-row:last-child{border-bottom:none;}
    .item-row:hover{background:var(--accent-bg);}
    .item-row:active{background:var(--muted2);}
    .item-info{flex:1;min-width:0;}
    .item-name{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .item-sub{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .item-chev{color:var(--muted2);font-size:16px;flex-shrink:0;}

    /* ── Group label ── */
    /* ── Group header ── */
    .group-hdr{
      display:flex;align-items:center;gap:8px;
      margin:8px 8px 4px;
      padding:7px 10px;
      background:var(--accent-bg);
      border-radius:8px;
      border:.5px solid rgba(0,122,255,.15);
    }
    .group-hdr-icon{font-size:16px;flex-shrink:0;}
    .group-hdr-label{
      font-size:13px;font-weight:600;
      color:var(--accent);letter-spacing:-.01em;
      flex:1;
    }
    .group-hdr-count{
      font-size:11px;font-weight:500;
      color:var(--accent);opacity:.65;
      background:rgba(0,122,255,.1);
      padding:2px 7px;border-radius:99px;
    }
    .group-section{margin-bottom:4px;}
    .group-section .item-row:first-of-type{border-top:none;}

    /* ── Departures ── */
    .dep-view{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .dep-header{
      display:flex;align-items:center;gap:10px;
      padding:10px 16px;border-bottom:.5px solid var(--sep);
      background:var(--surface2);flex-shrink:0;
    }
    .dep-dir{font-size:14px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .fresh{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;flex-shrink:0;}
    .fresh.rt{background:var(--green-bg);color:var(--green);}
    .fresh.th{background:var(--orange-bg);color:var(--orange);}

    .dep-list{flex:1;overflow-y:auto;}
    .dep-list::-webkit-scrollbar{width:0;}
    .dep-row{
      display:flex;align-items:center;justify-content:space-between;
      padding:11px 16px;border-bottom:.5px solid var(--sep);gap:12px;
    }
    .dep-row:last-child{border-bottom:none;}
    .dep-dest{font-size:13px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .dep-right{text-align:right;flex-shrink:0;}
    .dep-wait{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1;}
    .dep-wait.quai{color:var(--accent);}
    .dep-wait.soon{color:var(--green);}
    .dep-wait.late{color:var(--red);}
    .dep-abs{font-size:11px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;}
    .dep-delay{font-size:11px;font-weight:600;}
    .dep-delay.pos{color:var(--red);}
    .dep-delay.neg{color:var(--green);}

    /* ── Footer ── */
    .dep-footer{
      display:flex;align-items:center;gap:8px;
      padding:7px 16px;border-top:.5px solid var(--sep);flex-shrink:0;
      background:var(--surface2);
    }
    .rt-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;animation:pulse 2s infinite;}
    .rt-dot.ok{background:var(--green);}
    .rt-dot.warn{background:var(--orange);}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .fp-track{flex:1;height:2px;background:var(--muted2);border-radius:99px;overflow:hidden;}
    .fp-fill{height:100%;background:var(--accent);border-radius:99px;transition:width 1s linear;}
    .fp-cd{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:20px;text-align:right;}
    .fp-btn{background:none;border:none;cursor:pointer;font-size:14px;color:var(--muted);padding:2px 4px;border-radius:5px;transition:color .12s;}
    .fp-btn:hover{color:var(--accent);}

    /* ── States ── */
    .loader{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:14px;}
    .spinner{width:16px;height:16px;border:2px solid var(--muted2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:14px;padding:24px;text-align:center;}
    .empty-icon{font-size:32px;opacity:.35;}
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-title">🚇 IDF Horaires</div>
    <div class="topbar-sub">Temps réel</div>
  </div>
  <div class="topbar-right">
    <div class="topbar-clock" id="clock">--:--:--</div>
    <button class="btn-add" id="btn-add">+ Panneau</button>
  </div>
</div>

<div id="canvas"></div>

<script>
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),1000);
document.getElementById('clock').textContent=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});

const PROXY='/api/prim',REFRESH=20;
async function api(ep,p={}){const qs=new URLSearchParams({endpoint:ep,...p}).toString();const r=await fetch(PROXY+'?'+qs);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}

function tc(hex){hex=(hex||'').replace('#','');if(hex.length!==6)return'#fff';const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);return(r*299+g*587+b*114)/1000>128?'#000':'#fff';}

function lineIcon(info,size=22){
  const code=String(info.code||'?'),mode=(info.commercial_mode||'').toLowerCase();
  const bg=info.color?'#'+info.color.replace('#',''):'#888';const fg=tc(bg);
  const cx=size/2,cy=size/2;
  const fs=code.length<=2?Math.round(size*.44):code.length===3?Math.round(size*.32):Math.round(size*.26);
  let shape,w=size;
  if(mode.includes('métro')||mode.includes('metro')){shape=`<circle cx="${cx}" cy="${cy}" r="${cx-1}" fill="${bg}"/>`;}
  else if(mode.includes('rer')||mode.includes('transilien')||mode.includes('train')){const rx=Math.round(size*.2);shape=`<rect x="1" y="1" width="${size-2}" height="${size-2}" rx="${rx}" fill="${bg}"/>`;}
  else if(mode.includes('tram')){shape=`<polygon points="${cx},1 ${size-1},${cy} ${cx},${size-1} 1,${cy}" fill="${bg}"/>`;}
  else{const cw=fs*.65;w=Math.max(size,Math.round(cw*code.length+size*.5));const rx=Math.round(size*.2);shape=`<rect x="1" y="1" width="${w-2}" height="${size-2}" rx="${rx}" fill="${bg}"/>`;
    return`<svg width="${w}" height="${size}" viewBox="0 0 ${w} ${size}" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;flex-shrink:0;">${shape}<text x="${w/2}" y="${cy}" dominant-baseline="central" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="${fs}" font-weight="600" fill="${fg}">${code}</text></svg>`;}
  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;flex-shrink:0;">${shape}<text x="${cx}" y="${cy}" dominant-baseline="central" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="${fs}" font-weight="600" fill="${fg}">${code}</text></svg>`;
}

function ft(d){return d?d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'--:--';}
function toLineRef(id,codes){if(codes){const s=codes.find(c=>c.type==='source');if(s){const m=s.value.match(/Line:(C[\w-]+)/);if(m)return`STIF:Line::${m[1]}:`;}}const m=id.match(/IDFM:(C[\w-]+)/);return m?`STIF:Line::${m[1]}:`:null;}
function numId(id){const m=(id||'').match(/:(\d+)$/);return m?m[1]:null;}
function monRef(spId){const m=(spId||'').match(/:(\d+)$/);return m?`STIF:StopPoint:Q:${m[1]}:`:null;}
function nm(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
function lm(a,b){const na=nm(a),nb=nm(b);if(na===nb||na.includes(nb)||nb.includes(na))return true;const wa=na.split(/\s+/).find(w=>w.length>=4),wb=nb.split(/\s+/).find(w=>w.length>=4);return!!(wa&&wb&&wa===wb);}
function n2i(s){if(!s)return null;return`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T${s.slice(9,11)}:${s.slice(11,13)}:${s.slice(13,15)}`;}
function getStrat(mode){const m=(mode||'').toLowerCase();return(m.includes('métro')||m.includes('metro')||m.includes('rer')||m.includes('transilien')||m.includes('train'))?'sm':'et';}

const PARIS_KW=['paris','austerlitz','gare de lyon','gare du nord','saint lazare','lazare','montparnasse','invalides','javel','orsay','bercy','bibliotheque','massy','issy','la defense','roissy','cdg'];
function isParisStop(n){const s=nm(n);return PARIS_KW.some(k=>s.includes(k));}

function parseSM(data,term){
  const v=data?.Siri?.ServiceDelivery?.StopMonitoringDelivery?.[0]?.MonitoredStopVisit||[];
  const now=Date.now(),res=[];
  v.forEach(v=>{const vj=v.MonitoredVehicleJourney||{},c=vj.MonitoredCall||{};
    const dest=c.DestinationDisplay?.[0]?.value||vj.DestinationName?.[0]?.value||'';
    if(term&&dest&&!lm(term,dest))return;
    const et=c.ExpectedDepartureTime||c.AimedDepartureTime||c.ExpectedArrivalTime||c.AimedArrivalTime;
    const at=c.AimedDepartureTime||c.AimedArrivalTime;
    if(!et||new Date(et)<now-60000)return;
    res.push({et,at,dest:dest||term,atStop:c.VehicleAtStop===true,cancelled:c.DepartureStatus==='cancelled',rt:true});
  });
  return res.sort((a,b)=>new Date(a.et)-new Date(b.et));
}
function parseET(data,spIds,term){
  const f=data?.Siri?.ServiceDelivery?.EstimatedTimetableDelivery?.[0]?.EstimatedJourneyVersionFrame?.[0];
  const jj=f?.EstimatedVehicleJourney||[];
  const now=Date.now(),nums=new Set(spIds.map(numId).filter(Boolean)),res=[];
  jj.forEach(vj=>{(vj.EstimatedCalls?.EstimatedCall||[]).forEach(c=>{
    const sr=c.StopPointRef?.value||'';const rn=sr.match(/:Q:(\d+):/)?.[1]||sr.match(/:(\d+):?$/)?.[1];
    if(!rn||!nums.has(rn))return;
    const dest=c.DestinationDisplay?.[0]?.value||vj.DestinationName?.[0]?.value||'';
    if(term&&dest&&!lm(term,dest))return;
    const et=c.ExpectedDepartureTime||c.ExpectedArrivalTime||c.AimedDepartureTime||c.AimedArrivalTime;
    const at=c.AimedDepartureTime||c.AimedArrivalTime;
    if(!et||new Date(et)<now-60000)return;
    res.push({et,at,dest:dest||term,atStop:c.VehicleAtStop===true,cancelled:c.DepartureStatus==='cancelled',rt:true});
  });});
  return res.sort((a,b)=>new Date(a.et)-new Date(b.et));
}
function parseNAV(deps,term){
  return deps.map(dep=>{const sdt=dep.stop_date_time||{},info=dep.display_informations||{};
    const et=n2i(sdt.departure_date_time||sdt.arrival_date_time);
    return{et,at:null,dest:info.direction||info.headsign||term,atStop:false,cancelled:false,rt:false};
  }).filter(d=>d.et&&new Date(d.et)>=Date.now()-60000);
}

// ── Drag & Resize ─────────────────────────────────────────────────────────────
let zTop=10;
const canvas=document.getElementById('canvas');

function makeDraggable(widget){
  const handle=widget.querySelector('.w-header');
  let ox,oy,drag=false;
  const start=e=>{if(e.target.closest('.w-lights')||e.target.closest('.w-title-wrap'))return;drag=true;widget.classList.add('dragging');widget.style.zIndex=++zTop;const src=e.touches?e.touches[0]:e;ox=src.clientX-widget.offsetLeft;oy=src.clientY-widget.offsetTop;e.preventDefault&&!e.touches&&e.preventDefault();};
  const move=e=>{if(!drag)return;const src=e.touches?e.touches[0]:e;let nx=src.clientX-ox,ny=src.clientY-oy;const cw=canvas.clientWidth,ch=canvas.clientHeight;nx=Math.max(0,Math.min(nx,cw-widget.offsetWidth));ny=Math.max(0,Math.min(ny,ch-widget.offsetHeight));widget.style.left=nx+'px';widget.style.top=ny+'px';};
  const end=()=>{if(drag){drag=false;widget.classList.remove('dragging');}};
  handle.addEventListener('mousedown',start);document.addEventListener('mousemove',move);document.addEventListener('mouseup',end);
  handle.addEventListener('touchstart',start,{passive:true});document.addEventListener('touchmove',move,{passive:true});document.addEventListener('touchend',end);
}
function makeResizable(widget){
  const handle=widget.querySelector('.w-resize');let resize=false,sx,sy,sw,sh;
  handle.addEventListener('mousedown',e=>{resize=true;sx=e.clientX;sy=e.clientY;sw=widget.offsetWidth;sh=widget.offsetHeight;widget.style.zIndex=++zTop;e.preventDefault();e.stopPropagation();});
  document.addEventListener('mousemove',e=>{if(!resize)return;widget.style.width=Math.max(240,sw+(e.clientX-sx))+'px';widget.style.height=Math.max(220,sh+(e.clientY-sy))+'px';});
  document.addEventListener('mouseup',()=>{resize=false;});
}


// ── Branch clustering for RER/Transilien ─────────────────────────────────────
// Classe les terminus en Ouest et Est selon leur longitude par rapport à Paris.
// Paris centre = lon 2.347 (Châtelet).
// Les lignes Nord/Sud (RER B, D) utilisent la latitude.
const PARIS_LON = 2.347;
const PARIS_LAT = 48.853;

function clusterByBranch(routes){
  // Séparer les routes avec et sans coordonnées
  const withCoord = routes.filter(r => r.coord && !isNaN(parseFloat(r.coord.lon)));
  if(withCoord.length < 2) return [{label:null, routes}];

  // Calculer l'amplitude lon vs lat pour choisir l'axe dominant
  const lons = withCoord.map(r => parseFloat(r.coord.lon));
  const lats = withCoord.map(r => parseFloat(r.coord.lat));
  const spanLon = Math.max(...lons) - Math.min(...lons);
  const spanLat = Math.max(...lats) - Math.min(...lats);

  // Axe dominant : si la ligne est plus étalée en longitude → axe Est/Ouest
  // sinon → axe Nord/Sud (RER B, C, D...)
  // On compense le fait que 1° lat ≈ 111 km mais 1° lon ≈ 74 km en IDF
  // donc on normalise spanLon * 1.5 pour comparer correctement
  const useEastWest = spanLon * 1.5 >= spanLat;

  const west=[], east=[], north=[], south=[];

  routes.forEach(r => {
    const lon = r.coord ? parseFloat(r.coord.lon) : NaN;
    const lat = r.coord ? parseFloat(r.coord.lat) : NaN;
    if(useEastWest){
      if(isNaN(lon)) { west.push(r); return; } // sans coord → côté ouest par défaut
      if(lon <= PARIS_LON) west.push(r);
      else east.push(r);
    } else {
      if(isNaN(lat)) { south.push(r); return; }
      if(lat >= PARIS_LAT) north.push(r);
      else south.push(r);
    }
  });

  if(useEastWest){
    // Trier chaque groupe par longitude (les plus proches de Paris en premier)
    west.sort((a,b)=>parseFloat(b.coord?.lon||0)-parseFloat(a.coord?.lon||0));
    east.sort((a,b)=>parseFloat(a.coord?.lon||0)-parseFloat(b.coord?.lon||0));
    if(west.length && east.length)
      return [{label:'← Ouest', routes:west}, {label:'Est →', routes:east}];
  } else {
    north.sort((a,b)=>parseFloat(a.coord?.lat||0)-parseFloat(b.coord?.lat||0));
    south.sort((a,b)=>parseFloat(b.coord?.lat||0)-parseFloat(a.coord?.lat||0));
    if(north.length && south.length)
      return [{label:'↑ Nord', routes:north}, {label:'↓ Sud', routes:south}];
  }

  return [{label:null, routes}];
}

// ── Panel ─────────────────────────────────────────────────────────────────────
let panelCount=0;
const panels=[];

class Panel{
  constructor(){
    this.id=++panelCount;this.customTitle=null;
    this.step='search';
    this.stopId=null;this.stopName=null;
    this.lineId=null;this.lineInfo=null;this.lineRef=null;
    this.spIds=[];this.terminus=null;
    this._lines=null;this._routes=null;this._sp=null;this._dirFilter=null;
    this.countdown=REFRESH;this.timer=null;
    this.acTimer=null;this.acRes=[];this.acIdx=-1;
    this.isRT=false;this.widget=null;
  }

  mount(){
    const cw=canvas.clientWidth,ch=canvas.clientHeight;
    const off=(panelCount-1)%8;
    const x=Math.min(28+off*28,cw-320),y=Math.min(12+off*28,ch-260);
    const el=document.createElement('div');
    el.className='widget';
    el.style.cssText=`left:${x}px;top:${y}px;width:310px;height:420px;z-index:${++zTop};`;
    el.innerHTML=`
      <div class="w-header">
        <div class="w-lights">
          <button class="w-light close" title="Fermer"></button>
          <button class="w-light min" title="Minimiser" style="opacity:.35;cursor:default;"></button>
          <button class="w-light reset" title="Réinitialiser"></button>
        </div>
        <div class="w-title-wrap">
          <span class="w-title" id="wt-${this.id}">Panneau ${this.id}</span>
        </div>
        <div class="w-badge" id="wb-badge-${this.id}"></div>
      </div>
      <div class="w-body" id="wb-${this.id}"></div>
      <div class="w-resize">
        <svg width="9" height="9" viewBox="0 0 9 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M8 1L1 8M8 4.5L4.5 8"/>
        </svg>
      </div>
    `;
    canvas.appendChild(el);
    this.widget=el;
    makeDraggable(el);makeResizable(el);

    // Traffic lights actions
    el.querySelector('.w-light.close').onclick=()=>this.destroy();
    el.querySelector('.w-light.reset').onclick=()=>this.reset();

    // ── Editable title ──
    const titleEl=el.querySelector(`#wt-${this.id}`);
    titleEl.ondblclick=()=>this.startEditTitle(titleEl);
    titleEl.onclick=e=>{
      // single click after short delay if not double
      if(this._titleClickTimer){clearTimeout(this._titleClickTimer);this._titleClickTimer=null;return;}
      this._titleClickTimer=setTimeout(()=>{this._titleClickTimer=null;},250);
    };

    // Animate in
    el.style.opacity='0';el.style.transform='scale(.94) translateY(8px)';
    requestAnimationFrame(()=>{el.style.transition='opacity .22s ease,transform .22s cubic-bezier(.34,1.56,.64,1)';el.style.opacity='1';el.style.transform='scale(1) translateY(0)';setTimeout(()=>el.style.transition='',300);});
    this.render();return this;
  }

  startEditTitle(titleEl){
    const cur=titleEl.textContent;
    const inp=document.createElement('input');
    inp.className='w-title-input';inp.value=cur;inp.maxLength=30;
    titleEl.replaceWith(inp);inp.focus();inp.select();
    const commit=()=>{
      const val=inp.value.trim()||('Panneau '+this.id);
      this.customTitle=val;
      const span=document.createElement('span');
      span.className='w-title';span.id=`wt-${this.id}`;span.textContent=val;
      span.ondblclick=()=>this.startEditTitle(span);
      inp.replaceWith(span);
    };
    inp.onblur=commit;
    inp.onkeydown=e=>{if(e.key==='Enter')inp.blur();if(e.key==='Escape'){inp.value=cur;inp.blur();}};
  }

  setTitle(t){
    if(this.customTitle)return; // ne pas écraser un titre personnalisé
    const el=document.getElementById(`wt-${this.id}`);
    if(el&&el.tagName==='SPAN')el.textContent=t;
  }

  setBadge(html){
    const el=document.getElementById(`wb-badge-${this.id}`);
    if(el)el.innerHTML=html;
  }

  render(){
    const body=document.getElementById(`wb-${this.id}`);
    if(!body)return;body.innerHTML='';
    if(this.step==='search')this.renderSearch(body);
    else if(this.step==='lines')this.renderLines(body);
    else if(this.step==='directions')this.renderDirections(body);
    else if(this.step==='departures')this.renderDepartures(body);
  }

  // ── Search ────────────────────────────────────────────────────────────────
  renderSearch(body){
    this.setBadge('');
    body.innerHTML=`
      <div class="step-search">
        <div class="step-icon">📍</div>
        <div class="step-label">Choisir un arrêt</div>
        <div class="step-sub">Recherche un arrêt pour afficher les prochains passages</div>
        <div class="search-wrap">
          <div class="search-input-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" placeholder="Nation, Châtelet…" autocomplete="off" id="si-${this.id}"/>
          </div>
          <div class="ac-drop" id="ac-${this.id}" style="display:none;"></div>
        </div>
      </div>
    `;
    const inp=document.getElementById(`si-${this.id}`);
    const drop=document.getElementById(`ac-${this.id}`);
    inp.addEventListener('input',()=>{
      clearTimeout(this.acTimer);const q=inp.value.trim();
      if(q.length<2){drop.style.display='none';return;}
      drop.style.display='block';
      drop.innerHTML='<div class="ac-item" style="display:flex;justify-content:center;padding:14px;"><div class="spinner"></div></div>';
      this.acTimer=setTimeout(async()=>{
        try{
          const d=await api('v2/navitia/places',{q,count:8});
          this.acRes=(d.places||[]).filter(p=>p.embedded_type==='stop_area'||p.embedded_type==='stop_point');
          this.acIdx=-1;
          if(!this.acRes.length){drop.style.display='none';return;}
          drop.innerHTML=this.acRes.map((p,i)=>{
            const s=p.stop_area||p.stop_point;
            const modes=(s.physical_modes||[]).map(m=>m.name).join(' · ');
            return`<div class="ac-item" data-i="${i}"><div class="ac-name">${s.name}</div>${modes?`<div class="ac-sub">${modes}</div>`:''}</div>`;
          }).join('');
          drop.querySelectorAll('.ac-item').forEach(item=>{item.addEventListener('mousedown',e=>{e.preventDefault();this.selectStop(this.acRes[+item.dataset.i]);});});
        }catch{drop.style.display='none';}
      },260);
    });
    inp.addEventListener('keydown',e=>{
      const items=drop.querySelectorAll('.ac-item');
      if(e.key==='ArrowDown'){e.preventDefault();this.acIdx=Math.min(this.acIdx+1,items.length-1);items.forEach((el,i)=>el.classList.toggle('active',i===this.acIdx));}
      if(e.key==='ArrowUp'){e.preventDefault();this.acIdx=Math.max(this.acIdx-1,0);items.forEach((el,i)=>el.classList.toggle('active',i===this.acIdx));}
      if(e.key==='Enter'&&this.acIdx>=0&&this.acRes[this.acIdx])this.selectStop(this.acRes[this.acIdx]);
      if(e.key==='Escape')drop.style.display='none';
    });
    document.addEventListener('click',e=>{if(!e.target.closest(`#si-${this.id}`)&&!e.target.closest(`#ac-${this.id}`))drop.style.display='none';});
    setTimeout(()=>inp.focus(),60);
  }

  async selectStop(place){
    const s=place.stop_area||place.stop_point;
    this.stopId=s.id;this.stopName=s.name;this._lines=null;
    this.setTitle(s.name);this.step='lines';this.render();
    await this.fetchLines();
  }

  // ── Lines ─────────────────────────────────────────────────────────────────
  async fetchLines(){
    const body=document.getElementById(`wb-${this.id}`);if(!body)return;
    const list=body.querySelector('.item-list');
    if(list)list.innerHTML='<div class="loader"><div class="spinner"></div>Chargement…</div>';
    try{
      const d=await api('v2/navitia/stop_areas/'+this.stopId+'/lines',{count:40});
      const lines=d.lines||[];
      const mo={'rer':0,'transilien':0,'train':0,'métro':1,'metro':1,'tramway':2,'tram':2,'bus':3,'noctilien':3};
      const rank=l=>{const m=(l.commercial_modes?.[0]?.name||'').toLowerCase();const e=Object.entries(mo).find(([k])=>m.includes(k));return e?e[1]:4;};
      lines.sort((a,b)=>rank(a)-rank(b)||(a.code||'').localeCompare(b.code||'',undefined,{numeric:true}));
      this._lines=lines;
    }catch{this._lines=[];}
    const body2=document.getElementById(`wb-${this.id}`);
    if(body2){body2.innerHTML='';this.renderLines(body2);}
  }

  renderLines(body){
    const back=document.createElement('div');back.className='step-back';
    back.innerHTML=`<span class="step-back-arrow">‹</span>${this.stopName}`;back.onclick=()=>{this.step='search';this.render();};body.appendChild(back);
    if(!this._lines){body.appendChild(Object.assign(document.createElement('div'),{className:'loader',innerHTML:'<div class="spinner"></div>Chargement…'}));return;}
    if(!this._lines.length){body.innerHTML+='<div class="empty-state"><div class="empty-icon">🚫</div>Aucune ligne trouvée</div>';return;}
    const list=document.createElement('div');list.className='item-list';
    this._lines.forEach(l=>{
      const info={code:l.code||l.name,color:l.color,commercial_mode:l.commercial_modes?.[0]?.name||'',codes:l.codes||[]};
      const termini=[...new Set((l.routes||[]).map(r=>r.direction?.stop_area?.name||'').filter(Boolean))].slice(0,2).join(' · ');
      const row=document.createElement('div');row.className='item-row';
      row.innerHTML=`${lineIcon(info,22)}<div class="item-info"><div class="item-name">${l.name||l.code}</div>${termini?`<div class="item-sub">${termini}</div>`:''}</div><span class="item-chev">›</span>`;
      row.onclick=()=>{this.lineId=l.id;this.lineInfo=info;this.lineRef=toLineRef(l.id,l.codes||[]);this._routes=null;this._sp=null;this._dirFilter=null;this.step='directions';this.render();this.fetchDirections();};
      list.appendChild(row);
    });
    body.appendChild(list);
  }

  // ── Directions ────────────────────────────────────────────────────────────
  async fetchDirections(){
    const body=document.getElementById(`wb-${this.id}`);if(!body)return;
    const loader=document.createElement('div');loader.className='loader';loader.innerHTML='<div class="spinner"></div>Chargement…';
    body.querySelector('.item-list')?.remove();body.appendChild(loader);
    try{
      const [rd,sd]=await Promise.all([
        api('v2/navitia/lines/'+this.lineId+'/routes',{count:20}),
        api('v2/navitia/stop_areas/'+this.stopId+'/lines/'+this.lineId+'/stop_points',{count:30}).catch(()=>({stop_points:[]}))
      ]);
      let sp=sd.stop_points||[];
      if(!sp.length){const fb=await api('v2/navitia/stop_areas/'+this.stopId+'/stop_points',{count:30}).catch(()=>({stop_points:[]}));sp=fb.stop_points||[];}
      this._sp=sp;
      this._routes=(rd.routes||[]).map(route=>{
        const terminus=route.direction?.stop_area?.name||route.name||'?';
        const rsp=sp.filter(s=>!s.routes?.length||s.routes.some(r=>r.id===route.id)).map(s=>s.id);
        return{id:route.id,terminus,spIds:rsp.length?rsp:sp.map(s=>s.id),directionType:route.direction_type||'outbound'};
      });
    }catch{this._routes=[];}
    const body2=document.getElementById(`wb-${this.id}`);
    if(body2){body2.innerHTML='';this.renderDirections(body2);}
  }

  renderDirections(body){
    this.setBadge(lineIcon(this.lineInfo,18));
    const back=document.createElement('div');back.className='step-back';
    back.innerHTML=`<span class="step-back-arrow">‹</span>Lignes`;back.onclick=()=>{this.setBadge('');this.step='lines';this.render();};body.appendChild(back);
    if(!this._routes){body.appendChild(Object.assign(document.createElement('div'),{className:'loader',innerHTML:'<div class="spinner"></div>Chargement…'}));return;}
    if(!this._routes.length){body.innerHTML+='<div class="empty-state"><div class="empty-icon">😕</div>Aucune direction</div>';return;}

    const hasOut=this._routes.some(r=>r.directionType==='outbound');
    const hasIn=this._routes.some(r=>r.directionType==='inbound');
    if(hasOut&&hasIn){
      if(!this._dirFilter)this._dirFilter='outbound';
      const tabs=document.createElement('div');tabs.className='dir-tabs';
      [{dir:'outbound',lbl:'→ Aller'},{dir:'inbound',lbl:'← Retour'}].forEach(({dir,lbl})=>{
        const btn=document.createElement('button');btn.className='dir-seg'+(this._dirFilter===dir?' active':'');btn.textContent=lbl;
        btn.onclick=()=>{this._dirFilter=dir;const b=document.getElementById(`wb-${this.id}`);if(b){b.innerHTML='';this.renderDirections(b);}};
        tabs.appendChild(btn);
      });body.appendChild(tabs);
    }

    const visible=(hasOut&&hasIn)?this._routes.filter(r=>r.directionType===this._dirFilter):this._routes;
    if(!visible.length){body.innerHTML+='<div class="empty-state"><div class="empty-icon">😕</div>Aucune destination</div>';return;}

    const isHeavy=['rer','transilien','train'].some(k=>(this.lineInfo?.commercial_mode||'').toLowerCase().includes(k));
    let groups;
    if(isHeavy&&visible.length>2){
      groups=clusterByBranch(visible);
    }else{groups=[{label:null,routes:visible}];}

    const list=document.createElement('div');list.className='item-list';

    // Icônes selon le label de groupe
    const GROUP_ICONS={
      '← Ouest':'🌅','Est →':'🌄',
      '↑ Nord':'⬆️','↓ Sud':'⬇️',
      'Via / Vers Paris':'🏛','Banlieue':'🌳',
      '🏛 Paris':'🏛'
    };

    groups.forEach(({label,routes})=>{
      const section=document.createElement('div');section.className='group-section';

      if(label){
        const icon=GROUP_ICONS[label]||'📍';
        const hdr=document.createElement('div');hdr.className='group-hdr';
        hdr.innerHTML=`
          <span class="group-hdr-icon">${icon}</span>
          <span class="group-hdr-label">${label}</span>
          <span class="group-hdr-count">${routes.length}</span>
        `;
        section.appendChild(hdr);
      }

      routes.forEach(route=>{
        const arrow=route.directionType==='inbound'?'←':'→';
        const row=document.createElement('div');row.className='item-row';
        row.innerHTML=`<div style="font-size:13px;color:var(--muted);flex-shrink:0;">${arrow}</div><div class="item-info"><div class="item-name">${route.terminus}</div></div><span class="item-chev">›</span>`;
        row.onclick=()=>{this.terminus=route.terminus;this.spIds=route.spIds;this.step='departures';this.render();this.refresh();this.startTimer();};
        section.appendChild(row);
      });

      list.appendChild(section);
    });
    body.appendChild(list);
  }

  // ── Departures ────────────────────────────────────────────────────────────
  renderDepartures(body){
    this.setTitle(this.stopName||('Panneau '+this.id));
    this.setBadge(lineIcon(this.lineInfo,18));
    body.innerHTML=`
      <div class="dep-view">
        <div class="dep-header">
          ${lineIcon(this.lineInfo,22)}
          <div class="dep-dir">→ ${this.terminus}</div>
          <span class="fresh ${this.isRT?'rt':'th'}" id="fr-${this.id}">${this.isRT?'Temps réel':'Théorique'}</span>
        </div>
        <div class="dep-list" id="dl-${this.id}"><div class="loader"><div class="spinner"></div></div></div>
        <div class="dep-footer">
          <div class="rt-dot ${this.isRT?'ok':'warn'}" id="dot-${this.id}"></div>
          <div class="fp-track"><div class="fp-fill" id="bar-${this.id}" style="width:100%"></div></div>
          <span class="fp-cd" id="cd-${this.id}">${this.countdown}s</span>
          <button class="fp-btn" onclick="panels.find(p=>p.id===${this.id})?.manualRefresh()">↻</button>
        </div>
      </div>
    `;
  }

  updateList(deps){
    const list=document.getElementById(`dl-${this.id}`);if(!list)return;
    if(!deps.length){list.innerHTML='<div class="empty-state"><div class="empty-icon">🕐</div>Aucun passage imminent</div>';return;}
    list.innerHTML='';const now=Date.now();
    deps.slice(0,8).forEach(dep=>{
      const exp=new Date(dep.et),aim=dep.at?new Date(dep.at):null;
      const wm=Math.round((exp-now)/60000),ts=ft(exp);
      let lbl=wm+' min',cls='';
      if(dep.cancelled){lbl='Annulé';cls='late';}
      else if(dep.atStop||wm<=0){lbl='À quai';cls='quai';}
      else if(wm===1){lbl='1 min';cls='soon';}
      else if(wm<=4){cls='soon';}
      let delay='';
      if(aim&&dep.rt){const d=Math.round((exp-aim)/60000);if(d>0)delay=`<div class="dep-delay pos">+${d} min</div>`;else if(d<0)delay=`<div class="dep-delay neg">${d} min</div>`;}
      const row=document.createElement('div');row.className='dep-row';
      row.innerHTML=`
        <div class="dep-dest">${dep.dest||this.terminus}</div>
        <div class="dep-right">
          <div class="dep-wait ${cls}">${lbl}</div>
          <div class="dep-abs">${ts}${delay?'&ensp;'+delay.replace('<div','<span').replace('</div>','</span>'):''}
          </div>
        </div>`;
      list.appendChild(row);
    });
  }

  async refresh(){
    try{
      let deps=[],isRT=false;const s=getStrat(this.lineInfo?.commercial_mode);
      if(s==='sm'){
        for(const sp of this.spIds){const mr=monRef(sp);if(!mr)continue;
          try{const d=await api('stop-monitoring',{MonitoringRef:mr,MaximumStopVisits:20});const p=parseSM(d,this.terminus);if(p.length){deps=p;isRT=true;break;}}catch{}}
      }else if(this.lineRef){
        try{const d=await api('estimated-timetable',{LineRef:this.lineRef});deps=parseET(d,this.spIds,this.terminus);isRT=true;}catch{}
      }
      if(!deps.length&&this.spIds.length){
        try{const d=await api('v2/navitia/stop_points/'+this.spIds[0]+'/departures',{count:15});deps=parseNAV(d.departures||[],this.terminus);}catch{}
      }
      this.isRT=isRT;
      const fr=document.getElementById(`fr-${this.id}`);const dot=document.getElementById(`dot-${this.id}`);
      if(fr){fr.className=`fresh ${isRT?'rt':'th'}`;fr.textContent=isRT?'Temps réel':'Théorique';}
      if(dot)dot.className=`rt-dot ${isRT?'ok':'warn'}`;
      this.updateList(deps);
    }catch{}
  }

  async manualRefresh(){this.countdown=REFRESH;this.updateTimerUI();await this.refresh();}
  startTimer(){this.stopTimer();this.countdown=REFRESH;this.timer=setInterval(()=>{this.countdown--;this.updateTimerUI();if(this.countdown<=0){this.countdown=REFRESH;this.refresh();}},1000);}
  stopTimer(){clearInterval(this.timer);this.timer=null;}
  updateTimerUI(){const cd=document.getElementById(`cd-${this.id}`);const bar=document.getElementById(`bar-${this.id}`);if(cd)cd.textContent=this.countdown+'s';if(bar)bar.style.width=(this.countdown/REFRESH*100)+'%';}

  destroy(){
    if(this.timer)clearInterval(this.timer);
    this.widget.style.transition='opacity .18s ease,transform .18s ease';
    this.widget.style.opacity='0';this.widget.style.transform='scale(.94)';
    setTimeout(()=>this.widget?.remove(),200);
    const idx=panels.indexOf(this);if(idx>=0)panels.splice(idx,1);
  }

  reset(){
    this.stopTimer();this.customTitle=null;
    Object.assign(this,{step:'search',stopId:null,stopName:null,lineId:null,lineInfo:null,lineRef:null,spIds:[],terminus:null,_lines:null,_routes:null,_sp:null,_dirFilter:null,countdown:REFRESH,isRT:false});
    // Restaurer le titre par défaut
    const span=document.getElementById(`wt-${this.id}`);
    if(span)span.textContent='Panneau '+this.id;
    this.render();
  }
}

document.getElementById('btn-add').addEventListener('click',()=>{const p=new Panel();p.mount();panels.push(p);});
[1,2,3].forEach(()=>{const p=new Panel();p.mount();panels.push(p);});
