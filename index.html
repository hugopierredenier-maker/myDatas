<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transit Apple Style</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--secondary:#6e6e73;--accent:#0071e3;--radius:24px;--shadow:0 4px 20px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.03)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.header{position:sticky;top:0;backdrop-filter:blur(24px);background:rgba(245,245,247,.8);padding:20px;border-bottom:1px solid rgba(0,0,0,.06)}
.container{max-width:900px;margin:auto;padding:24px}
h1{font-size:42px;letter-spacing:-.03em}
.subtitle{color:var(--secondary);margin-top:6px}
.search{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);margin:24px 0}
.search input{width:100%;border:none;outline:none;font-size:17px}
.card{background:#fff;border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:16px;padding:18px 20px;border-bottom:1px solid rgba(0,0,0,.05);cursor:pointer}
.item:last-child{border-bottom:none}.item:hover{background:#fafafa}
.badge{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#0071e3;color:#fff;font-weight:700}
.name{font-weight:600}.meta{color:#6e6e73;font-size:14px}
</style>
</head>
<body>
<div class="header"><div class="container"><h1>Mes Transports</h1><div class="subtitle">Design inspiré d'Apple</div></div></div>
<div class="container">
<div class="search"><input type="text" placeholder="Rechercher un arrêt..."></div>
<div class="card">
<div class="item"><div class="badge">A</div><div><div class="name">RER A</div><div class="meta">Direction Cergy le Haut</div></div></div>
<div class="item"><div class="badge">1</div><div><div class="name">Métro 1</div><div class="meta">Direction La Défense</div></div></div>
</div>
</div>
</body>
</html>
