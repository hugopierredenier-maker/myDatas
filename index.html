<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transports IDF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

    :root {
      --bg:          #f2f2f7;
      --surface:     #ffffff;
      --surface2:    #f2f2f7;
      --border:      rgba(60,60,67,.12);
      --border2:     rgba(60,60,67,.22);
      --text:        #000000;
      --text2:       #3c3c43;
      --muted:       rgba(60,60,67,.55);
      --accent:      #007aff;
      --accent-bg:   rgba(0,122,255,.08);
      --success:     #34c759;
      --success-bg:  rgba(52,199,89,.1);
      --warning:     #ff9500;
      --warning-bg:  rgba(255,149,0,.1);
      --danger:      #ff3b30;
      --danger-bg:   rgba(255,59,48,.1);
      --info-bg:     rgba(0,122,255,.08);
      --sep:         rgba(60,60,67,.1);
      --r:           16px;
      --r-sm:        12px;
      --r-xs:        8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:         #000000;
        --surface:    #1c1c1e;
        --surface2:   #2c2c2e;
        --border:     rgba(255,255,255,.1);
        --border2:    rgba(255,255,255,.2);
        --text:       #ffffff;
        --text2:      #ebebf5;
        --muted:      rgba(235,235,245,.55);
        --accent:     #0a84ff;
        --accent-bg:  rgba(10,132,255,.12);
        --success:    #30d158;
        --success-bg: rgba(48,209,88,.12);
        --warning:    #ff9f0a;
        --warning-bg: rgba(255,159,10,.12);
        --danger:     #ff453a;
        --danger-bg:  rgba(255,69,58,.12);
        --info-bg:    rgba(10,132,255,.12);
        --sep:        rgba(255,255,255,.08);
      }
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh;
    }

    .app { max-width: 580px; margin: 0 auto; padding-bottom: 5rem; }

    /* ── Header ── */
    .app-header { padding: 2.5rem 20px 1rem; }
    .app-header h1 { font-size: 32px; font-weight: 600; letter-spacing: -.5px; }
    .app-header p  { font-size: 15px; color: var(--muted); margin-top: 3px; }

    /* ── Search ── */
    .search-wrap { padding: 0 16px 12px; position: relative; }
    .search-box {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); border-radius: var(--r);
      padding: 0 12px 0 14px; height: 46px;
      border: 0.5px solid var(--border);
    }
    .search-box input {
      flex: 1; border: none; outline: none; background: transparent;
      font-family: inherit; font-size: 16px; color: var(--text);
    }
    .search-box input::placeholder { color: var(--muted); }
    .search-box i { color: var(--muted); font-size: 17px; flex-shrink: 0; }
    .search-box button {
      height: 32px; padding: 0 14px; border-radius: 99px;
      font-family: inherit; font-size: 14px; font-weight: 500;
      border: none; background: var(--accent); color: #fff; cursor: pointer; flex-shrink: 0;
    }
    .ac-list {
      position: absolute; top: calc(100% - 8px); left: 16px; right: 16px;
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--r-sm);
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
      z-index: 200; overflow: hidden; max-height: 280px; overflow-y: auto;
    }
    .ac-list:empty { display: none; }
    .ac-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; cursor: pointer;
      border-bottom: 0.5px solid var(--sep);
      transition: background .1s;
    }
    .ac-item:last-child { border-bottom: none; }
    .ac-item:hover, .ac-item.active { background: var(--surface2); }
    .ac-icon { width: 30px; height: 30px; border-radius: var(--r-xs); background: var(--accent-bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ac-icon i { font-size: 14px; color: var(--accent); }
    .ac-name { font-size: 14px; font-weight: 500; }
    .ac-sub  { font-size: 12px; color: var(--muted); margin-top: 1px; }

    /* ── Chips ── */
    .chips { display: flex; gap: 7px; padding: 0 16px 14px; overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      font-size: 13px; font-weight: 500; padding: 6px 13px; border-radius: 99px;
      background: var(--surface); border: 0.5px solid var(--border);
      color: var(--text2); cursor: pointer; white-space: nowrap; flex-shrink: 0;
      transition: background .12s;
    }
    .chip:hover { background: var(--surface2); }

    /* ── Breadcrumb ── */
    .breadcrumb {
      display: none; align-items: center; gap: 4px; flex-wrap: wrap;
      font-size: 12px; color: var(--muted); padding: 0 20px 12px;
    }
    .breadcrumb span { cursor: pointer; font-weight: 500; color: var(--muted); }
    .breadcrumb span:hover { color: var(--accent); }
    .breadcrumb .sep { opacity: .4; }

    /* ── Section title ── */
    .sec-title {
      font-size: 12px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em; padding: 14px 20px 6px;
    }

    /* ── Group ── */
    .group { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); margin: 0 16px 10px; overflow: hidden; }

    /* ── Row ── */
    .row {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 14px; cursor: pointer;
      border-bottom: 0.5px solid var(--sep); transition: background .1s;
    }
    .row:last-child { border-bottom: none; }
    .row:active { background: var(--surface2); }
    .row-icon { width: 34px; height: 34px; border-radius: var(--r-xs); background: var(--accent-bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .row-icon i { font-size: 16px; color: var(--accent); }
    .row-body { flex: 1; min-width: 0; }
    .row-title { font-size: 15px; font-weight: 500; }
    .row-sub   { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .row-chev  { color: var(--muted); font-size: 13px; opacity: .5; }

    /* ── Mode header ── */
    .mode-header {
      font-size: 12px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em;
      padding: 14px 20px 5px; display: flex; align-items: center; gap: 6px;
    }

    /* ── Disruption badge ── */
    .dis-badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; margin-left: 5px; }
    .dis-badge.err  { background: var(--danger-bg);  color: var(--danger); }
    .dis-badge.warn { background: var(--warning-bg); color: var(--warning); }
    .dis-badge.info { background: var(--info-bg);    color: var(--accent); }

    /* ── Disruption block ── */
    .dis-wrap { margin: 0 16px 10px; border-radius: var(--r); overflow: hidden; border: 0.5px solid rgba(255,149,0,.3); }
    .dis-toggle {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; background: var(--warning-bg); border: none; cursor: pointer;
      font-family: inherit; font-size: 14px; font-weight: 500; color: var(--warning);
    }
    .dis-toggle i { font-size: 15px; transition: transform .2s; }
    .dis-toggle.open i.arrow { transform: rotate(180deg); }
    .dis-body { display: none; background: var(--surface); padding: 0 14px 12px; }
    .dis-body.open { display: block; }
    .dis-item { border-left: 2px solid var(--warning); padding: 10px 12px; margin-top: 10px; }
    .dis-item.err { border-color: var(--danger); }
    .dis-item.info { border-color: var(--accent); }
    .dis-cause { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--warning); margin-bottom: 4px; }
    .dis-item.err .dis-cause { color: var(--danger); }
    .dis-item.info .dis-cause { color: var(--accent); }
    .dis-msg { font-size: 13px; color: var(--text2); line-height: 1.5; }
    .dis-period { font-size: 11px; color: var(--muted); margin-top: 4px; }

    /* ── Direction tabs ── */
    .dir-tabs { display: flex; gap: 6px; padding: 0 16px 10px; }
    .dir-tab {
      flex: 1; height: 40px; border-radius: var(--r-sm);
      font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
      border: 0.5px solid var(--border); background: var(--surface); color: var(--muted);
      transition: all .15s;
    }
    .dir-tab.active { background: var(--text); color: var(--surface); border-color: transparent; }

    /* ── Dep header ── */
    .dep-header { display: flex; align-items: center; gap: 12px; padding: .75rem 20px; }
    .dep-header-body { flex: 1; }
    .dep-header-title { font-size: 17px; font-weight: 600; letter-spacing: -.2px; }
    .dep-header-sub { font-size: 13px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
    .fresh { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 99px; }
    .fresh.rt { background: var(--success-bg); color: var(--success); }
    .fresh.th { background: var(--warning-bg); color: var(--warning); }

    /* ── Dep rows ── */
    .dep-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 14px; border-bottom: 0.5px solid var(--sep); gap: 10px;
    }
    .dep-row:last-child { border-bottom: none; }
    .dep-left  { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .dep-dest  { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dep-mode  { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .dep-right { text-align: right; flex-shrink: 0; }
    .dep-wait  { font-size: 22px; font-weight: 600; letter-spacing: -.4px; color: var(--text); }
    .dep-wait.soon { color: var(--success); }
    .dep-wait.quai { color: var(--accent); }
    .dep-hour  { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .dep-hour.soon { color: var(--success); }
    .dep-hour.quai { color: var(--accent); }
    .dep-delay { font-size: 11px; font-weight: 600; margin-left: 4px; }
    .dep-delay.late  { color: var(--danger); }
    .dep-delay.early { color: var(--success); }
    .dep-cancelled { font-size: 11px; font-weight: 600; color: var(--danger); margin-left: 4px; }

    /* ── Refresh ── */
    .refresh-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: calc(100% - 32px); margin: 6px 16px 0;
      height: 42px; border-radius: var(--r-sm);
      border: 0.5px solid var(--border); background: var(--surface);
      font-family: inherit; font-size: 14px; font-weight: 500; color: var(--accent); cursor: pointer;
    }
    .refresh-btn:active { opacity: .7; }

    /* ── Empty / error ── */
    .empty { text-align: center; padding: 3.5rem 2rem; }
    .empty i { font-size: 44px; color: var(--muted); display: block; margin-bottom: 14px; }
    .empty-title { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
    .empty-sub { font-size: 15px; color: var(--muted); }
    .error-box { margin: 0 16px; padding: 13px 14px; border-radius: var(--r-sm); background: var(--danger-bg); color: var(--danger); font-size: 14px; font-weight: 500; }

    /* ── Spinner ── */
    .spinner { display: inline-block; width: 17px; height: 17px; border: 2px solid var(--sep); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -4px; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="app">

  <div class="app-header">
    <h1>Transports</h1>
    <p>Île-de-France · Temps réel</p>
  </div>

  <div class="search-wrap">
    <div class="search-box">
      <i class="ti ti-search" aria-hidden="true"></i>
      <input type="text" id="search-input" placeholder="Station, arrêt, gare…" autocomplete="off" />
      <button onclick="searchStops()">Chercher</button>
    </div>
    <div class="ac-list" id="ac-list"></div>
  </div>

  <div class="chips" id="chips">
    <span class="chip" onclick="fillAndSearch('Les Moulineaux')">Les Moulineaux</span>
    <span class="chip" onclick="fillAndSearch('Châtelet')">Châtelet</span>
    <span class="chip" onclick="fillAndSearch('Nation')">Nation</span>
    <span class="chip" onclick="fillAndSearch('Gare du Nord')">Gare du Nord</span>
    <span class="chip" onclick="fillAndSearch('La Défense')">La Défense</span>
    <span class="chip" onclick="fillAndSearch('Montparnasse')">Montparnasse</span>
  </div>

  <div class="breadcrumb" id="breadcrumb"></div>

  <div id="view-search">
    <div class="empty" id="search-empty">
      <i class="ti ti-train" aria-hidden="true"></i>
      <div class="empty-title">Recherche une station</div>
      <div class="empty-sub">Saisis le nom d'un arrêt pour voir les prochains passages en temps réel</div>
    </div>
    <div id="search-results"></div>
  </div>
  <div id="view-lines"      style="display:none;"><div id="lines-content"></div></div>
  <div id="view-directions" style="display:none;"><div id="directions-content"></div></div>
  <div id="view-departures" style="display:none;"><div id="departures-content"></div></div>

</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />

<script>
  let state = {
    stopAreaId:'', stopAreaName:'',
    lineId:'', lineInfo:null, lineRef:'',
    currentTerminus:'', currentStopPointIds:[],
    currentStopAreaId:'', currentStopAreaName:'', currentLineName:''
  };

  async function callProxy(endpoint, params={}) {
    const qs = new URLSearchParams({ endpoint, ...params }).toString();
    const r = await fetch('/api/prim?' + qs);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  function showView(name) {
    ['search','lines','directions','departures'].forEach(v =>
      document.getElementById('view-'+v).style.display = v===name ? 'block' : 'none'
    );
  }

  function updateBreadcrumb(items) {
    const bc = document.getElementById('breadcrumb');
    if (!items.length) { bc.style.display='none'; return; }
    bc.style.display='flex';
    bc.innerHTML = items.map((it,i) =>
      i < items.length-1
        ? `<span onclick="${it.fn}">${it.label}</span><span class="sep">›</span>`
        : `<strong style="color:var(--text2)">${it.label}</strong>`
    ).join('');
  }

  function formatTime(d) { return d ? d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : '—'; }

  function textColor(hex) {
    hex=(hex||'').replace('#',''); if(hex.length!==6) return '#fff';
    const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
    return (r*299+g*587+b*114)/1000>128?'#000':'#fff';
  }

  function lineIcon(info, size=32) {
    const code=String(info.code||info.label||'?');
    const mode=(info.commercial_mode||'').toLowerCase();
    const bg=info.color?'#'+info.color.replace('#',''):'#888';
    const fg=textColor(info.color||'888888');
    const cx=size/2,cy=size/2;
    const fs=code.length<=2?Math.round(size*.44):code.length===3?Math.round(size*.32):Math.round(size*.26);
    const r=Math.round(size*.2);
    let shape,w=size;
    if (mode.includes('métro')||mode.includes('metro')) {
      shape=`<circle cx="${cx}" cy="${cy}" r="${cx-1}" fill="${bg}"/>`;
    } else if (mode.includes('rer')||mode.includes('transilien')||mode.includes('train')) {
      shape=`<rect x="1" y="1" width="${size-2}" height="${size-2}" rx="${r}" fill="${bg}"/>`;
    } else if (mode.includes('tram')) {
      shape=`<polygon points="${cx},1 ${size-1},${cy} ${cx},${size-1} 1,${cy}" fill="${bg}"/>`;
    } else {
      const cw=fs*.65; w=Math.max(size,Math.round(cw*code.length+size*.5));
      shape=`<rect x="1" y="1" width="${w-2}" height="${size-2}" rx="${r}" fill="${bg}"/>`;
      return `<svg width="${w}" height="${size}" viewBox="0 0 ${w} ${size}" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;flex-shrink:0;"><title>Ligne ${code}</title>${shape}<text x="${w/2}" y="${cy}" dominant-baseline="central" text-anchor="middle" font-family="Inter,sans-serif" font-size="${fs}" font-weight="600" fill="${fg}">${code}</text></svg>`;
    }
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;flex-shrink:0;"><title>Ligne ${code}</title>${shape}<text x="${cx}" y="${cy}" dominant-baseline="central" text-anchor="middle" font-family="Inter,sans-serif" font-size="${fs}" font-weight="600" fill="${fg}">${code}</text></svg>`;
  }

  const modeOrder={'rer':0,'transilien':0,'train':0,'métro':1,'metro':1,'tramway':2,'tram':2,'bus':3,'noctilien':3};
  function getModeRank(l) {
    const m=(l.commercial_modes?.[0]?.name||l.physical_modes?.[0]?.name||'').toLowerCase();
    const e=Object.entries(modeOrder).find(([k])=>m.includes(k));
    return e?e[1]:4;
  }
  function getModeIcon(name) {
    const m=(name||'').toLowerCase();
    if (m.includes('rer')||m.includes('transilien')||m.includes('train')) return 'ti-train';
    if (m.includes('métro')||m.includes('metro')) return 'ti-building-community';
    if (m.includes('tram')) return 'ti-tir';
    return 'ti-bus';
  }

  function toLineRef(lineId,codes) {
    if (codes) { const s=codes.find(c=>c.type==='source'); if (s) { const m=s.value.match(/Line:(C[\w-]+)/); if (m) return `STIF:Line::${m[1]}:`; } }
    const m=lineId.match(/IDFM:(C[\w-]+)/); return m?`STIF:Line::${m[1]}:`:null;
  }
  function extractNumId(id) { const m=(id||'').match(/:(\d+)$/); return m?m[1]:null; }
  function toMonRef(spId)   { const m=(spId||'').match(/:(\d+)$/); return m?`STIF:StopPoint:Q:${m[1]}:`:null; }
  function norm(s) { return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
  function lMatch(a,b) {
    const na=norm(a),nb=norm(b);
    if (na===nb||na.includes(nb)||nb.includes(na)) return true;
    const wa=na.split(/\s+/).find(w=>w.length>=4), wb=nb.split(/\s+/).find(w=>w.length>=4);
    return wa&&wb&&wa===wb;
  }
  function n2iso(s) { if(!s)return null; return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T${s.slice(9,11)}:${s.slice(11,13)}:${s.slice(13,15)}`; }

  function fillAndSearch(name) { document.getElementById('search-input').value=name; closeAC(); searchStops(); }

  /* ── Perturbations ─────────────────────────────────────────────────────── */
  function disLevel(cause,effect) {
    const c=(cause||'').toLowerCase(),e=(effect||'').toLowerCase();
    if (e.includes('no_service')||e.includes('significant')||c.includes('accident')||c.includes('travaux')) return 'err';
    if (e.includes('reduced')||e.includes('detour')||c.includes('perturbation')||c.includes('incident')) return 'warn';
    return 'info';
  }
  function fmtPeriod(p) {
    if (!p||!p.length) return '';
    const from=p[0].begin?new Date(p[0].begin).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
    const to=p[0].end?new Date(p[0].end).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
    return from&&to?`Du ${from} au ${to}`:from?`Depuis le ${from}`:'';
  }
  async function fetchDis(lineId) {
    try { const d=await callProxy('v2/navitia/lines/'+lineId+'/disruptions',{count:20}); return d.disruptions||[]; } catch { return []; }
  }
  function disBadge(list) {
    if (!list.length) return '';
    const e=list.filter(d=>disLevel(d.cause,d.disruption_effect||d.effect)==='err').length;
    const w=list.filter(d=>disLevel(d.cause,d.disruption_effect||d.effect)==='warn').length;
    if (e) return `<span class="dis-badge err">${e} perturbation${e>1?'s':''}</span>`;
    if (w) return `<span class="dis-badge warn">${w} avertissement${w>1?'s':''}</span>`;
    return `<span class="dis-badge info">${list.length} info</span>`;
  }
  function renderDisBlock(list, el) {
    if (!list.length) return;
    const e=list.filter(d=>disLevel(d.cause,d.disruption_effect||d.effect)==='err').length;
    const w=list.filter(d=>disLevel(d.cause,d.disruption_effect||d.effect)==='warn').length;
    const icon=e?'ti-alert-octagon':w?'ti-alert-triangle':'ti-info-circle';
    const label=e?'perturbation':w?'avertissement':'information';
    const wrap=document.createElement('div'); wrap.className='dis-wrap';
    const toggle=document.createElement('button'); toggle.className='dis-toggle';
    toggle.innerHTML=`<span style="display:flex;align-items:center;gap:8px;"><i class="ti ${icon}" aria-hidden="true"></i>${list.length} ${label}${list.length>1?'s':''} en cours</span><i class="ti ti-chevron-down arrow" aria-hidden="true"></i>`;
    const body=document.createElement('div'); body.className='dis-body';
    list.forEach(d=>{
      const lv=disLevel(d.cause,d.disruption_effect||d.effect);
      const msgs=(d.messages||[]).map(m=>m.text).filter(Boolean);
      const msg=msgs.join(' ')||d.title||d.header||'';
      const period=fmtPeriod(d.application_periods||d.periods);
      const div=document.createElement('div'); div.className=`dis-item ${lv}`;
      div.innerHTML=`<div class="dis-cause">${d.cause||d.category||'Information'}</div>${msg?`<div class="dis-msg">${msg}</div>`:''}${period?`<div class="dis-period"><i class="ti ti-clock" aria-hidden="true" style="font-size:11px;vertical-align:-1px;margin-right:3px;"></i>${period}</div>`:''}`;
      body.appendChild(div);
    });
    toggle.onclick=()=>{toggle.classList.toggle('open');body.classList.toggle('open');};
    wrap.appendChild(toggle); wrap.appendChild(body); el.appendChild(wrap);
  }

  /* ── Autocomplete ──────────────────────────────────────────────────────── */
  let acTimer=null,acIdx=-1,acRes=[];
  const inp=document.getElementById('search-input'), acList=document.getElementById('ac-list');
  inp.addEventListener('input',()=>{
    clearTimeout(acTimer); const q=inp.value.trim();
    if (q.length<2){closeAC();return;} acTimer=setTimeout(()=>fetchAC(q),250);
  });
  inp.addEventListener('keydown',e=>{
    if (e.key==='Enter'){if(acIdx>=0&&acRes[acIdx]){selAC(acRes[acIdx]);return;}closeAC();searchStops();return;}
    if (e.key==='ArrowDown'){e.preventDefault();moveAC(1);return;}
    if (e.key==='ArrowUp'){e.preventDefault();moveAC(-1);return;}
    if (e.key==='Escape'){closeAC();return;}
  });
  document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))closeAC();});
  async function fetchAC(q) {
    acList.innerHTML='<div style="padding:14px;text-align:center;color:var(--muted);"><span class="spinner"></span></div>';
    try {
      const d=await callProxy('v2/navitia/places',{q,count:8});
      acRes=(d.places||[]).filter(p=>p.embedded_type==='stop_area'||p.embedded_type==='stop_point');
      renderAC();
    } catch {closeAC();}
  }
  function renderAC() {
    acIdx=-1; if (!acRes.length){acList.innerHTML='';return;}
    acList.innerHTML=acRes.map((p,i)=>{
      const s=p.stop_area||p.stop_point;
      const modes=(s.physical_modes||[]).map(m=>m.name).join(' · ');
      return `<div class="ac-item" data-i="${i}"><div class="ac-icon"><i class="ti ti-map-pin" aria-hidden="true"></i></div><div><div class="ac-name">${s.name}</div>${modes?`<div class="ac-sub">${modes}</div>`:''}</div></div>`;
    }).join('');
    acList.querySelectorAll('.ac-item').forEach(el=>{
      const i=+el.dataset.i;
      el.addEventListener('mousedown',e=>{e.preventDefault();selAC(acRes[i]);});
    });
  }
  function moveAC(dir) {
    const items=acList.querySelectorAll('.ac-item'); if(!items.length)return;
    items[acIdx]?.classList.remove('active');
    acIdx=Math.max(0,Math.min(acRes.length-1,acIdx+dir));
    items[acIdx]?.classList.add('active'); items[acIdx]?.scrollIntoView({block:'nearest'});
  }
  function selAC(p) { const s=p.stop_area||p.stop_point; inp.value=s.name; closeAC(); loadLines(s.id,s.name); }
  function closeAC() { acList.innerHTML=''; acIdx=-1; acRes=[]; }

  /* ── Vue 1 : Recherche ─────────────────────────────────────────────────── */
  async function searchStops() {
    const q=inp.value.trim(); if(!q)return;
    const btn=document.querySelector('.search-box button');
    btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';
    showView('search'); updateBreadcrumb([]);
    const empty=document.getElementById('search-empty'), results=document.getElementById('search-results');
    empty.innerHTML='<i class="ti ti-search" aria-hidden="true"></i><div class="empty-title">Recherche…</div>'; empty.style.display='block'; results.innerHTML='';
    try {
      const d=await callProxy('v2/navitia/places',{q,count:10});
      const places=(d.places||[]).filter(p=>p.embedded_type==='stop_area'||p.embedded_type==='stop_point');
      empty.style.display='none';
      if (!places.length){empty.innerHTML=`<i class="ti ti-mood-sad" aria-hidden="true"></i><div class="empty-title">Aucun résultat</div><div class="empty-sub">Aucun arrêt trouvé pour « ${q} »</div>`;empty.style.display='block';btn.disabled=false;btn.textContent='Chercher';return;}
      const sec=document.createElement('div'); sec.className='sec-title'; sec.textContent='Arrêts correspondants'; results.appendChild(sec);
      const g=document.createElement('div'); g.className='group';
      places.forEach(p=>{
        const s=p.stop_area||p.stop_point; if(!s)return;
        const modes=(s.physical_modes||[]).map(m=>m.name).join(' · ');
        const row=document.createElement('div'); row.className='row';
        row.innerHTML=`<div class="row-icon"><i class="ti ti-map-pin" aria-hidden="true"></i></div><div class="row-body"><div class="row-title">${s.name}</div>${modes?`<div class="row-sub">${modes}</div>`:''}</div><i class="ti ti-chevron-right row-chev" aria-hidden="true"></i>`;
        row.onclick=()=>loadLines(s.id,s.name); g.appendChild(row);
      });
      results.appendChild(g);
    } catch(e){empty.innerHTML=`<div class="error-box">Erreur : ${e.message}</div>`;empty.style.display='block';}
    btn.disabled=false; btn.textContent='Chercher';
  }

  /* ── Vue 2 : Lignes ────────────────────────────────────────────────────── */
  async function loadLines(stopAreaId, stopAreaName) {
    state.stopAreaId=stopAreaId; state.stopAreaName=stopAreaName;
    showView('lines');
    updateBreadcrumb([{label:inp.value,fn:'backToSearch()'},{label:stopAreaName}]);
    const el=document.getElementById('lines-content');
    el.innerHTML='<div class="empty"><span class="spinner"></span> Chargement…</div>';
    try {
      const [ld,dd]=await Promise.all([
        callProxy('v2/navitia/stop_areas/'+stopAreaId+'/lines',{count:40}),
        callProxy('v2/navitia/stop_areas/'+stopAreaId+'/disruptions',{count:30}).catch(()=>({disruptions:[]}))
      ]);
      const lines=ld.lines||[], disByLine={};
      (dd.disruptions||[]).forEach(d=>{
        (d.impacted_objects||[]).forEach(obj=>{
          const lid=obj.pt_object?.line?.id||obj.id;
          if (lid){if(!disByLine[lid])disByLine[lid]=[];disByLine[lid].push(d);}
        });
      });
      el.innerHTML='';
      if (!lines.length){el.innerHTML='<div class="empty"><i class="ti ti-mood-sad" aria-hidden="true"></i><div class="empty-title">Aucune ligne</div></div>';return;}
      lines.sort((a,b)=>{const ra=getModeRank(a),rb=getModeRank(b);if(ra!==rb)return ra-rb;return(a.code||'').localeCompare(b.code||'',undefined,{numeric:true});});
      const byMode=new Map();
      lines.forEach(l=>{const m=l.commercial_modes?.[0]?.name||l.physical_modes?.[0]?.name||'Autre';if(!byMode.has(m))byMode.set(m,[]);byMode.get(m).push(l);});
      byMode.forEach((ls,modeName)=>{
        const mh=document.createElement('div'); mh.className='mode-header';
        mh.innerHTML=`<i class="ti ${getModeIcon(modeName)}" aria-hidden="true"></i>${modeName}`;
        el.appendChild(mh);
        const g=document.createElement('div'); g.className='group';
        ls.forEach(l=>{
          const info={code:l.code||l.name,color:l.color,commercial_mode:l.commercial_modes?.[0]?.name||'',codes:l.codes||[]};
          const termini=[...new Set((l.routes||[]).map(r=>r.direction?.stop_area?.name||'').filter(Boolean))].slice(0,2).join(' · ');
          const badge=disBadge(disByLine[l.id]||[]);
          const row=document.createElement('div'); row.className='row';
          row.innerHTML=`${lineIcon(info,34)}<div class="row-body"><div class="row-title" style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;">${l.name||l.code}${badge}</div>${termini?`<div class="row-sub">${termini}</div>`:''}</div><i class="ti ti-chevron-right row-chev" aria-hidden="true"></i>`;
          row.onclick=()=>loadDirections(stopAreaId,stopAreaName,l.id,info,l.name||l.code);
          g.appendChild(row);
        });
        el.appendChild(g);
      });
    } catch(e){el.innerHTML=`<div class="error-box">Erreur : ${e.message}</div>`;}
  }

  /* ── Vue 3 : Directions ────────────────────────────────────────────────── */
  let _dc=null;
  async function loadDirections(stopAreaId,stopAreaName,lineId,lineInfo,lineName,activeFilter) {
    state.lineId=lineId; state.lineInfo=lineInfo; state.lineRef=toLineRef(lineId,lineInfo.codes);
    showView('directions');
    updateBreadcrumb([
      {label:inp.value,fn:'backToSearch()'},
      {label:stopAreaName,fn:`loadLines('${stopAreaId}','${stopAreaName.replace(/'/g,"\\'")}')` },
      {label:lineName}
    ]);
    const el=document.getElementById('directions-content');
    const ck=stopAreaId+'|'+lineId;
    if (!_dc||_dc.key!==ck) {
      el.innerHTML='<div class="empty"><span class="spinner"></span> Chargement…</div>';
      try {
        const [rd,spd,disruptions]=await Promise.all([
          callProxy('v2/navitia/lines/'+lineId+'/routes',{count:10}),
          callProxy('v2/navitia/stop_areas/'+stopAreaId+'/lines/'+lineId+'/stop_points',{count:30}).catch(()=>({stop_points:[]})),
          fetchDis(lineId)
        ]);
        let sp=spd.stop_points||[];
        if (!sp.length){const fb=await callProxy('v2/navitia/stop_areas/'+stopAreaId+'/stop_points',{count:30}).catch(()=>({stop_points:[]}));sp=fb.stop_points||[];}
        _dc={key:ck,routes:rd.routes||[],stopPoints:sp,disruptions};
      } catch(e){el.innerHTML=`<div class="error-box">Erreur : ${e.message}</div>`;return;}
    }
    const {routes,stopPoints,disruptions}=_dc;
    const allSp=stopPoints.map(s=>s.id);
    if (!routes.length){el.innerHTML='<div class="empty"><i class="ti ti-mood-sad" aria-hidden="true"></i><div class="empty-title">Aucune direction</div></div>';return;}
    const ob=routes.filter(r=>r.direction_type==='outbound'),ib=routes.filter(r=>r.direction_type==='inbound');
    const hasF=ob.length>0&&ib.length>0;
    const filter=activeFilter||(hasF?'outbound':null);
    el.innerHTML='';
    if (disruptions.length) renderDisBlock(disruptions,el);
    const sec=document.createElement('div'); sec.className='sec-title';
    sec.innerHTML=`${lineIcon(lineInfo,18)}&nbsp; ${lineName} — Direction`;
    el.appendChild(sec);
    if (hasF) {
      const tabs=document.createElement('div'); tabs.className='dir-tabs';
      [{dir:'outbound',lbl:'→ Aller'},{dir:'inbound',lbl:'← Retour'}].forEach(({dir,lbl})=>{
        const active=filter===dir;
        const btn=document.createElement('button');
        btn.className='dir-tab'+(active?' active':'');
        btn.textContent=lbl;
        btn.onclick=()=>loadDirections(stopAreaId,stopAreaName,lineId,lineInfo,lineName,dir);
        tabs.appendChild(btn);
      });
      el.appendChild(tabs);
    }
    const visible=hasF?routes.filter(r=>r.direction_type===filter):routes;
    if (!visible.length){el.innerHTML+='<div class="empty"><div class="empty-title">Aucune destination</div></div>';return;}
    const g=document.createElement('div'); g.className='group';
    visible.forEach(route=>{
      const terminus=route.direction?.stop_area?.name||route.name||'?';
      const rSp=stopPoints.filter(s=>!s.routes?.length||s.routes.some(r=>r.id===route.id)).map(s=>s.id);
      const spIds=rSp.length?rSp:allSp;
      const arrow=filter==='inbound'?'←':'→';
      const row=document.createElement('div'); row.className='row';
      row.innerHTML=`${lineIcon(lineInfo,36)}<div class="row-body"><div class="row-title">${arrow} ${terminus}</div></div><i class="ti ti-chevron-right row-chev" aria-hidden="true"></i>`;
      row.onclick=()=>loadDepartures(terminus,spIds,stopAreaId,stopAreaName,lineName);
      g.appendChild(row);
    });
    el.appendChild(g);
  }

  /* ── Vue 4 : Horaires ──────────────────────────────────────────────────── */
  async function loadDepartures(terminus,spIds,stopAreaId,stopAreaName,lineName) {
    showView('departures');
    updateBreadcrumb([
      {label:inp.value,fn:'backToSearch()'},
      {label:stopAreaName,fn:`loadLines('${stopAreaId}','${stopAreaName.replace(/'/g,"\\'")}')` },
      {label:lineName,fn:`loadDirections('${stopAreaId}','${stopAreaName.replace(/'/g,"\\'")}','${state.lineId}',${JSON.stringify(state.lineInfo)},'${lineName.replace(/'/g,"\\'")}')` },
      {label:'→ '+terminus}
    ]);
    Object.assign(state,{currentTerminus:terminus,currentStopPointIds:spIds,currentStopAreaId:stopAreaId,currentStopAreaName:stopAreaName,currentLineName:lineName});
    await refreshDepartures();
  }

  function getStrategy(li) {
    const m=(li.commercial_mode||'').toLowerCase();
    return (m.includes('métro')||m.includes('metro')||m.includes('rer')||m.includes('transilien')||m.includes('train'))?'stop-monitoring':'estimated-timetable';
  }

  async function refreshDepartures() {
    const el=document.getElementById('departures-content'); el.innerHTML='<div class="empty"><span class="spinner"></span> Chargement des horaires…</div>';
    const {currentTerminus:terminus,currentStopPointIds:spIds,lineInfo,lineRef}=state;
    try {
      let deps=[],isRT=false;
      if (getStrategy(lineInfo)==='stop-monitoring') {
        for (const spId of spIds){const mr=toMonRef(spId);if(!mr)continue;try{const d=await callProxy('stop-monitoring',{MonitoringRef:mr,MaximumStopVisits:20});const p=parseSM(d,terminus);if(p.length){deps=p;isRT=true;break;}}catch{}}
      } else if (lineRef) {
        try{const d=await callProxy('estimated-timetable',{LineRef:lineRef});deps=parseET(d,spIds,terminus);isRT=true;}catch{}
      }
      if (!deps.length&&spIds.length){try{const d=await callProxy('v2/navitia/stop_points/'+spIds[0]+'/departures',{count:20});deps=parseNAV(d.departures||[],terminus);}catch{}}
      renderDeps(el,deps,terminus,isRT,_dc?.disruptions||[]);
    } catch(e){el.innerHTML=`<div class="error-box">Erreur : ${e.message}</div>`;renderRefreshBtn(el);}
  }

  function parseET(data,spIds,terminus) {
    const frame=data?.Siri?.ServiceDelivery?.EstimatedTimetableDelivery?.[0]?.EstimatedJourneyVersionFrame?.[0];
    const journeys=frame?.EstimatedVehicleJourney||[];
    const now=Date.now(); const nums=new Set(spIds.map(extractNumId).filter(Boolean)); const res=[];
    journeys.forEach(vj=>{
      (vj.EstimatedCalls?.EstimatedCall||[]).forEach(c=>{
        const sr=c.StopPointRef?.value||''; const rn=sr.match(/:Q:(\d+):/)?.[1]||sr.match(/:(\d+):?$/)?.[1];
        if(!rn||!nums.has(rn))return;
        const dest=c.DestinationDisplay?.[0]?.value||vj.DestinationName?.[0]?.value||'';
        if(terminus&&dest&&!lMatch(terminus,dest))return;
        const et=c.ExpectedDepartureTime||c.ExpectedArrivalTime||c.AimedDepartureTime||c.AimedArrivalTime;
        const at=c.AimedDepartureTime||c.AimedArrivalTime;
        if(!et||new Date(et).getTime()<now-60000)return;
        res.push({et,at,dest:dest||terminus,atStop:c.VehicleAtStop===true,cancelled:c.DepartureStatus==='cancelled',rt:true});
      });
    });
    res.sort((a,b)=>new Date(a.et)-new Date(b.et)); return res;
  }

  function parseSM(data,terminus) {
    const visits=data?.Siri?.ServiceDelivery?.StopMonitoringDelivery?.[0]?.MonitoredStopVisit||[];
    const now=Date.now(); const res=[];
    visits.forEach(v=>{
      const vj=v.MonitoredVehicleJourney||{},c=vj.MonitoredCall||{};
      const dest=c.DestinationDisplay?.[0]?.value||vj.DestinationName?.[0]?.value||vj.DirectionName?.[0]?.value||'';
      if(terminus&&dest&&!lMatch(terminus,dest))return;
      const et=c.ExpectedDepartureTime||c.AimedDepartureTime||c.ExpectedArrivalTime||c.AimedArrivalTime;
      const at=c.AimedDepartureTime||c.AimedArrivalTime;
      if(!et||new Date(et).getTime()<now-60000)return;
      res.push({et,at,dest:dest||terminus,atStop:c.VehicleAtStop===true,cancelled:c.DepartureStatus==='cancelled',rt:true});
    });
    res.sort((a,b)=>new Date(a.et)-new Date(b.et)); return res;
  }

  function parseNAV(deps,terminus) {
    return deps.map(dep=>{
      const sdt=dep.stop_date_time||{},info=dep.display_informations||{};
      const et=n2iso(sdt.departure_date_time||sdt.arrival_date_time);
      return {et,at:null,dest:info.direction||info.headsign||terminus,atStop:false,cancelled:false,rt:false};
    }).filter(d=>d.et);
  }

  function renderDeps(el,deps,terminus,isRT,disruptions) {
    el.innerHTML='';
    if (disruptions.length) renderDisBlock(disruptions,el);

    const header=document.createElement('div'); header.className='dep-header';
    header.innerHTML=`${lineIcon(state.lineInfo,36)}<div class="dep-header-body"><div class="dep-header-title">→ ${terminus}</div><div class="dep-header-sub">${state.lineInfo.commercial_mode||''}<span class="fresh ${isRT?'rt':'th'}"><i class="ti ${isRT?'ti-bolt':'ti-calendar'}" aria-hidden="true" style="font-size:10px;margin-right:2px;vertical-align:-1px;"></i>${isRT?'Temps réel':'Théorique'}</span></div></div>`;
    el.appendChild(header);

    if (!deps.length){el.innerHTML+='<div class="empty"><i class="ti ti-clock-off" aria-hidden="true"></i><div class="empty-title">Aucun passage imminent</div><div class="empty-sub">Service peut-être terminé ou données indisponibles</div></div>';renderRefreshBtn(el);return;}

    const g=document.createElement('div'); g.className='group';
    deps.forEach(dep=>{
      const expected=new Date(dep.et);
      const aimed=dep.at?new Date(dep.at):null;
      const timeStr=formatTime(expected);
      const waitMin=Math.round((expected-Date.now())/60000);
      let waitLabel,cls='';
      if (dep.atStop||waitMin<=0){waitLabel='À quai';cls='quai';}
      else if (waitMin<=1){waitLabel='1 min';cls='soon';}
      else{waitLabel=waitMin+' min';cls=waitMin<=4?'soon':'';}

      let delay='';
      if (aimed&&dep.rt){const d=Math.round((expected-aimed)/60000);if(d>0)delay=`<span class="dep-delay late">+${d}min</span>`;else if(d<0)delay=`<span class="dep-delay early">${d}min</span>`;}
      const cancel=dep.cancelled?`<span class="dep-cancelled">Supprimé</span>`:'';

      const row=document.createElement('div'); row.className='dep-row';
      row.innerHTML=`
        <div class="dep-left">
          ${lineIcon(state.lineInfo,32)}
          <div><div class="dep-dest">${dep.dest}</div><div class="dep-mode">${state.lineInfo.commercial_mode||''}</div></div>
        </div>
        <div class="dep-right">
          <div class="dep-wait ${cls}">${waitLabel}${delay}${cancel}</div>
          <div class="dep-hour ${cls}">${timeStr}</div>
        </div>`;
      g.appendChild(row);
    });
    el.appendChild(g);
    renderRefreshBtn(el);
  }

  function renderRefreshBtn(el) {
    const btn=document.createElement('button'); btn.className='refresh-btn';
    btn.innerHTML=`<i class="ti ti-refresh" aria-hidden="true" style="font-size:15px;"></i> Actualiser`;
    btn.onclick=refreshDepartures; el.appendChild(btn);
  }

  function backToSearch(){showView('search');updateBreadcrumb([]);}
</script>
