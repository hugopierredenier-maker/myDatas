<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Transports IDF — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #dee2e3;
      --panel: #bfbfbf;
      --panel-hover: #1c1f25;
      --border: rgba(255,255,255,0.07);
      --border-active: rgba(255,255,255,0.15);
      --text: #e8e6e1;
      --muted: #5a5c63;
      --muted2: #3a3c42;
      --accent: #4f8ef7;
      --accent-dim: rgba(79,142,247,0.12);
      --success: #34d399;
      --warn: #fbbf24;
      --danger: #f87171;
      --radius: 12px;
      --mono: 'DM Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px; border-bottom: 1px solid var(--border);
      background: rgba(14,15,17,0.9); backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-logo { font-size: 18px; font-weight: 700; letter-spacing: -0.03em; }
    .header-logo span { color: var(--accent); }
    .header-sub { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 1px; }
    .header-time { font-family: var(--mono); font-size: 13px; color: var(--muted); }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 12px;
      padding: 16px;
      min-height: calc(100vh - 57px);
    }

    /* ── Panel ── */
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: border-color 0.2s;
      min-height: 280px;
    }
    .panel.configured { border-color: var(--border-active); }

    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-number {
      font-family: var(--mono); font-size: 10px; color: var(--muted2);
      font-weight: 500; letter-spacing: 0.05em;
    }
    .panel-badge {
      display: flex; align-items: center; gap: 6px;
    }
    .panel-clear-btn {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 14px; padding: 2px 4px;
      border-radius: 4px; line-height: 1;
      transition: color 0.15s, background 0.15s;
    }
    .panel-clear-btn:hover { color: var(--danger); background: rgba(248,113,113,0.1); }

    .panel-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Setup screen ── */
    .setup {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 16px; gap: 10px;
    }
    .setup-icon { font-size: 28px; opacity: 0.3; }
    .setup-label { font-size: 12px; color: var(--muted); text-align: center; }
    .setup-search {
      width: 100%; position: relative;
    }
    .setup-search input {
      width: 100%; height: 34px; padding: 0 10px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text);
      font-family: var(--sans); font-size: 12px; outline: none;
      transition: border-color 0.15s;
    }
    .setup-search input:focus { border-color: var(--accent); }
    .ac-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: #1e2028; border: 1px solid var(--border-active);
      border-radius: 8px; z-index: 200; overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      max-height: 180px; overflow-y: auto;
    }
    .ac-item {
      padding: 8px 10px; cursor: pointer; font-size: 12px;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .ac-item:last-child { border-bottom: none; }
    .ac-item:hover, .ac-item.active { background: var(--accent-dim); }
    .ac-item-name { font-weight: 500; }
    .ac-item-sub { font-size: 10px; color: var(--muted); margin-top: 2px; }

    /* ── Line picker ── */
    .line-picker { flex: 1; overflow-y: auto; padding: 8px; }
    .line-btn {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 7px 8px; margin-bottom: 4px;
      background: none; border: 1px solid var(--border);
      border-radius: 7px; cursor: pointer; color: var(--text);
      font-family: var(--sans); font-size: 12px;
      transition: background 0.1s, border-color 0.1s;
      text-align: left;
    }
    .line-btn:hover { background: var(--panel-hover); border-color: var(--border-active); }
    .line-btn-dest { color: var(--muted); font-size: 11px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Direction picker ── */
    .dir-picker { flex: 1; overflow-y: auto; padding: 8px; }
    .dir-btn {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 8px 10px; margin-bottom: 4px;
      background: none; border: 1px solid var(--border);
      border-radius: 7px; cursor: pointer; color: var(--text);
      font-family: var(--sans); font-size: 12px;
      transition: background 0.1s, border-color 0.1s; text-align: left;
    }
    .dir-btn:hover { background: var(--panel-hover); border-color: var(--border-active); }
    .dir-arrow { color: var(--muted); }

    /* ── Departures view ── */
    .departures-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .dep-list { flex: 1; overflow-y: auto; }

    .dep-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 14px; border-bottom: 1px solid var(--border);
      gap: 8px;
    }
    .dep-row:last-child { border-bottom: none; }

    .dep-dest { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .dep-times { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }

    .dep-chip {
      font-family: var(--mono); font-size: 13px; font-weight: 500;
      padding: 3px 8px; border-radius: 6px;
      background: var(--muted2); color: var(--text);
      white-space: nowrap;
    }
    .dep-chip.quai { background: var(--accent-dim); color: var(--accent); }
    .dep-chip.soon { background: rgba(52,211,153,0.12); color: var(--success); }
    .dep-chip.cancelled { background: rgba(248,113,113,0.12); color: var(--danger); text-decoration: line-through; }

    .dep-delay { font-size: 9px; font-family: var(--mono); }
    .dep-delay.late { color: var(--danger); }
    .dep-delay.early { color: var(--success); }

    /* ── Refresh footer ── */
    .panel-footer {
      padding: 6px 14px; border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .footer-rt { display: flex; align-items: center; gap: 4px; }
    .rt-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; flex-shrink: 0; }
    .rt-label { font-size: 10px; color: var(--muted); font-family: var(--mono); }
    .footer-progress { flex: 1; height: 2px; background: var(--muted2); border-radius: 99px; overflow: hidden; }
    .footer-progress-bar { height: 100%; background: var(--accent); border-radius: 99px; transition: width 1s linear; }
    .footer-countdown { font-family: var(--mono); font-size: 10px; color: var(--muted); min-width: 22px; text-align: right; }
    .footer-now { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 11px; padding: 2px 4px; border-radius: 4px; transition: color 0.15s; font-family: var(--sans); }
    .footer-now:hover { color: var(--accent); }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* ── Loading / empty states ── */
    .panel-loading, .panel-empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 8px; color: var(--muted); font-size: 12px; padding: 16px;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--muted2); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Step back btn ── */
    .step-back {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 12px; border-bottom: 1px solid var(--border);
      font-size: 11px; color: var(--muted); cursor: pointer;
      transition: color 0.1s, background 0.1s;
      flex-shrink: 0;
    }
    .step-back:hover { color: var(--text); background: var(--panel-hover); }

    /* ── Live clock ── */
    #clock { font-family: var(--mono); font-size: 12px; }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); }
    }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; grid-template-rows: none; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div>
      <div class="header-logo">🚇 IDF<span>live</span></div>
      <div class="header-sub">MONITEUR TEMPS RÉEL — IDFM / PRIM</div>
    </div>
  </div>
  <div id="clock" class="header-time">--:--:--</div>
</div>

<div class="grid" id="grid"></div>

<script>
// ── Clock ─────────────────────────────────────────────────────────────────────
function tickClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
tickClock(); setInterval(tickClock, 1000);

// ── Constants ─────────────────────────────────────────────────────────────────
const PANEL_COUNT   = 6;
const REFRESH_SEC   = 30;
const PROXY         = '/api/prim';

// ── API ───────────────────────────────────────────────────────────────────────
async function api(endpoint, params = {}) {
  const qs = new URLSearchParams({ endpoint, ...params }).toString();
  const r = await fetch(PROXY + '?' + qs);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function textColor(hex) {
  hex = (hex||'').replace('#','');
  if (hex.length !== 6) return '#fff';
  const r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  return (r*299+g*587+b*114)/1000 > 128 ? '#000' : '#fff';
}

function lineIcon(info, size=22) {
  const code = String(info.code||info.label||'?');
  const mode = (info.commercial_mode||'').toLowerCase();
  const bg   = info.color ? '#'+info.color.replace('#','') : '#555';
  const fg   = textColor(bg);
  const cx=size/2, cy=size/2;
  const fs = code.length<=2 ? Math.round(size*.46) : code.length===3 ? Math.round(size*.34) : Math.round(size*.27);
  let shape, w=size;
  if (mode.includes('métro')||mode.includes('metro')) {
    shape = `<circle cx="${cx}" cy="${cy}" r="${cx-.5}" fill="${bg}"/>`;
  } else if (mode.includes('rer')||mode.includes('transilien')||mode.includes('train')) {
    const rx=Math.round(size*.22);
    shape = `<rect x=".5" y=".5" width="${size-1}" height="${size-1}" rx="${rx}" fill="${bg}"/>`;
  } else if (mode.includes('tram')) {
    shape = `<polygon points="${cx},.5 ${size-.5},${cy} ${cx},${size-.5} .5,${cy}" fill="${bg}"/>`;
  } else {
    const charW=fs*.65; w=Math.max(size, Math.round(charW*code.length+size*.5));
    const rx=Math.round(size*.22);
    shape = `<rect x=".5" y=".5" width="${w-1}" height="${size-1}" rx="${rx}" fill="${bg}"/>`;
    return `<svg width="${w}" height="${size}" viewBox="0 0 ${w} ${size}" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;flex-shrink:0;"><title>Ligne ${code}</title>${shape}<text x="${w/2}" y="${cy}" dominant-baseline="central" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="${fs}" font-weight="700" fill="${fg}">${code}</text></svg>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;flex-shrink:0;"><title>Ligne ${code}</title>${shape}<text x="${cx}" y="${cy}" dominant-baseline="central" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="${fs}" font-weight="700" fill="${fg}">${code}</text></svg>`;
}

function formatTime(d) { return d ? d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : '--:--'; }

function toLineRef(lineId, codes) {
  if (codes && Array.isArray(codes)) {
    const src = codes.find(c => c.type==='source');
    if (src) { const m=src.value.match(/Line:(C[\w-]+)/); if (m) return `STIF:Line::${m[1]}:`; }
  }
  const m = lineId.match(/IDFM:(C[\w-]+)/);
  return m ? `STIF:Line::${m[1]}:` : null;
}

function extractNumId(id) { const m=(id||'').match(/:(\d+)$/); return m?m[1]:null; }
function toMonRef(spId)   { const m=(spId||'').match(/:(\d+)$/); return m?`STIF:StopPoint:Q:${m[1]}:`:null; }

function normalize(s) { return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function looseMatch(a,b) {
  const na=normalize(a), nb=normalize(b);
  if (!na||!nb) return true;
  if (na===nb||na.includes(nb)||nb.includes(na)) return true;
  const wa=na.split(/\s+/).find(w=>w.length>=4), wb=nb.split(/\s+/).find(w=>w.length>=4);
  return !!(wa&&wb&&wa===wb);
}

function navitiaToISO(s) {
  if (!s) return null;
  return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T${s.slice(9,11)}:${s.slice(11,13)}:${s.slice(13,15)}`;
}

function getSiriStrategy(mode) {
  const m=(mode||'').toLowerCase();
  if (m.includes('métro')||m.includes('metro')||m.includes('rer')||m.includes('transilien')||m.includes('train')) return 'stop-monitoring';
  return 'requete-ligne';
}

// ── SIRI parsers ──────────────────────────────────────────────────────────────
function parseSiri(data, spIds, terminus) {
  const delivery = data?.Siri?.ServiceDelivery ?? data?.ServiceDelivery;
  const frame = delivery?.EstimatedTimetableDelivery?.[0]?.EstimatedJourneyVersionFrame?.[0];
  const journeys = frame?.EstimatedVehicleJourney || [];
  const now = Date.now();
  const numIds = new Set(spIds.map(extractNumId).filter(Boolean));
  const result = [];
  journeys.forEach(vj => {
    (vj.EstimatedCalls?.EstimatedCall||[]).forEach(call => {
      const spRef = call.StopPointRef?.value||'';
      const refNum = spRef.match(/:Q:(\d+):/)?.[1] || spRef.match(/:(\d+):?$/)?.[1];
      if (!refNum||!numIds.has(refNum)) return;
      const dest = call.DestinationDisplay?.[0]?.value || vj.DestinationName?.[0]?.value || '';
      if (terminus&&dest&&!looseMatch(terminus,dest)) return;
      const expectedTime = call.ExpectedDepartureTime||call.ExpectedArrivalTime||call.AimedDepartureTime||call.AimedArrivalTime;
      const aimedTime = call.AimedDepartureTime||call.AimedArrivalTime;
      if (!expectedTime) return;
      if (new Date(expectedTime).getTime() < now-60000) return;
      result.push({ expectedTime, aimedTime, destination:dest||terminus, vehicleAtStop:call.VehicleAtStop===true, cancelled:call.DepartureStatus==='cancelled', realtime:true });
    });
  });
  return result.sort((a,b)=>new Date(a.expectedTime)-new Date(b.expectedTime));
}

function parseStopMon(data, terminus) {
  const visits = data?.Siri?.ServiceDelivery?.StopMonitoringDelivery?.[0]?.MonitoredStopVisit||[];
  const now = Date.now();
  const result = [];
  visits.forEach(v => {
    const vj=v.MonitoredVehicleJourney||{}, call=vj.MonitoredCall||{};
    const dest = call.DestinationDisplay?.[0]?.value||vj.DestinationName?.[0]?.value||vj.DirectionName?.[0]?.value||'';
    if (terminus&&dest&&!looseMatch(terminus,dest)) return;
    const expectedTime = call.ExpectedDepartureTime||call.AimedDepartureTime||call.ExpectedArrivalTime||call.AimedArrivalTime;
    const aimedTime = call.AimedDepartureTime||call.AimedArrivalTime;
    if (!expectedTime) return;
    if (new Date(expectedTime).getTime() < now-60000) return;
    result.push({ expectedTime, aimedTime, destination:dest||terminus, vehicleAtStop:call.VehicleAtStop===true, cancelled:call.DepartureStatus==='cancelled', realtime:true });
  });
  return result.sort((a,b)=>new Date(a.expectedTime)-new Date(b.expectedTime));
}

function parseNavitia(deps, terminus) {
  return deps.map(dep => {
    const sdt=dep.stop_date_time||{}, info=dep.display_informations||{};
    const dest=info.direction||info.headsign||terminus;
    const expectedTime=navitiaToISO(sdt.departure_date_time||sdt.arrival_date_time);
    return {expectedTime,aimedTime:null,destination:dest,vehicleAtStop:false,cancelled:false,realtime:false};
  }).filter(d=>d.expectedTime&&new Date(d.expectedTime).getTime()>=Date.now()-60000);
}

// ── Panel class ───────────────────────────────────────────────────────────────
class Panel {
  constructor(id) {
    this.id        = id;
    this.step      = 'search'; // search | lines | directions | departures
    this.stopAreaId   = null;
    this.stopAreaName = null;
    this.lineId    = null;
    this.lineInfo  = null;
    this.lineRef   = null;
    this.spIds     = [];
    this.terminus  = null;
    this.departures = [];
    this.isRT      = false;
    this.countdown = REFRESH_SEC;
    this.timer     = null;
    this.acTimer   = null;
    this.acResults = [];
    this.acIndex   = -1;
    this.el        = null;
  }

  mount(el) {
    this.el = el;
    this.render();
  }

  render() {
    if (!this.el) return;
    const el = this.el;
    el.className = 'panel' + (this.step === 'departures' ? ' configured' : '');

    const num = `<div class="panel-number">PANNEAU ${String(this.id+1).padStart(2,'0')}</div>`;
    const clearBtn = this.step !== 'search'
      ? `<button class="panel-clear-btn" title="Réinitialiser" data-action="clear">✕</button>`
      : '';
    const badge = this.lineInfo
      ? `<div style="display:flex;align-items:center;gap:6px;">${lineIcon(this.lineInfo,18)}</div>`
      : '';

    el.innerHTML = `
      <div class="panel-header">
        ${num}
        <div class="panel-badge">${badge}${clearBtn}</div>
      </div>
      <div class="panel-body" id="panel-body-${this.id}"></div>
    `;

    el.querySelector('[data-action="clear"]')?.addEventListener('click', () => this.reset());

    this.renderBody();
  }

  renderBody() {
    const body = document.getElementById(`panel-body-${this.id}`);
    if (!body) return;
    body.innerHTML = '';

    if (this.step === 'search')      this.renderSearch(body);
    else if (this.step === 'lines')  this.renderLines(body);
    else if (this.step === 'directions') this.renderDirections(body);
    else if (this.step === 'departures') this.renderDepartures(body);
  }

  // ── Step 1: Search ──────────────────────────────────────────────────────────
  renderSearch(body) {
    body.innerHTML = `
      <div class="setup">
        <div class="setup-icon">📍</div>
        <div class="setup-label">Chercher un arrêt</div>
        <div class="setup-search">
          <input type="text" placeholder="Ex: Les Moulineaux…" autocomplete="off" id="search-${this.id}"/>
          <div class="ac-dropdown" id="ac-${this.id}" style="display:none;"></div>
        </div>
      </div>
    `;
    const input = document.getElementById(`search-${this.id}`);
    const ac    = document.getElementById(`ac-${this.id}`);

    input.addEventListener('input', () => {
      clearTimeout(this.acTimer);
      const q = input.value.trim();
      if (q.length < 2) { ac.style.display='none'; return; }
      ac.style.display='block';
      ac.innerHTML='<div class="ac-item"><div class="spinner" style="margin:0 auto;"></div></div>';
      this.acTimer = setTimeout(async () => {
        try {
          const data = await api('v2/navitia/places', { q, count: 8 });
          this.acResults = (data.places||[]).filter(p=>p.embedded_type==='stop_area'||p.embedded_type==='stop_point');
          this.acIndex = -1;
          if (!this.acResults.length) { ac.style.display='none'; return; }
          ac.innerHTML = this.acResults.map((p,i) => {
            const s = p.stop_area||p.stop_point;
            const modes = (s.physical_modes||[]).map(m=>m.name).join(', ');
            return `<div class="ac-item" data-i="${i}">
              <div class="ac-item-name">${s.name}</div>
              ${modes?`<div class="ac-item-sub">${modes}</div>`:''}
            </div>`;
          }).join('');
          ac.querySelectorAll('.ac-item').forEach(item => {
            const i = +item.dataset.i;
            item.addEventListener('mousedown', e => { e.preventDefault(); this.selectStop(this.acResults[i]); });
          });
        } catch { ac.style.display='none'; }
      }, 280);
    });

    input.addEventListener('keydown', e => {
      const items = ac.querySelectorAll('.ac-item');
      if (e.key==='ArrowDown') { e.preventDefault(); this.acIndex=Math.min(this.acIndex+1,items.length-1); items.forEach((el,i)=>el.classList.toggle('active',i===this.acIndex)); }
      if (e.key==='ArrowUp')   { e.preventDefault(); this.acIndex=Math.max(this.acIndex-1,0); items.forEach((el,i)=>el.classList.toggle('active',i===this.acIndex)); }
      if (e.key==='Enter' && this.acIndex>=0 && this.acResults[this.acIndex]) { this.selectStop(this.acResults[this.acIndex]); }
      if (e.key==='Escape') { ac.style.display='none'; }
    });

    document.addEventListener('click', e => { if (!e.target.closest(`#ac-${this.id}`)&&!e.target.closest(`#search-${this.id}`)) ac.style.display='none'; }, {once:false});
  }

  async selectStop(place) {
    const s = place.stop_area||place.stop_point;
    this.stopAreaId   = s.id;
    this.stopAreaName = s.name;
    this.step = 'lines';
    this.render();
    await this.loadLines();
  }

  // ── Step 2: Lines ───────────────────────────────────────────────────────────
  async loadLines() {
    const body = document.getElementById(`panel-body-${this.id}`);
    if (!body) return;
    body.innerHTML = `
      <div class="step-back" id="back-search-${this.id}">‹ ${this.stopAreaName}</div>
      <div class="panel-loading" id="lines-loading-${this.id}"><div class="spinner"></div><span>Chargement…</span></div>
    `;
    document.getElementById(`back-search-${this.id}`).onclick = () => this.goTo('search');

    try {
      const data = await api('v2/navitia/stop_areas/'+this.stopAreaId+'/lines', {count:40});
      const lines = data.lines||[];
      if (!lines.length) { document.getElementById(`lines-loading-${this.id}`).innerHTML='<div class="panel-empty">Aucune ligne trouvée.</div>'; return; }

      const modeOrder = {'rer':0,'transilien':0,'train':0,'métro':1,'metro':1,'tramway':2,'tram':2,'bus':3,'noctilien':3};
      const getRank = l => { const mode=(l.commercial_modes?.[0]?.name||'').toLowerCase(); const r=Object.entries(modeOrder).find(([k])=>mode.includes(k)); return r?r[1]:4; };
      lines.sort((a,b)=>{ const dr=getRank(a)-getRank(b); return dr||String(a.code||'').localeCompare(String(b.code||''),undefined,{numeric:true}); });

      this.renderLines(body, lines);
    } catch(e) {
      document.getElementById(`lines-loading-${this.id}`).innerHTML=`<div style="font-size:11px;color:var(--danger);padding:12px;">Erreur : ${e.message}</div>`;
    }
  }

  renderLines(body, lines) {
    const loading = document.getElementById(`lines-loading-${this.id}`);
    if (!lines) { if (loading) loading.innerHTML=''; return; }
    if (loading) loading.remove();

    const picker = document.createElement('div');
    picker.className = 'line-picker';
    lines.forEach(l => {
      const info = {code:l.code||l.name, color:l.color, commercial_mode:l.commercial_modes?.[0]?.name||'', codes:l.codes||[]};
      const termini = [...new Set((l.routes||[]).map(r=>r.direction?.stop_area?.name||'').filter(Boolean))].slice(0,2).join(' · ');
      const btn = document.createElement('button');
      btn.className = 'line-btn';
      btn.innerHTML = `${lineIcon(info,20)}<span>${l.name||l.code}</span><span class="line-btn-dest">${termini}</span>`;
      btn.onclick = () => {
        this.lineId   = l.id;
        this.lineInfo = info;
        this.lineRef  = toLineRef(l.id, l.codes||[]);
        this.step     = 'directions';
        this.render();
        this.loadDirections();
      };
      picker.appendChild(btn);
    });
    body.appendChild(picker);
  }

  // ── Step 3: Directions ──────────────────────────────────────────────────────
  async loadDirections() {
    const body = document.getElementById(`panel-body-${this.id}`);
    if (!body) return;
    body.innerHTML = `
      <div class="step-back" id="back-lines-${this.id}">‹ Lignes</div>
      <div class="panel-loading" id="dir-loading-${this.id}"><div class="spinner"></div><span>Chargement…</span></div>
    `;
    document.getElementById(`back-lines-${this.id}`).onclick = () => { this.step='lines'; this.render(); this.loadLines(); };

    try {
      const [routesData, spData] = await Promise.all([
        api('v2/navitia/lines/'+this.lineId+'/routes',{count:10}),
        api('v2/navitia/stop_areas/'+this.stopAreaId+'/lines/'+this.lineId+'/stop_points',{count:30}).catch(()=>({stop_points:[]}))
      ]);
      let stopPoints = spData.stop_points||[];
      if (!stopPoints.length) {
        const fb = await api('v2/navitia/stop_areas/'+this.stopAreaId+'/stop_points',{count:30}).catch(()=>({stop_points:[]}));
        stopPoints = fb.stop_points||[];
      }
      this._stopPoints = stopPoints;
      const routes = routesData.routes||[];

      const loading = document.getElementById(`dir-loading-${this.id}`);
      if (loading) loading.remove();

      const picker = document.createElement('div');
      picker.className = 'dir-picker';
      routes.forEach(route => {
        const terminus = route.direction?.stop_area?.name||route.name||'?';
        const routeSpIds = stopPoints.filter(sp=>!sp.routes?.length||sp.routes.some(r=>r.id===route.id)).map(sp=>sp.id);
        const spIds = routeSpIds.length ? routeSpIds : stopPoints.map(sp=>sp.id);
        const arrow = route.direction_type==='inbound' ? '←' : '→';
        const btn = document.createElement('button');
        btn.className = 'dir-btn';
        btn.innerHTML = `<span class="dir-arrow">${arrow}</span><span>${terminus}</span>`;
        btn.onclick = () => {
          this.terminus = terminus;
          this.spIds    = spIds;
          this.step     = 'departures';
          this.render();
          this.refreshDepartures();
          this.startTimer();
        };
        picker.appendChild(btn);
      });

      const body2 = document.getElementById(`panel-body-${this.id}`);
      if (body2) body2.appendChild(picker);
    } catch(e) {
      const loading = document.getElementById(`dir-loading-${this.id}`);
      if (loading) loading.innerHTML=`<div style="font-size:11px;color:var(--danger);padding:12px;">Erreur : ${e.message}</div>`;
    }
  }

  // ── Step 4: Departures ──────────────────────────────────────────────────────
  renderDepartures(body) {
    body.innerHTML = `
      <div class="departures-view">
        <div class="dep-list" id="dep-list-${this.id}">
          <div class="panel-loading"><div class="spinner"></div></div>
        </div>
        <div class="panel-footer">
          <div class="footer-rt">
            <div class="rt-dot"></div>
            <span class="rt-label" id="rt-label-${this.id}">temps réel</span>
          </div>
          <div class="footer-progress">
            <div class="footer-progress-bar" id="fp-bar-${this.id}" style="width:100%"></div>
          </div>
          <span class="footer-countdown" id="fp-cd-${this.id}">${this.countdown}s</span>
          <button class="footer-now" onclick="panels[${this.id}].manualRefresh()">↻</button>
        </div>
      </div>
    `;
  }

  updateDepList() {
    const list = document.getElementById(`dep-list-${this.id}`);
    if (!list) return;

    if (!this.departures.length) {
      list.innerHTML = '<div class="panel-empty"><span style="font-size:22px;">🕐</span><span>Aucun passage imminent</span></div>';
      return;
    }

    const now = Date.now();
    list.innerHTML = '';
    this.departures.slice(0, 6).forEach(dep => {
      const expected = new Date(dep.expectedTime);
      const aimed    = dep.aimedTime ? new Date(dep.aimedTime) : null;
      const waitMin  = Math.round((expected - now) / 60000);
      const timeStr  = formatTime(expected);

      let chipClass = '';
      let label = timeStr;
      if (dep.vehicleAtStop || waitMin <= 0) { chipClass='quai'; label='À quai'; }
      else if (waitMin <= 1) { chipClass='soon'; label='1 min'; }
      else if (waitMin <= 4) { chipClass='soon'; label=waitMin+' min'; }

      if (dep.cancelled) chipClass='cancelled';

      let delay = '';
      if (aimed && dep.realtime) {
        const d = Math.round((expected-aimed)/60000);
        if (d>0) delay=`<span class="dep-delay late">+${d}'</span>`;
        else if (d<0) delay=`<span class="dep-delay early">${d}'</span>`;
      }

      const row = document.createElement('div');
      row.className = 'dep-row';
      row.innerHTML = `
        <div class="dep-dest">${dep.destination||this.terminus}</div>
        <div class="dep-times">
          ${delay}
          <span class="dep-chip ${chipClass}">${label}</span>
        </div>
      `;
      list.appendChild(row);
    });
  }

  async refreshDepartures() {
    const strategy = getSiriStrategy(this.lineInfo?.commercial_mode);
    let deps = [], isRT = false;

    if (strategy === 'stop-monitoring') {
      for (const spId of this.spIds) {
        const monRef = toMonRef(spId);
        if (!monRef) continue;
        try {
          const data = await api('stop-monitoring', {MonitoringRef:monRef, MaximumStopVisits:20});
          const parsed = parseStopMon(data, this.terminus);
          if (parsed.length) { deps=parsed; isRT=true; break; }
        } catch(e) { /* ignore */ }
      }
    } else {
      if (this.lineRef) {
        try {
          const data = await api('requete-ligne', {LineRef:this.lineRef});
          deps = parseSiri(data, this.spIds, this.terminus);
          isRT = true;
        } catch(e) { /* ignore */ }
      }
    }

    if (!deps.length && this.spIds.length) {
      try {
        const data = await api('v2/navitia/stop_points/'+this.spIds[0]+'/departures',{count:15});
        deps = parseNavitia(data.departures||[], this.terminus);
        isRT = false;
      } catch(e) { /* ignore */ }
    }

    this.departures = deps;
    this.isRT = isRT;

    const rtLabel = document.getElementById(`rt-label-${this.id}`);
    const rtDot   = this.el.querySelector('.rt-dot');
    if (rtLabel) rtLabel.textContent = isRT ? 'temps réel' : 'théorique';
    if (rtDot)   rtDot.style.background = isRT ? 'var(--success)' : 'var(--warn)';

    this.updateDepList();
  }

  // ── Timer ───────────────────────────────────────────────────────────────────
  startTimer() {
    this.stopTimer();
    this.countdown = REFRESH_SEC;
    this.timer = setInterval(() => {
      this.countdown--;
      const cd  = document.getElementById(`fp-cd-${this.id}`);
      const bar = document.getElementById(`fp-bar-${this.id}`);
      if (cd)  cd.textContent  = this.countdown + 's';
      if (bar) bar.style.width = (this.countdown / REFRESH_SEC * 100) + '%';
      if (this.countdown <= 0) {
        this.countdown = REFRESH_SEC;
        this.refreshDepartures();
      }
    }, 1000);
  }

  stopTimer() { clearInterval(this.timer); this.timer=null; }

  async manualRefresh() {
    this.countdown = REFRESH_SEC;
    await this.refreshDepartures();
  }

  // ── Navigation ──────────────────────────────────────────────────────────────
  goTo(step) {
    this.stopTimer();
    this.step = step;
    this.render();
  }

  reset() {
    this.stopTimer();
    this.step = 'search';
    this.stopAreaId = null; this.stopAreaName = null;
    this.lineId = null; this.lineInfo = null; this.lineRef = null;
    this.spIds = []; this.terminus = null;
    this.departures = []; this.isRT = false;
    this.render();
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
const panels = [];
const grid = document.getElementById('grid');

for (let i=0; i<PANEL_COUNT; i++) {
  const el = document.createElement('div');
  el.className = 'panel';
  grid.appendChild(el);
  const panel = new Panel(i);
  panel.mount(el);
  panels.push(panel);
}
</script>
</body>
